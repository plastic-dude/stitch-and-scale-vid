body: >-
  Fresh research moved the concept from a generic anti-AI warning to a verification boundary: a polished
  or generated-looking sentence is not, by itself, technical or physical craft evidence. Do not generate or
  upload. The checked state has no current approved product surface for AI, generated text, model provenance,
  or human-review indicators, and no product capability may be implied. Next action: provide one current
  approved non-private product-surface proof capture or registry entry with product version/date and exact
  visible labels, then rerun claims, rights, captions, audio, platform, and acceptance validation.
