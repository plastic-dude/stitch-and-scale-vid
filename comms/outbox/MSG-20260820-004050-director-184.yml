research:
  note: research/2026-08-20-pass182-browser-findings.md
  question: When a craft workflow contains many valid tasks, how does a person find the next needed action without memory or hunting?
  sources: [921, 922, 923, 924, 925]
  decision: Narrowed from broad mobile usability to next-action findability and honest action semantics.
distinctness:
  nearest_prior: readability-under-load
  changed_pain: Visual/cognitive load versus a valid next action hidden among tasks, vague labels, unclear order, misleading statuses, or absent location cues.
  changed_metaphor: Crowded tabletop of task cards becomes one surfaced action card with purpose, order rule, status, hint, and location.
  hook: A task can exist and still be hard to find.
  final_line: Name the next action where the work is.
objective: Make the trust question of next-action findability visible without claiming that Stitch & Scale currently provides a task list, guided workflow, glossary, or accessibility conformance.
audience: Independent knitwear designers and pattern publishers managing many human evidence tasks; secondary founding testers and reviewers.
