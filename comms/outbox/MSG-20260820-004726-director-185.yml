research:
  note: research/2026-08-20-pass183-browser-findings.md
  question: When a craft worker pauses a multi-step pattern or production task, what makes returning safe and intelligible rather than merely possible?
  sources: [926, 927, 928, 929, 930]
  decision: Narrowed from generic offline continuity or persistence to the first safe return after interruption.
distinctness:
  nearest_prior: offline-continuity
  changed_pain: Work remains safe under network loss versus a person returning after a pause without a clear last-known step, saved/unsaved distinction, sequence context, or safe next action.
  changed_metaphor: Connected/local state becomes a paused row of pattern cards with a bookmark, saved timestamp, unresolved card, and one return arrow.
  hook: Saved is not the same as ready to resume.
  final_line: Show the person where to begin again.
objective: Make the trust question of safe re-entry after a pause visible without claiming that Stitch & Scale currently saves, resumes, checkpoints, or restores work.
audience: Independent knitwear designers and pattern publishers moving between craft-production and human evidence tasks; secondary founding testers and reviewers.
