subject: Pass 184 blocked — completion-boundary-state pending current product proof
research:
  note: research/2026-08-20-pass184-browser-findings.md
  question: When several people or roles touch a craft-production workflow, what evidence distinguishes genuinely complete work from work merely saved, in progress, waiting, blocked, or carrying a problem at handoff?
  sources: [931, 932, 933, 934, 935]
  decision: Narrowed from next-action findability to the boundary between a named status and the evidence required to defend that status at handoff.
distinctness:
  nearest_prior: discoverability-state
  changed_pain: Finding the next action among tasks versus distinguishing status from owner, evidence required/present, blocker, review, and next action at handoff.
  changed_metaphor: Crowded task table becomes a completed-looking handoff card separated from its evidence contract.
  hook: A status can say complete before the evidence is complete.
  final_line: Name what completion still needs.
objective: Make the trust question of status-versus-evidence visible at a multi-role handoff without claiming that Stitch & Scale currently marks completion, enforces gates, assigns ownership, or guarantees release readiness.
audience: Independent knitwear designers and pattern publishers coordinating human evidence gates; secondary founding testers and reviewers.
