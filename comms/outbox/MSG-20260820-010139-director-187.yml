research:
  note: research/2026-08-20-pass185-browser-findings.md
  question: When a craft-production workflow has evidence attached to a gate, what makes that evidence qualified for the decision rather than merely present?
  sources: [936, 937, 938, 939, 940]
  decision: Narrowed from evidence presence or completion status to the qualification boundary of the evidence itself.
distinctness:
  nearest_prior: completion-boundary-state
  changed_pain: A status needs evidence at handoff versus evidence itself needs item, condition, method/source, reviewer, limitation, and permitted decision before it can support a claim.
  changed_metaphor: Completed-looking handoff card becomes a full evidence envelope with a bounded decision card.
  hook: Evidence can be real and still not qualify this decision.
  final_line: Name what this evidence is allowed to prove.
objective: Make the trust question of evidence qualification visible without claiming that Stitch & Scale currently validates, qualifies, certifies, or guarantees evidence.
audience: Independent knitwear designers and pattern publishers coordinating craft-production evidence gates; secondary founding testers and reviewers.
