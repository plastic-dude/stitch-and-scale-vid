research:
  note: research/2026-08-20-pass186-browser-findings.md
  question: When a change is discovered after other craft-production work has started, what makes correction safe?
  sources: [941, 942, 943, 944, 945]
  decision: Narrowed from generic reversibility or version history to the review boundary before a correction is applied or allowed to propagate.
distinctness:
  nearest_prior: qualification-state
  changed_pain: Evidence qualifies for a decision versus a correction needs affected-output/gate scope, review, reversibility or amendability, owner, and next check before downstream work continues.
  changed_metaphor: Evidence envelope becomes a paper thread connecting a proposed correction to downstream outputs.
  hook: An edit is not safe just because it is possible.
  final_line: Name what this change reaches before you apply it.
objective: Make the trust question of a correction boundary visible after downstream work has begun without claiming that Stitch & Scale currently offers undo, impact analysis, propagation control, or correction safety.
audience: Independent knitwear designers and pattern publishers coordinating craft-production outputs and human evidence gates; secondary founding testers and reviewers.
