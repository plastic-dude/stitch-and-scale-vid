research:
  note: research/2026-08-20-pass187-browser-findings.md
  question: When a craft-production review request is sent, what makes it a living responsibility rather than an unanswered message?
  sources: [946, 947, 948, 949, 950]
  decision: Narrowed from generic handoff, escalation, acknowledgement, and status history to request ownership and response closure.
distinctness:
  nearest_prior: rollback-boundary-state
  changed_pain: Scoping a correction before downstream propagation versus ensuring a review request has an owner, response expectation, visible waiting state, and closure after send.
  changed_metaphor: Correction thread becomes a paper request card moving into an unmarked tray and returning with a named owner and response expectation.
  hook: Sent is not the same as owned.
  final_line: Name who answers, by when, and what closes the request.
objective: Make the trust question of review-request ownership visible without claiming that Stitch & Scale currently routes requests, assigns owners, provides response commitments, tracks waiting, guarantees response, or closes requests.
audience: Independent knitwear designers and pattern publishers coordinating craft-production reviews and human evidence gates; secondary founding testers and reviewers.
