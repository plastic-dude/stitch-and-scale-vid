claim_risks:
  - Do not claim Stitch & Scale resolves requests, detects errors, suggests corrections, updates artifacts, or closes review loops.
  - Do not claim acknowledgement means approval, refusal, completion, or resolution.
  - Do not claim WCAG conformance, accessibility outcomes, accuracy, legal compliance, or formal assurance.
  - Do not describe David as a knitter, knitwear designer, pattern designer, technical editor, or tester.
  - Keep calculation, technical editing, physical print review, chart readability, schematic scale, and test knitting separate.
