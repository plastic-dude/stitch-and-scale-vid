research:
  note: research/2026-08-20-pass188-browser-findings.md
  question: When a craft-production review request receives a reply, what distinguishes a real resolution from a receipt, acknowledgement, deadline, or generic suggestion?
  sources: [951, 952, 953, 954, 955]
  decision: Narrowed from request ownership and response expectation to the semantic jump from a received reply to a closed or safely transferred issue.
distinctness:
  nearest_prior: request-ownership-state
  changed_pain: A request has an owner and response expectation versus a reply actually identifying the issue, decision, reason/correction, affected artifact/gate, next action, and closure state.
  changed_metaphor: Request card in an unmarked tray becomes a reply card with acknowledgement crossed out and a bounded resolution card attached.
  hook: A reply is not the same as a resolution.
  final_line: Show what changed, why, and what closes next.
objective: Make the trust question of response-to-resolution closure visible without claiming that Stitch & Scale currently resolves requests, detects errors, suggests corrections, updates artifacts, or closes review loops.
audience: Independent knitwear designers and pattern publishers coordinating craft-production reviews, corrections, and human evidence gates; secondary founding testers and reviewers.
