research:
  note: research/2026-08-20-pass189-browser-findings.md
  question: When one craft-production issue is resolved, what verifies that adjacent work, gates, and outputs are not still unresolved?
  sources: [956, 957, 958, 959, 960]
  decision: Narrowed from response-to-resolution closure to the boundary between closing one named item and claiming that adjacent workflow work is closed.
distinctness:
  nearest_prior: resolution-state
  changed_pain: A reply becomes a meaningful issue-level resolution versus that resolution being mistaken for closure of every related output, human gate, or production stage.
  changed_metaphor: Reply card becomes resolution card versus one resolved card sitting over a row of neighboring craft-production cards.
  hook: One resolved issue does not close the whole workflow.
  final_line: Show what is closed—and what is still open.
objective: Make the trust question of closure scope visible without claiming that Stitch & Scale currently exposes workflow completion, task status, adjacent checks, or human-gate outcomes.
audience: Independent knitwear designers and pattern publishers coordinating craft-production outputs and human evidence gates; secondary founding testers and reviewers.
