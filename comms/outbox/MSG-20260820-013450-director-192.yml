  question: Before a craft-production output is published or handed off, what proves that the exact output, scope, review state, rights, and disposition are ready to transfer rather than merely resolved or partly closed?
  sources: [961, 962, 963, 964, 965]
  decision: Narrowed from surrounding-work closure to the exact output package and transfer scope at a publication or handoff boundary.
distinctness:
  nearest_prior: closure-scope-state
  changed_pain: What remains open around one issue-level closure versus whether an exact output package is ready for a specific publication or handoff without silently expanding the approval.
  changed_metaphor: Resolved card over neighboring craft-production cards becomes an output envelope that remains unsealed until its release boundary is explicit.
  hook: Ready to hand off is not the same as resolved.
  final_line: Name the exact output this approval releases.
objective: Make the trust question of publication-boundary readiness visible without claiming that Stitch & Scale currently provides release approval, export assurance, publication controls, or handoff guarantees.
