research:
  note: research/2026-08-20-pass192-browser-findings.md
  question: How should a craft-production change be communicated to the affected audience, distinguishing an internal change record from a public notice with scope, impact, timing, owner, and safe next action?
  sources: [971, 972, 973, 974, 975]
  decision: Narrowed from audience-facing readiness to the communication path for a material change after it exists, including affected audience, impact, timing, owner/channel, action, limitation, and disposition.
distinctness:
  nearest_prior: audience-readiness-state
  changed_pain: Whether an output is ready for an external person or use versus whether a material change reaches the affected audience with enough context to understand and act on it.
  changed_metaphor: Internal folder beside public-facing sample becomes internal revision note beside a blank audience notice.
  hook: A change recorded is not a change understood.
  final_line: Name who needs to know, what changed, and what they do next.
objective: Make the trust question of change communication visible without claiming that Stitch & Scale provides notification, alert, errata, change-log, public-disclosure, or audience-delivery capabilities.
audience: Independent knitwear designers and pattern publishers coordinating craft-production outputs, revisions, technical editing, testing, feedback, and submissions; secondary founding testers and reviewers.
