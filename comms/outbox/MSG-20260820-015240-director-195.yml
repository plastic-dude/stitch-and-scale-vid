claim_risks:
  - Do not claim Stitch & Scale provides delivery, notification, read receipts, acknowledgement, comprehension checks, adoption measurement, or audience outcomes.
  - Do not claim a notice was sent, delivered, read, understood, or acted on.
  - Do not claim WCAG conformance or accessibility outcomes.
  - Do not describe David as a knitter, knitwear designer, pattern designer, technical editor, or tester.
  - Keep calculation, technical editing, physical print review, chart readability, schematic scale, and test knitting separate.
