research:
  note: research/2026-08-20-pass193-browser-findings.md
  question: What evidence shows that an intended recipient actually received, understood, and acknowledged a material craft-production change, distinguishing delivery, receipt, comprehension, and adoption?
  sources: [976, 977, 978, 979, 980]
  decision: Narrowed from constructing a bounded change notice to the evidence boundary after a notice exists: delivery attempt, receipt, acknowledgement, comprehension, action, and residual uncertainty.
distinctness:
  nearest_prior: change-communication-state
  changed_pain: What a material change notice should contain versus whether the intended recipient has actually received, acknowledged, understood, and acted on it.
  changed_metaphor: Revision note beside blank audience notice becomes notice card moving along a receipt track that stops before confirmation.
  hook: Delivered is not the same as understood.
  final_line: Name what was received—and what is still unconfirmed.
objective: Make the trust question of receipt evidence visible without claiming that Stitch & Scale provides delivery, notification, read receipts, acknowledgement, comprehension checks, adoption measurement, or audience outcomes.
audience: Independent knitwear designers and pattern publishers coordinating craft-production outputs, revisions, technical editing, testing, feedback, and submissions; secondary founding testers and reviewers.
