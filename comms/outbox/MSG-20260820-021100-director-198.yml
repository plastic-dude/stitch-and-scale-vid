  nearest_prior: effect-state
  changed_pain: Whether an artifact or gate changed versus whether the observed difference is acceptable for a specific intended use.
  changed_metaphor: Before/after cards on hold become a visible effect beside a blank intended-use acceptance card.
  hook: Changed is not the same as fit for use.
  final_line: Name the intended use, the test, and the limit of what passed.
