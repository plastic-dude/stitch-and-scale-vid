  question: What evidence shows that an observed downstream effect is acceptable for the intended use, distinguishing a change observed, evidence qualified, and fit for purpose?
  sources: [991, 992, 993, 994, 995]
  decision: Narrowed from whether an observed downstream difference exists to whether it satisfies requirements for a specific intended use with objective tests, user evidence where relevant, limitations, a decision owner, and disposition.
