hook: Fit for use is not the same as authorized for this scope.
final_line: Name who can accept it, what they accepted, and when the decision must be checked again.
research_question: >-
  When an observed effect appears fit for an intended use, what evidence shows that
  the acceptance decision is authorized, bounded, reversible, and recorded by the
  person or role accountable for that decision?
research_file: research/2026-08-20-pass197-browser-findings.md
research_decision: >-
  Separate suitability evidence from authority, scope, limitations, review trigger,
  and durable decision record.
research_sources:
  - NIST RMF separates Assess, Authorize, and Monitor.
  - GOV.UK Check answers separates review from final confirmation and supports correction before submission.
  - Craft Yarn Council separates project evidence, submission requirements, recipient scope, and acceptance.
objective: >-
  Show that suitability evidence is not itself authority to accept a deliverable for
  every scope, recipient, or future use, without claiming Stitch & Scale exposes
  authorization, role, approval, audit, or release controls.
audience: >-
  Independent knitwear designers and pattern publishers coordinating calculations,
  technical editing, physical print review, chart readability, schematic scale, test
