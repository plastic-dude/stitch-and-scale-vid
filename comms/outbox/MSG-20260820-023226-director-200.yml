hook: An authorized decision can still need review when what it depends on changes.
final_line: Show what changed, what depended on it, and what must be checked again.
research_question: >-
  When a decision depends on upstream entities, inputs, or human checks, what should
  happen when one of those dependencies changes, expires, or can no longer be verified?
research_file: research/2026-08-20-pass198-browser-findings.md
research_decision: >-
  Distinguish historical authorization from continued validity after a source, input,
  version, material, or human-gate dependency changes.
research_sources:
  - W3C PROV-DM describes entities, activities, agents, derivation, responsibility, and provenance for trust assessment.
  - W3C PROV-O provides interoperable provenance terms including derivation, revision, and invalidation.
  - Craft Yarn Council guidance requires material checks, notes, gauge, math, measurements, and separate submission evidence.
  - NIST change-control material was a research lead but not used as a primary citation because official extraction redirected.
objective: >-
  Show that an authorized decision may need review when an upstream source, input,
  version, material, or human-gate dependency changes, without claiming Stitch & Scale
  tracks dependencies or invalidates decisions automatically.
audience: >-
  Independent knitwear designers and pattern publishers coordinating calculations,
  technical editing, physical print review, chart readability, schematic scale, test
  knitting, samples, swatches, revisions, tester feedback, submissions, and intended users.
