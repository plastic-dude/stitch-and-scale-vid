hook: Fixed is not the same as reviewed, and reviewed is not the same as cleared for this scope.
final_line: Show the correction, the reviewer, the scope, and the evidence that lets it reopen.
research_question: >-
  What evidence is needed to reopen a held record after correction, so that “fixed” is
  not mistaken for reviewed and cleared for reuse?
research_file: research/2026-08-20-pass200-browser-findings.md
research_decision: >-
  Distinguish correction performed from reviewed clearance for a defined reuse scope.
research_sources:
  - NIST Corrective Action Plan definition links corrective actions to removing/reducing deficiencies and obtaining or sustaining authorization.
  - GOV.UK error guidance preserves failing inputs and explains what went wrong and how to fix it.
  - Craft Yarn Council keeps project, gauge, instructions, measurements, charts, schematic, notes, mathematics, and recipient-specific checks distinct.
objective: >-
  Show that completing a correction does not itself clear a held record for reuse;
  reopening needs reviewed evidence, accountable ownership, defined scope, and a
  recorded disposition, without claiming that Stitch & Scale currently exposes
  corrective-action or clearance controls.
audience: >-
  Independent knitwear designers and pattern publishers coordinating calculations,
  technical editing, physical print review, chart readability, schematic scale, test
  knitting, samples, swatches, revisions, tester feedback, submissions, and intended users.
