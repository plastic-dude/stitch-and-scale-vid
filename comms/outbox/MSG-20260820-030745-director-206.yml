hook: A change is an event. Its impact is a question. The decision needs evidence.
final_line: Name what changed, what you observed, what supports it, and who decides what happens next.
research_question: >-
  When a relevant change triggers review, how should the workflow distinguish the
  event itself from the downstream evidence, scope, and decision it may affect?
research_file: research/2026-08-20-pass203-browser-findings.md
research_decision: >-
  Separate the change event from affected surface, observed result, supporting evidence, and decision.
research_sources:
  - NIST defines impact analysis as determining how far a change affected or may have affected a system state.
  - NIST Risk Management Framework describes a repeatable and measurable risk-management process.
  - GOV.UK records user needs, acceptance criteria, supporting evidence, and rationale.
  - Craft Yarn Council keeps gauge, instructions, reading, and human craft checks distinct.
objective: >-
  Show that a change event is not itself an impact finding: record what changed,
  which surface may be affected, what was observed, what evidence supports that
  observation, and who owns the next decision, without claiming that Stitch & Scale
  currently performs impact analysis.
audience: >-
  Independent knitwear designers and pattern publishers coordinating calculations,
  technical editing, physical print review, chart readability, schematic scale, test
  knitting, samples, swatches, revisions, tester feedback, submissions, and intended users.
