hook: A result without its boundary invites a use it never tested.
final_line: Keep the result with its scope, its limits, and what it cannot prove.
research_question: >-
  How should a criteria-fit result state its limitations so that people do not reuse it
  outside the tested scope or infer certainty that the evidence does not support?
research_file: research/2026-08-20-pass205-browser-findings.md
research_decision: >-
  Keep scope, uncertainty, limitations, and cannot-conclude boundaries attached to the result.
research_sources:
  - NIST states traceability alone does not guarantee fitness for purpose and results apply to the specific instrument or standard at the time of test unless otherwise stated.
  - UK Government Statistical Service recommends communicating limitations, uncertainty, appropriate uses, and what users can and cannot conclude, with critical caveats prominent.
  - W3C WCAG-EM requires defined scope, sample, evaluation, and reporting.
  - Craft Yarn Council keeps gauge, instructions, and human craft checks distinct.
objective: >-
  Show that a criteria-fit result must carry its scope, uncertainty, limitations,
  and cannot-conclude boundary so it is not reused as universal proof, without
  claiming that Stitch & Scale currently records or enforces these fields.
audience: >-
  Independent knitwear designers and pattern publishers coordinating calculations,
  technical editing, physical print review, chart readability, schematic scale, test
  knitting, samples, swatches, revisions, tester feedback, submissions, and intended users.
