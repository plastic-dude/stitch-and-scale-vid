hook: A source can be real and still not be enough for this decision.
final_line: Name the use, qualify the evidence, and keep the decision bounded when the basis is not enough.
research_question: >-
  How should a workflow decide whether a source or evidence item is relevant and
  sufficient for a specific intended use, rather than treating every named source
  as equally useful proof?
research_file: research/2026-08-20-pass207-browser-findings.md
research_decision: >-
  Qualify a source against named use, relevance, timeliness, validity, completeness,
  accuracy basis, integrity, sample coverage, and method before relying on it.
research_sources:
  - GOV.UK defines data quality as fitness for purpose and distinguishes completeness, uniqueness, consistency, timeliness, validity, and accuracy.
  - NIST evidence management separates evidence integrity and chain-of-custody condition in its forensic context.
  - W3C WCAG-EM 2 bounds scope, sample, expertise, and reporting.
  - Craft Yarn Council keeps instructions, gauge, and human activities distinct.
objective: >-
  Show that a source or evidence item should be qualified against a named intended use
  for relevance, timeliness, validity, completeness, accuracy basis, integrity, sample
  coverage, and method before it supports a decision, without claiming that Stitch & Scale
  currently qualifies sources or blocks unsupported decisions.
audience: >-
  Independent knitwear designers and pattern publishers coordinating calculations,
  technical editing, physical print review, chart readability, schematic scale, test
  knitting, samples, swatches, revisions, tester feedback, submissions, and intended users.
