hook: Qualified evidence is not automatically evidence for this claim.
final_line: Name the claim, the context, and the evidence that actually applies.
research_question: >-
  How should a qualified evidence item be tested for applicability to the exact claim
  or decision context, rather than being treated as sufficient merely because it passed
  a source-qualification step?
research_file: research/2026-08-20-pass208-browser-findings.md
research_decision: >-
  Identify the exact claim, context, user, environment, scope, sample, version, and
  assumptions, then test whether qualified evidence actually bears on that claim.
research_sources:
  - NIST defines validation for a specific intended use and predefined tests.
  - GOV.UK says quality requirements vary by purpose and user.
  - W3C WCAG-EM 2 bounds target scope, user agents, sample, evaluation context, and reporting.
  - Craft Yarn Council keeps gauge materials and instructions tied to the question tested.
objective: >-
  Show that qualified evidence must be tested against the exact claim or decision context,
  including intended use, user, environment, scope, sample, version, and assumptions,
  without claiming that Stitch & Scale currently maps evidence to claims or blocks misapplied evidence.
audience: >-
  Independent knitwear designers and pattern publishers coordinating calculations,
  technical editing, physical print review, chart readability, schematic scale, test
  knitting, samples, swatches, revisions, tester feedback, submissions, and intended users.
