hook: Applicable evidence still needs a visible reason.
final_line: Show the evidence, the reason, the owner, and the limit of the decision.
research_question: >-
  How should a decision record the reasoning that connects applicable evidence to a
  bounded disposition, so another reviewer can inspect the basis without mistaking
  the decision for universal proof?
research_file: research/2026-08-20-pass209-browser-findings.md
research_decision: >-
  Record applicable evidence, inference or reasoning, alternatives, uncertainty, owner,
  scope, conditions, review trigger, bounded disposition, and follow-up.
research_sources:
  - UK Civil Service guidance describes exposing evidence and data so others can check reasoning and consider alternative interpretations.
  - NIST RMF provides repeatable documented risk-process framing.
  - W3C accessibility reporting separates scope, reviewers, methods, dates, results, recommendations, and follow-up.
  - Craft Yarn Council keeps instructions, gauge, and human activities distinct.
objective: >-
  Show that applicable evidence still needs a recorded reasoning link, alternatives or
  uncertainty, owner, scope, conditions, review trigger, and bounded disposition before
  it can support a decision, without claiming that Stitch & Scale currently records
  rationale or makes decisions explainable.
audience: >-
  Independent knitwear designers and pattern publishers coordinating calculations,
