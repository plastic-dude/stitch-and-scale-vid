hook: A reasoned decision can still stop applying when its conditions change.
final_line: Name the conditions, show what changed, and recheck before the decision travels.
research_question: >-
  How should explicit conditions constrain a decision's validity, and when should a
  change in those conditions force reassessment rather than silent reuse?
research_file: research/2026-08-20-pass210-browser-findings.md
research_decision: >-
  Keep entity, purpose, prerequisites, conditions, limitations, scope, baseline, sample,
  version, human-gate condition, change event, review trigger, status, and disposition attached.
research_sources:
  - NIST authorization terminology distinguishes specific permission and documented risk decisions.
  - NIST authorization-package terminology describes assessment results and supporting documentation used in risk-based decisions.
  - W3C WCAG-EM 2 bounds scope, baseline, sample, version, and re-evaluation.
  - Craft Yarn Council keeps specified yarn, needles, stitch, instructions, and gauge tied to the result.
objective: >-
  Show that a reasoned decision remains bounded by explicit entity, purpose, prerequisites,
  material, version, sample, scope, human-gate, limitations, and review-trigger conditions,
  without claiming that Stitch & Scale currently records or enforces conditional decisions.
audience: >-
  Independent knitwear designers and pattern publishers coordinating calculations,
  technical editing, physical print review, chart readability, schematic scale, test
  knitting, samples, swatches, revisions, tester feedback, submissions, and intended users.
