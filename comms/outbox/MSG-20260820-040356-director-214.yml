hook: A named decision is not an owned decision until someone can accept responsibility for its scope and next action.
final_line: Name who owns the decision, who checked it, and what happens when ownership must change.
research_question: >-
  How should accountability for a conditional decision be assigned, maintained, and
  handed back when conditions change, so responsibility is not implied by a label or left with nobody?
research_file: research/2026-08-20-pass211-browser-findings.md
research_decision: >-
  Identify accountable role, authority or scope, evidence supplier, reviewer or checker,
  consulted human gate, condition monitor, handback trigger, coverage or delegate,
  disposition, and review record.
research_sources:
  - NIST defines an authorizing official as a role with authority to formally assume responsibility.
  - ICO accountability guidance requires demonstrable records and ongoing review; page marked under review because of legislative changes.
  - W3C recommends diverse expertise and collaborative evaluation.
  - Craft Yarn Council distributes responsibility across designer, editor, manufacturer, and recipient requirements.
objective: >-
  Show that a conditional decision needs an accountable role, evidence supplier,
  reviewer or checker, consulted human gate, condition monitor, and handback path,
  without claiming that Stitch & Scale currently assigns, routes, or escalates decision ownership.
audience: >-
  Independent knitwear designers and pattern publishers coordinating calculations,
  technical editing, physical print review, chart readability, schematic scale, test
  knitting, samples, swatches, revisions, tester feedback, submissions, and intended users.
