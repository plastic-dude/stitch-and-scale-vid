hook: A pointer is not a path.
final_line: Name the target, the scope, and where the reader returns.
research_question: >-
  When a knitwear instruction points elsewhere, what must remain explicit for a reader
  to find the exact target, preserve size or section context, and return to the next action,
  especially on a mobile screen or after interruption?
research_file: research/2026-08-20-pass212-browser-findings.md
research_decision: >-
  Select cross-reference-state: make source section, source scope, pointer text, target
  section, target version, target scope, target row or step, action, return point, exception,
  and review record visible as distinct fields.
research_sources:
  - Craft Yarn Council explains compressed knitwear notation and the reader inference required by “work same as left piece, reversing shaping”.
  - W3C cognitive guidance recommends clear headings, boundaries, context restoration, and reduced memory dependence, especially when attention is interrupted or mobile use splits attention.
  - WCAG 2.1 covers mobile web content but does not prove Stitch & Scale conformance.
  - TikTok and Meta safe-zone sources are paid-ad guidance and do not establish organic-post rules.
  - YouTube confirms square or vertical Shorts upload guidance and rights obligations for protected material.
objective: >-
  Show that a cross-reference in a knitwear instruction needs an exact target, scope,
  version, row or step, action, and return point, without claiming that Stitch & Scale
  currently resolves, parses, highlights, or validates cross-references.
audience: >-
  Independent knitwear designers and pattern publishers coordinating calculations,
  technical editing, physical print review, chart readability, schematic scale, test
  knitting, samples, swatches, revisions, tester feedback, submissions, and intended users.
