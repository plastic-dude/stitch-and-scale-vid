hook: A number can be useful without being settled.
final_line: Name what happened, what you estimated, and what the formula still depends on.
research_question: >-
  How should an independent knitwear designer distinguish a recorded cost from an
  estimate, derived calculation, or assumption when samples, testing, editing,
  materials, postage, fees, and time feed into business decisions?
research_file: research/2026-08-20-pass213-browser-findings.md
research_decision: >-
  Select record-estimate-state: keep recorded facts, estimates, derived values,
  and assumptions visibly distinct with source, date or period, formula, and review context.
research_sources:
  - SBA break-even guidance separates estimated fixed and variable costs and warns that planning analysis is not complete accounting before costs and production occur.
  - SBA business-plan guidance distinguishes cost structure, revenue streams, projections, and historical statements.
  - Craft Yarn Council asks designers to keep notes, preserve materials and yarn amounts, check math, submit technical and schematic materials, invoice, and account for return shipping.
  - Local craft-business records guidance distinguishes recorded expense events, estimates, derived rollups, and assumptions and requires visible formulas and source labels.
objective: >-
  Show that a business number can be recorded, estimated, derived, or assumed,
  and that a planning calculation should keep those states visible rather than
  presenting an estimate as settled accounting.
audience: >-
  Independent knitwear designers and pattern publishers coordinating design lifecycle,
  yarn and material costs, samples, grading, technical editing, photography, testing,
  marketplace fees, shipping, submissions, invoices, payments, and early business planning.
