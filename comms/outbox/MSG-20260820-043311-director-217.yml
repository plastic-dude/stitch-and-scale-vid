hook: A substitute can fit the gauge and still need a record.
final_line: Name what fits, who confirmed it, where it is disclosed, and what remains to review.
research_question: >-
  When a knitwear project uses a yarn other than the named yarn, what must remain
  explicit about material fit, gauge, fiber structure, dye lot, availability,
  editor or publisher confirmation, disclosure, and test evidence before the
  substitution can travel into a pattern or submission?
research_file: research/2026-08-20-pass214-browser-findings.md
browser_support_file: research/2026-08-20-pass214-cyc-browser-findings.md
research_decision: >-
  Select substitution-authorization-state: keep fit evidence, confirmation scope,
  disclosure location, and human review visibly separate around a proposed substitute.
research_sources:
  - Craft Yarn Council says to reconfirm yarn and color selection with an editor or design director, check dye lots, confirm availability and sample size, keep notes, discuss alternatives, and match the project gauge with a swatch.
  - Craft Yarn Council calls yarn-weight and gauge ranges guidelines and says to follow the pattern’s stated gauge.
  - Knitty warns against substituting by gauge alone and recommends considering fiber content, structure, pattern behavior, row gauge, and a large substitution swatch.
  - Knitty submission guidance separates yarn characteristics, alternates, pattern files, images, schematics, originality, and publication permission.
objective: >-
  Show that a yarn substitute needs separate fit evidence, confirmation scope,
  disclosure location, and review evidence; do not collapse those into an approval claim.
audience: >-
  Independent knitwear designers and pattern publishers coordinating yarn choice,
  swatches, pattern instructions, grading, technical editing, samples, test knitting,
  submissions, and intended users.
