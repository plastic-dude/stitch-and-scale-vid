hook: A test result needs the conditions that make it readable.
final_line: Name what was tested, under which conditions, and what the result still cannot prove.
research_question: >-
  What must a knitwear test record preserve about inputs, method, conditions, scope,
  observer, result, uncertainty, and limits before a test result can be interpreted or
  repeated without being mistaken for publication clearance?
research_file: research/2026-08-20-pass215-browser-findings.md
research_decision: >-
  Select test-protocol-state: keep question, scope, inputs, method, conditions,
  observer, result, uncertainty, limit, and follow-up visible around a test record.
research_sources:
  - The National Academies distinguishes reproducibility from replicability, emphasizes visible inputs, methods, conditions, uncertainty, and limits, and cautions that exact reproduction does not guarantee correctness.
  - NCBI Bookshelf summarizes the same report and separates a transparent or repeatable result from proof of correctness or generality.
  - Craft Yarn Council requires reconfirming yarn and color, checking dye lots and availability, confirming sample size, keeping notes, completing a gauge swatch with stitch and row counts, and preserving instructions, measurements, schematics, and submission responsibilities.
  - Craft Yarn Council’s hook-and-needle guidance says metric sizing is accurate and that a gauge swatch should be compared with the pattern gauge.
objective: >-
  Show that a test result needs a visible question, scope, inputs, method, conditions,
  observer, result, uncertainty, and limit before anyone can interpret what it supports.
audience: >-
  Independent knitwear designers, technical editors, test knitters, craft-business
  operators, and pattern readers coordinating pattern versions, sizes, materials,
  swatches, instructions, charts, schematics, and review evidence.
