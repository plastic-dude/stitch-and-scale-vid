hook: The same record does not need to travel whole.
final_line: Name the purpose, the audience, and the fields that do not need to travel.
research_question: >-
  When a craft or tester record contains more fields than each viewer needs, what
  must be explicit about purpose, audience, field exposure, redaction or pseudonymization,
  reuse, and review before the record is shown beyond its original workflow?
research_file: research/2026-08-20-pass216-browser-findings.md
research_decision: >-
  Select selective-disclosure-state: keep purpose, audience, necessity, visible fields,
  hidden fields, redaction or role labels, reuse compatibility, and exposure review visible.
research_sources:
  - ICO purpose-limitation guidance updated 23 March 2026 says purposes should be specified, documented, and communicated, and reuse should be compatible with the original purpose; it connects purpose specification with minimization, accountability, and avoiding function creep.
  - ICO data-minimization guidance describes data as adequate, relevant, and limited to what is necessary for a specified purpose, but says the guidance is under review.
  - NIST Privacy Framework Core includes selective collection or disclosure of data elements and frames privacy as risk management rather than a single approval badge.
  - Craft Yarn Council guidance demonstrates that craft submissions can contain contact details, project numbers, yarn labels, instructions, measurements, invoices, and return-shipping information across distinct artifacts.
objective: >-
  Show that one source record may require different fields for different purposes and
  audiences; do not expose the full record by default or claim automatic privacy protection.
audience: >-
  Independent knitwear designers, technical editors, test knitters, craft-business
  operators, and pattern readers coordinating tester notes, materials, submissions,
  review evidence, and handoffs.
