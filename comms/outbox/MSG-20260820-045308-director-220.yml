claims_risk: >-
  Do not claim that Stitch & Scale detects defects, prioritizes risk, assigns owners,
  proposes remedies, records evidence, runs retests, verifies fixes, closes issues,
  or establishes publication readiness. Do not claim that “fixed” means correct,
  complete, safe, accessible, compatible, published, or approved. Do not use real
  unpublished patterns, private tester comments, customer records, incident reports,
  publisher submissions, contracts, personal identifiers, or copyrighted patterns.
  Do not claim revenue, adoption, accuracy, customer outcomes, pricing, credentials,
  testimonials, urgency, or capabilities.
founder_truth: >-
