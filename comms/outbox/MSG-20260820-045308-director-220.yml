hook: Fixed is a status word. Remediation needs the trail.
final_line: Name the finding, the remedy, the evidence, and what still needs review.
research_question: >-
  After a craft or pattern defect is found, what must a remediation record preserve
  about the finding, severity, affected scope, action, owner, evidence, retest,
  and closure before “fixed” can be treated as more than a status word?
research_file: research/2026-08-20-pass217-browser-findings.md
research_decision: >-
  Select remediation-state: keep finding, severity, source, scope, reproduction,
  action, owner, evidence, retest, residual limit, disposition, and review visible.
research_sources:
  - NIST SP 800-115 separates planning and conducting tests, analyzing findings, and developing mitigation strategies while emphasizing test benefits and limitations.
  - NIST SP 800-61r3 frames response around preparation, detection, response, recovery, and continual improvement; it is used only as a bounded process analogy.
  - CISA’s 10 June 2026 directive emphasizes explicit risk criteria, clear definitions, timelines, transparent remediation tracking, and checks for residual compromise rather than assuming a patch ends risk.
  - Craft Yarn Council guidance requires notes, problem discussion, gauge matching, distinct instructions and schematic evidence, and separate submission materials.
  - Internal Stitch & Scale QA guidance requires a defect ledger with code, severity, source, evidence, affected section or sizes, reproduction steps, and disposition.
objective: >-
  Show that “fixed” is not a remediation trail; preserve the finding, severity,
  affected scope, action, owner, evidence, retest, disposition, and residual limit
  before closure is described.
audience: >-
  Independent knitwear designers, technical editors, test knitters, craft-business
  operators, and pattern readers coordinating defect findings, instructions, charts,
  schematics, versions, and human review.
deliverables:
