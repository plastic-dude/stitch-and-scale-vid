hook: First found is not always first to fix.
final_line: Name the evidence, the consequence, and why this finding goes first.
research_question: >-
  When several craft or pattern findings compete for attention, what evidence should
  justify their order before a team treats one as urgent, blocks a release, or starts remediation?
research_file: research/2026-08-20-pass218-browser-findings.md
research_decision: >-
  Select triage-state: keep scope, consequence, urgency signal, dependency, uncertainty,
  rationale, owner, review time, and status visible behind any order.
research_sources:
  - NIST SP 800-30 treats risk assessment as information for deciding appropriate courses of action in response to identified risks.
  - CISA BOD 26-04 uses explicit prioritization variables, roles, validation, tracking, reporting, timelines, and dynamic changes in facts; it applies to federal civilian cyber systems only.
  - Craft Yarn Council lists common competing pattern problems across measurements, sizing, gauge, materials, math, stitch counts, instructions, charts, and schematics, and emphasizes notes and records.
  - Craft Yarn Council submission guidance says to discuss material problems with the manufacturer or editor, reconfirm sample size, keep notes, match gauge, and preserve distinct submission materials.
objective: >-
  Show that the order of competing findings needs visible evidence, scope, consequence,
  urgency signal, dependency, uncertainty, rationale, owner, and review time; a first-in
  list or severity label is not enough.
audience: >-
  Independent knitwear designers, technical editors, test knitters, craft-business
  operators, and pattern readers coordinating multiple findings across instructions,
  sizes, charts, schematics, materials, and review gates.
