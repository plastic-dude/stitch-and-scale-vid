hook: A yarn name is not a material handoff.
final_line: Name the material, the quantity, the window, and what still needs confirmation.
research_question: >-
  What must a knitwear material record preserve before a project can honestly describe
  its yarn, color, quantity, dye lot, supplier confirmation, sample timing, and availability
  as ready for a submission or handoff?
research_file: research/2026-08-20-pass219-browser-findings.md
research_decision: >-
  Select material-availability-state: keep material identity, dye lot, quantity, source,
  availability window, sample size, required-by timing, confirmer, open risk, and status visible.
research_sources:
  - Craft Yarn Council says to reconfirm yarn and color, check dye lots, reconfirm manufacturer availability for at least a year, reconfirm sample size, keep notes, and discuss material problems with the manufacturer or editor.
  - Craft Yarn Council requires yarn type, yardage and weight, fiber content, quantities by size, accessories, measurements, and size-made information in project instructions.
  - Craft Yarn Council’s designer pitfalls list includes missing colors and amounts, discontinued colors, missing accessories, gauge mismatch, missing records, incomplete instructions, and unscaled schematics.
  - Craft Yarn Council standards describe shared labeling and pattern guidelines intended to help consumers select materials and complete projects.
objective: >-
  Show that a yarn name is not a material handoff; preserve yarn, color, dye lot,
  fiber and weight, quantity by size, accessories, supplier/source, availability window,
  sample size, required-by date, confirming role, and open material risk.
audience: >-
  Independent knitwear designers, technical editors, test knitters, craft-business
  operators, and pattern readers coordinating materials, samples, instructions,
  submissions, and handoffs.
