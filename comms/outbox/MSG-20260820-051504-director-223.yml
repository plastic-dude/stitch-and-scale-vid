hook: A date is not a status.
final_line: Name the date’s basis, the dependency, and what acceptance still needs.
research_question: >-
  What must a craft or pattern deadline record distinguish between requested-by,
  committed-by, blocked-by, completed-at, accepted-at, and still-open conditions
  before a team describes work as on time or complete?
research_file: research/2026-08-20-pass220-browser-findings.md
research_decision: >-
  Select deadline-condition-state: keep date basis, request, commitment, dependency,
  block, owner, completion, acceptance, open condition, and status visible.
research_sources:
  - Craft Yarn Council says most magazines and book publishers work six months in advance, asks designers to reconfirm materials and sample size, keep notes, and complete work on time.
  - Craft Yarn Council separates the actual project, gauge swatch, electronic instructions, schematic, invoice, and return shipping as distinct submission materials.
  - Craft Yarn Council’s designer pitfalls list includes missing records, incomplete instructions, missing charts or schematics, late submissions, missing measurements, incorrect math, missing stitch counts, gauge mismatch, missing quantities, and unscaled schematics.
  - Atlassian’s general acceptance-criteria guidance describes clear, concise, testable conditions for completion and acceptance; it is not a Stitch & Scale product claim or a knitwear publication standard.
objective: >-
  Show that a date is not a status; preserve requested-by, committed-by, dependency,
  blocked-by, owner, completed-at, accepted-at, acceptance criteria, open condition,
  date basis, and status as separate fields.
audience: >-
  Independent knitwear designers, technical editors, test knitters, craft-business
  operators, and pattern readers coordinating projects, submissions, and review gates.
