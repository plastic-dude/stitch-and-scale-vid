hook: A care symbol is not the whole instruction.
final_line: Name the treatment, the limit, the warning, and the basis.
research_question: >-
  What must a knitwear care record preserve about washing, bleaching, drying, ironing,
  professional care, temperature, symbols, warnings, blocking, finishing, source, and
  review status before a maker or reader treats it as safe guidance?
research_file: research/2026-08-20-pass221-browser-findings.md
research_decision: >-
  Select care-instruction-state: keep treatment, method, temperature or level, symbol meaning,
  warning, blocking or finishing, source or basis, reviewer, review time, and status visible.
research_sources:
  - Craft Yarn Council describes five care-symbol categories—washing, bleaching, drying, ironing, and professional textile care—and explains temperature, hand-washing, bars, dots, and do-not modifiers.
  - Craft Yarn Council warns not to block acrylic yarn with heat and identifies missing material details, incomplete instructions, missing records, and other workflow gaps.
  - The FTC Care Labeling Rule requires covered manufacturers and importers to provide regular care instructions and warnings with a reasonable basis; it is legal context for covered products, not a Stitch & Scale capability.
  - Government of Canada guidance explains care-symbol categories and qualifiers and notes that the cited Canadian national standard was withdrawn in 2017.
objective: >-
  Show that a care symbol is not the whole instruction; preserve treatment, method,
  temperature or level, symbol meaning, warning or prohibition, blocking or finishing,
  source or basis, reviewer, review time, and status as separate fields.
audience: >-
  Independent knitwear designers, technical editors, test knitters, craft-business
  operators, pattern readers, and recipients coordinating care information.
