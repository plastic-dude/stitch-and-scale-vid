research_decision: >-
  Craft Yarn Council advises checking ball bands for a same dye lot, keeping notes, and preserving labels in a
  submission package. Its yarn-label guidance explains that labels may contain dye-lot information and that batches
  can differ. Lion Brand defines a dye lot as a dye batch and notes that different batches may vary under different
  lighting and may not remain available. Hobbii recommends checking labels on arrival and saving brand, color, lot,
  and gauge in a project journal. Knitty provides current Winter 2026 submission context but no urgency or affiliation.
  Current Instagram, TikTok, YouTube, and W3C sources set conservative mobile, caption, audio, and accessibility gates.
  None of these sources proves a Stitch & Scale material-lot surface.
concept_difference: >-
  Nearest prior is export-identity-state, which concerns whether a released file is the same reviewed artifact.
  Pass 225 concerns which physical material lot was used or recorded for a design/sample. It is narrower than
  material-trace and focuses on the contradiction same color is not the same lot; it does not repeat broad material
  provenance, availability, substitution, sample custody, care, or export identity.
hook: Same color is not the same lot.
final_line: Name the material lot before the sample leaves your memory.
proof_surface: >-
  MATERIAL M-001 / DESIGN_ID / SAMPLE_ID / MATERIAL_NAME / BRAND_OR_SOURCE / FIBER_OR_CONTENT /
  COLOR_NAME / COLOR_CODE / LOT_OR_DYE_LOT / LABEL_REFERENCE / QUANTITY / UNIT / ACQUIRED_AT /
  USED_FROM / SUBSTITUTE_FLAG / OBSERVED_DIFFERENCE / CHECKED_AT / SOURCE_OR_BASIS / REVIEWER /
  REVIEWED_AT / STATUS
material_boundary: >-
  A recorded lot can identify a material record but cannot prove color uniformity, fiber performance, gauge,
  fit, care suitability, technical editing, test-knit success, or publication approval.
claims_boundary: >-
  Do not claim that Stitch & Scale records lots, attaches labels to designs, matches inventory, predicts color
  continuity, validates fiber behavior, confirms gauge, determines care suitability, reconciles quantities, or guarantees outcomes.
rights_boundary: >-
  Use only original generic material cards, approved narrator, consented hand performance, and original or cleared
  label/card sound. Every card must read ILLUSTRATIVE — NOT PRODUCT UI. No real label, supplier image, receipt,
  pattern, customer material, barcode, screenshot, logo, or private record is cleared.
review_and_audio: >-
  One narrator family, human-verified caption-on and caption-free versions, mobile-safe captions that never cover
  faces, hands, material cards, labels, numbers, proof fields, logos, controls, menus, or primary actions, and full-length
  audio QC for doubled words, overlaps, drift, clipping, and room-tone jumps.
next_action: >-
  Provide a current, versioned, non-private, rights-cleared product-proof registry entry or approved capture for
  the exact material-lot surface, confirm destination platform and all asset/privacy rights, then rerun product/data,
  material, claims, founder-truth, human-evidence, rights, narrator, caption, audio, platform, continuity, filename,
  and Director gates.
exact_generator_action: Do not generate or upload. Await Director re-authorization after proof and gate validation.
