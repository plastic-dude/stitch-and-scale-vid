research_decision: >-
  Craft Yarn Council asks designers to reconfirm the sample garment size required to fit the photography model and
  separates the project, swatch, instructions, schematic, labels, invoice, and return shipping. CYC sizing guidance
  separates body measurements, completed-garment measurements, schematics, and ease, and calls the charts guidelines.
  Knitty’s June 17, 2026 guidance asks wearable submissions to be shown on a correctly sized model in the intended way
  and setting, distinguishing oversized from minimal-ease context. Current Instagram, TikTok, YouTube, and W3C sources
  set conservative mobile, caption, audio, and accessibility gates. None of these sources proves a Stitch & Scale image-context surface.
concept_difference: >-
  Nearest prior is dye-lot-state, which concerns lot-level physical-material identity. Pass 226 concerns declared
  context for a pictured sample: size made, model context, fit intention, pose/view, image purpose, rights scope,
  and review status. It is distinct from fit-intent, fit-criteria-state, measurement-provenance, publication-boundary-state,
  sample-return-state, and the imported blocked false-completion/release-gate-roster concepts.
hook: A photo can show the garment and still hide the context.
final_line: Name the context before the photo speaks for itself.
proof_surface: >-
  IMAGE I-001 / DESIGN_ID / SAMPLE_ID / GARMENT_SIZE_MADE / BODY_CONTEXT / MODEL_CONTEXT /
  FINISHED_MEASUREMENTS / EASE_OR_FIT_INTENT / IMAGE_PURPOSE / POSE_OR_VIEW / CAPTURED_AT /
  SOURCE_OR_BASIS / RIGHTS_SCOPE / REVIEWER / REVIEWED_AT / STATUS
image_context_boundary: >-
  An image-context record can describe the pictured sample but cannot prove fit, grading, comfort, size inclusion,
  accessibility, technical editing, test-knit success, or publication acceptance.
claims_boundary: >-
  Do not claim that Stitch & Scale identifies garment size from a photo, matches a model, evaluates fit, verifies ease,
  validates grading, measures a body, checks size inclusion, approves photography, or guarantees outcomes.
rights_boundary: >-
  Use only original abstract silhouettes, fictional context cards, approved narrator, consented hand performance,
  and original or cleared card sound. Every card must read ILLUSTRATIVE — NOT PRODUCT UI. No real model, body,
  garment, publication photo, customer record, pattern, logo, or private data is cleared.
review_and_audio: >-
  One narrator family, human-verified caption-on and caption-free versions, mobile-safe captions that never cover
  faces, hands, cards, numbers, rights fields, logos, controls, menus, or primary actions, and full-length audio QC.
next_action: >-
  Provide a current, versioned, non-private, rights-cleared product-proof registry entry or approved capture for
  the exact image-context surface, confirm destination platform and asset/privacy rights, then rerun product/data,
  image-context, claims, founder-truth, human-evidence, rights, narrator, caption, audio, platform, continuity,
  filename, and Director gates.
