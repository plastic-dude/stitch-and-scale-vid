distinctness_summary: 'Pass 234 asked whether a named source or artifact is editable, reviewed, or released and which review reopens. Pass 235 asks which qualifier travels beside one value or field—required, optional, estimate, conditional, unknown, or not applicable—with scope, unit, size, stage, source, date, limitation, and human check. It is not an interpretation, editability, change-notice, uncertainty, confidence, evidence-coverage, sufficiency, roster, or generic false-completion concept.'
research_summary: 'Current Craft Yarn Council guidance requires precise quantities, units, size, stage, yarn/fiber details, measurements, direction, counts, charts, and schematics; it calls vague phrases such as a small amount of yarn a failure and separately preserves math, gauge, technical editing, print, and other gates. Knitty separates notes, sizes, charts, schematics, rights, technical editing, test knitting, and publication. DOI/Digital.gov support clear audience-specific instructions; WCAG supports labels, relationships, text alternatives, captions, and human evaluation.'
