research_decision: >-
  CYC separates notes, actual project, gauge swatch, instructions, schematic, invoice, return shipping, labels,
  amounts, and size made, and asks designers not to rely on memory. CYC also distinguishes idea, swatch/sketch/sample,
  completed project, acceptance, contract, and review. Knitty separates individual pattern, image, chart, schematic,
  statement, and rights files. Atlassian’s SSoT guidance warns that unclear locations create duplication and conflicting
  information and recommends purpose mapping, update responsibility, and templates. None of these sources proves a
  Stitch & Scale lifecycle or authoritative ledger.
concept_difference: >-
  Nearest prior is translation-state, which follows a source pattern into a target locale. Pass 229 concerns why a
  record exists, which workflow stage it represents, which source it comes from, and which fields are recorded facts,
  derived values, attachments, decisions, owners, limitations, or approvals. It is distinct from selective disclosure,
  workflow-stage, cost allocation, publication boundary, and imported blocked concepts.
hook: A record without a purpose can tell the wrong story.
final_line: Name why the record exists before you read what it means.
proof_surface: >-
  RECORD R-001 / DESIGN_ID / RECORD_PURPOSE / WORKFLOW_STAGE / SOURCE_RECORD_ID / RECORDED_FACTS /
  DERIVED_VALUES / ATTACHMENTS / DECISION_OWNER / NEXT_DECISION / REVIEWER / REVIEWED_AT / STATUS / LIMITATIONS
purpose_boundary: >-
  A purpose record cannot establish the truth of underlying facts, calculations, estimates, financial or tax treatment,
  technical editing, test-knit success, publication approval, or customer outcomes.
claims_boundary: >-
  Do not claim that Stitch & Scale is an authoritative single source of truth, automatically transitions lifecycle stages,
  preserves every record relationship, gives accounting or tax treatment, approves submissions, tracks samples, validates
  technical editing, or proves outcomes.
rights_boundary: >-
  Use only original abstract record cards, approved narrator, consented hand performance, and original or cleared card sound.
  Every card must read ILLUSTRATIVE — NOT PRODUCT UI. No real project, invoice, customer record, sample, submission,
  publication file, pattern, logo, or private data is cleared.
review_and_audio: >-
  One narrator family, human-verified caption-on and caption-free versions, mobile-safe captions that never cover cards,
  values, owner/status, logos, controls, or primary actions, and full-length audio QC.
next_action: >-
  Provide a current, versioned, non-private, rights-cleared product-proof registry entry or approved capture for the exact
  purpose/stage surface, confirm destination platform and asset/privacy rights, then rerun product/data, purpose-scope,
  claims, founder-truth, human-evidence, rights, narrator, caption, audio, platform, continuity, filename, and Director gates.
exact_generator_action: Do not generate or upload. Await Director re-authorization after proof and gate validation.
