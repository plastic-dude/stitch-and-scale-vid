research_decision: >-
  CYC asks designers to reconfirm inputs, check dye lots, reconfirm sample size, keep notes, and not rely on memory,
  while separating labels, swatches, instructions, schematics, invoices, and return shipping. CYC distinguishes idea,
  sample, completed project, acceptance, contract, and review. Knitty separates technical editing, test knitting, charts,
  schematics, photographs, rights, and individual submission files. Atlassian’s DACI template documents decision roles,
  but roles do not prove correctness. None of these sources proves a Stitch & Scale decision-intelligence surface.
concept_difference: >-
  Nearest prior is record-purpose-state, which concerns why a record exists and which workflow stage it represents.
  Pass 230 concerns the evidence and roles beneath a particular decision: observation, source/reference, derivation or
  formula, assumption, decision owner, approver/gate, contributors, informed, open question, decision time, status,
  and limitations. It is distinct from estimate, measurement-provenance, confidence, owner, review, publication, and imported blocked concepts.
hook: A decision is not its explanation until the basis is visible.
final_line: Name what you saw, what you assumed, and who still needs to review it.
proof_surface: >-
  DECISION D-001 / DESIGN_ID / DECISION_PURPOSE / OBSERVATION / SOURCE_OR_REFERENCE /
  DERIVATION_OR_FORMULA / ASSUMPTION / DECISION_OWNER / APPROVER_OR_GATE / CONTRIBUTORS /
  INFORMED / OPEN_QUESTION / DECIDED_AT / STATUS / LIMITATIONS
basis_boundary: >-
  A decision-basis record cannot establish the truth of the observation, formula, estimate, financial or tax treatment,
  technical editing, test-knit success, publication approval, or user outcome.
claims_boundary: >-
  Do not claim that Stitch & Scale evaluates evidence, calculates correctness, recommends decisions, records approvals,
  assigns DACI roles, replaces technical editing, proves test-knit success, gives financial or tax treatment, or establishes publication readiness.
rights_boundary: >-
  Use only original abstract decision cards, approved narrator, consented hand performance, and original or cleared card sound.
  Every card must read ILLUSTRATIVE — NOT PRODUCT UI. No real pattern, test-knit report, customer record, publication decision,
  invoice, logo, or private data is cleared.
review_and_audio: >-
  One narrator family, human-verified caption-on and caption-free versions, mobile-safe captions that never cover cards,
  roles, values, open questions, logos, controls, or primary actions, and full-length audio QC.
next_action: >-
  Provide a current, versioned, non-private, rights-cleared product-proof registry entry or approved capture for the exact
  decision-basis surface, confirm destination platform and asset/privacy rights, then rerun product/data, decision-scope,
  claims, founder-truth, human-evidence, rights, narrator, caption, audio, platform, continuity, filename, and Director gates.
exact_generator_action: Do not generate or upload. Await Director re-authorization after proof and gate validation.
