distinctness_summary: 'Pass 238 asked how variants within one source vocabulary or record can be displayed canonically while preserving raw wording, system, scope, rule, exception, source, and unresolved type. Pass 239 asks which representation exists for a design, what role and scope it serves, and what it cannot prove across prose, chart, schematic, measurement table, photograph, video, and text alternative. It is not normalization, chart parity, chart description, evidence type, package completeness, accessibility certification, acceptance, roster, or generic false-completion.'
research_summary: 'Current Craft Yarn Council guidance treats written instructions, charts, pattern keys, schematics, measurements, and project files as distinct representations and roles. Its pattern-writing overview includes written patterns, video tutorials, charts, graphs, schematics, and combinations, while distinguishing notes, transcription, technical editing, and testing. Knitty’s June 17, 2026 guidance requests a text-only pattern, separate images, chart files where needed, and schematic files. W3C says accessible tables need structural header/data relationships and complex images need text alternatives. Presence is not parity, accessibility conformance, technical correctness, or acceptance.'
