distinctness_summary: 'Pass 241 asked what exact subject, version, size/sample, representation, conditions, question, finding, limit, and outside-scope boundary were inspected. Pass 243 asks what makes the question itself concrete, scoped, answerable, and evidence-bearing before a finding is requested, using subject, scope, expected evidence, response, reviewer, next check, and limit. Pass 242 classified evidence states; this pass defines the question that requests evidence. It is not acceptance criteria, reviewability, reviewer routing, materiality, conflict, reconciliation, roster, or generic false-completion.'
research_summary: 'Current CYC guidance gives concrete tester questions about directions, abbreviations, symbols, charts, materials, yarn amount, and finished appearance, and separates notes, transcription, standards, technical editing, and testing. Knitty’s June 17, 2026 guidance distinguishes designer work, technical editing, optional test knitting, editorial selection, rights, and publication. WCAG 2.1 describes success criteria as testable statements and says accessibility requires automated and human evaluation and does not address every user need. WCAG-EM 2.0 separates scope, representative samples, evaluation, and findings reporting, and warns that a selected subset does not support whole-product conformance claims.'
