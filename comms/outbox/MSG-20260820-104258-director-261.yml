summary: 'Pass 258 researched what an independent designer should verify before leaving, replacing, losing, or stopping trust in a device. Ink & Switch local-first research distinguishes local ownership, offline access, long-term preservation, privacy, and user control while explicitly noting that ownership also creates responsibility for backups and archive management. Digital Preservation Coalition guidance separates format choice, obsolescence, migration, documentation, metadata, significant properties, validation, and acceptance criteria. U.S. National Archives records authenticity, accuracy, functionality, fixities, action logs, validation, manifests, audits, and restoration tests as preservation evidence. The concept is materially distinct from restore-boundary-state, backup-state, recovery-proof, offline-continuity, portability-state, export-portability, export-identity-state, custody-state, and generic ownership: it shows what must be evidenced before exiting a device. It is blocked because no current Stitch & Scale product-proof registry entry or approved non-private capture verifies the proposed surface or any private/external data evidence.'
objective: 'Recruit founding testers through a truthful founder-proof short that asks what evidence they would need before leaving a device with a local-first record.'
