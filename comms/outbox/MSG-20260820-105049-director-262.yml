summary: 'Pass 259 researched what must remain meaningful when a pattern moves through source data, PDF, phone preview, and print. Craft Yarn Council guidance treats schematics as visual renderings with measurements and fit/modification context and advises reading instructions while working and checking gauge; W3C PDF techniques distinguish visible appearance from logical structure, reading order, text alternatives, tables, headings, links, and reflow; Digital Preservation Coalition guidance treats significant properties as qualities worth preserving and separates rendition from validation and acceptance; NARA preserves authenticity, accuracy, functionality, fixities, action logs, manifests, audits, and restoration tests. The concept is materially distinct from equivalent-meaning, chart-parity, preview-state, export-identity-state, export-portability, readability-under-load, focus-path, publication-boundary-state, and schematic-scale: it shows which significant property must survive a medium change and what reader test proves it. It is blocked because no current Stitch & Scale product-proof registry entry or approved non-private capture verifies the proposed surface or any real pattern/export evidence.'
objective: 'Recruit founding testers through a truthful founder-proof short that asks which reader-facing property should be tested after a pattern export.'
audience: 'Independent knitwear designers and pattern publishers managing source pattern data, charts, schematics, locales, PDF export, phone preview, print output, technical editing, and reader acceptance.'
form: 'Organic 9:16 short for Instagram Reels, TikTok, and YouTube Shorts; 35–45 seconds.'
tone: 'First-person, quiet, specific, dry, craft-respectful, and suspicious of visual completion without reader proof.'
