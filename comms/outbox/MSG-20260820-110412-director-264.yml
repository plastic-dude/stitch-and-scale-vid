summary: 'Pass 261 researched how an independent designer can distinguish completed, estimated, donated, and deferred work in a craft-business record without turning the concept into tax, wage, payroll, or profitability advice. SBA guidance recommends bookkeeping, expense categorization, decision documentation, and careful recordkeeping, while noting that worker classification and payroll records have legal consequences. Recoverie practitioner guidance separates materials, labor time, overhead, profit, wholesale/retail context, and later reevaluation, and recognizes less-visible work such as photography, listings, emails, packing, and shipping. WCAG 2.2 supports a combination of automated testing and human evaluation; YouTube supports adding/editing captions; TikTok’s June 2025 guidance supports vertical 9:16, safe-zone visibility, early hooks, captions/text overlays, and clear CTAs. The concept is materially distinct from labor visibility, contribution scope, price basis, price sensitivity, payment state, cost allocation, expense, work scope, sample context, and pass-260 evidence consequence: it shows a work event’s state and provenance before it becomes evidence or business math. It is blocked because no current Stitch & Scale product-proof registry entry or approved non-private capture verifies the proposed surface or any real work record.'
objective: 'Recruit founding testers through a truthful founder-proof short that asks which work events they need to preserve without turning them into unsupported business math.'
audience: 'Independent knitwear designers and pattern publishers managing calculations, records, technical editing, samples, reader observation, test knitting, publication work, and business administration.'
form: 'Organic 9:16 short for Instagram Reels, TikTok, and YouTube Shorts; 35–45 seconds.'
tone: 'First-person, quiet, specific, dry, craft-respectful, and suspicious of turning remembered work into settled business math.'
