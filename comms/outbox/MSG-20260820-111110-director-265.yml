summary: 'Pass 262 researched what context must travel with a published pattern or export so a later reader can identify its source revision, format, locale, scope, last action, and known limitation without mistaking metadata for approval. Craft Yarn Council says a schematic gives an overview of size and shape, a fit reference, and a modification template, and advises reviewing it before beginning; this does not prove fit or publication readiness. The U.S. Library of Congress / Digital Preservation PREMIS explainer says descriptive metadata alone is not enough for long-term preservation and that preservation metadata supports long-term usability, repository design/evaluation, exchange, and technical/action context; this is preservation context, not a pattern standard or Stitch & Scale proof. Knitty extraction failed with SQLSTATE[HY000] [1040] Too many connections, so no Knitty-specific submission claim is made. W3C WCAG 2.2, YouTube caption guidance, and TikTok’s June 2025 creative guidance inform structural, caption, and vertical-safe-zone planning. The concept is materially distinct from meaning preservation, publication proof/readiness, export identity/portability, preview, version delta, locale alignment, accessibility, release roster, acceptance, and labor record state: it shows OBJECT / SOURCE REVISION / FORMAT / LOCALE / SCOPE / LAST ACTION / KNOWN LIMITATION / OWNER / STATUS so surface completion becomes context honesty. It is blocked because no current Stitch & Scale product-proof registry entry or approved non-private capture verifies the proposed surface or any real publication context.'
objective: 'Recruit founding testers through a truthful founder-proof short that asks what context they need to identify a pattern or export confidently.'
audience: 'Independent knitwear designers and pattern publishers managing source patterns, revisions, formats, locales, charts, schematics, PDFs, phone previews, print outputs, technical editing, test knitting, and publication preparation.'
form: 'Organic 9:16 short for Instagram Reels, TikTok, and YouTube Shorts; 35–45 seconds.'
tone: 'First-person, quiet, specific, dry, craft-respectful, and suspicious of polished surfaces that omit context.'
