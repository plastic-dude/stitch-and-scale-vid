summary: 'Pass 263 researched what should be named and checked when a source record, gauge, size, or assumption changes. Microsoft Support says Excel recalculates formulas when dependent cells change by default, while manual calculation can defer updates; it distinguishes changed formulas and dependents, full recalculation, iterative calculation, and warns that a linked worksheet may not be completely recalculated and a stored linked value may not be correct. This is an Excel analogy, not Stitch & Scale proof. Sister Mountain’s 2025 practitioner grading workflow separates size inputs, gauge, ease, measurements, formulas, conversions, and stitch/row counts, and distinguishes formula-derived values from design decisions and displayed formatting from underlying data; this is practitioner guidance, not a standard or product proof. W3C WCAG 2.2, YouTube caption guidance, and TikTok’s June 2025 creative guidance inform structural, caption, and vertical-safe-zone planning. The concept is materially distinct from derived freshness, stale number, input/output, propagation, evidence-over-output, version, price sensitivity, evidence consequence, and publication context: it shows SOURCE CHANGE / EXPECTED TRIGGER / AFFECTED OUTPUTS / LAST RECOMPUTE / DISPLAYED-STORED / HUMAN CHECK / STATUS so a dependency refresh becomes an explicit responsibility boundary. It is blocked because no current Stitch & Scale product-proof registry entry or approved non-private capture verifies the proposed surface or any automatic propagation behavior.'
objective: 'Recruit founding testers through a truthful founder-proof short that asks what source-to-output evidence the current product should show after a source change.'
audience: 'Independent knitwear designers and pattern publishers managing gauge, size charts, ease, measurements, formulas, grading, stitch and row counts, expenses, sales rollups, samples, technical editing, test knitting, and publication preparation.'
form: 'Organic 9:16 short for Instagram Reels, TikTok, and YouTube Shorts; 35–45 seconds.'
tone: 'First-person, quiet, specific, dry, craft-respectful, and suspicious of displayed values whose dependency state is hidden.'
