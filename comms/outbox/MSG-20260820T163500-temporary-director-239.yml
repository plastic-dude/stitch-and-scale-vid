required_action: >-
  Human owner must assign a Communications Lead or accountable owner and publish one canonical
  status record stating exact artifact identity, current state, known facts, unknowns, impact,
  limitations, authorization boundary, owner, checkpoint, escalation target, and next action.
  Independent Video Reviewer must publish the complete terminal packet before any update can state
  approval, rejection, remake authorization, or publication. Corrections must be append-only and
