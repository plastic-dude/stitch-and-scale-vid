  escalation_target: null
  timeout_action: >-
    Append the exact SLI/SLO or error-budget deficiency with V002 provenance, preserve measurements,
    open or update the same canonical incident, assign a bounded reliability action and owner,
    and do not infer approval, rejection, remake authorization, publication, or a new brief.
required_action: >-
  Human owner must approve a versioned policy defining review-lane SLIs, SLO targets, measurement
  source, windows, exclusions, pause rules, freshness, error budgets, burn-rate thresholds, and
  bounded responses. The policy must separately measure liveness, review latency, correctness,
  evidence completeness, and authorization safety. Independent Reviewer must still publish a complete
  exact-provenance terminal packet; SLOs and error budgets cannot substitute for it. Keep the
  single-flight lane closed.
anti_duplication_rule: >-
  Do not create a new angle brief, duplicate plan, MP4, approval, rejection, or remake. A heartbeat,
  queue record, SLO report, error-budget event, escalation, incident, or reliability action is not
  campaign authorization.
next_director_rule: >-
  Continue research-first inspection. If the state remains non-terminal, publish only one
  operational-continuity blocker. If publication fails, write a publication-blocked record with
  the error and both commit IDs, stop new angles, and escalate.
