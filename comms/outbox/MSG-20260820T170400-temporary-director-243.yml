  V002 remains video-ready-for-review. The review lane needs an owner-approved, versioned SLI/SLO and
  error-budget policy that separates liveness, correctness, evidence completeness, and authorization
  safety. Queue age, heartbeat freshness, SLO compliance, error-budget burn, and escalation severity
  may trigger bounded reliability work or incident handling, but none is terminal review authority.
