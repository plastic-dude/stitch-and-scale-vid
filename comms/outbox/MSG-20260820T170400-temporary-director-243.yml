sli_dimensions:
  liveness:
    definition: >-
      Proportion of eligible review contracts receiving a valid heartbeat, handoff, or status update
      within the declared liveness window.
    numerator: required
    denominator: required
    target: owner_approved_required
    evidence_source: required
    freshness: required
    error_budget: required
    response: bounded_non_terminal_only
  review_latency:
    definition: >-
      Time from eligible video-ready-for-review state to complete independent Reviewer packet or
      explicit blocked state within the declared review window.
    numerator: required
    denominator: required
    target: owner_approved_required
    evidence_source: required
    freshness: required
    error_budget: required
    response: bounded_non_terminal_only
  correctness:
    definition: >-
      Proportion of reviewed contracts whose artifact identity, contract binding, score calculation,
      state transition, and terminal classification are independently verified as correct.
    numerator: required
    denominator: required
    target: owner_approved_required
    evidence_source: required
    freshness: required
    error_budget: required
    response: bounded_non_terminal_only
  evidence_completeness:
    definition: >-
      Proportion of eligible Reviewer packets containing required seven-dimension evidence,
      limitations, uncertainty, provenance, and immutable references.
    numerator: required
    denominator: required
    target: owner_approved_required
    evidence_source: required
    freshness: required
    error_budget: required
    response: bounded_non_terminal_only
  authorization_safety:
    definition: >-
      Proportion of eligible events that do not cause unauthorized approval, rejection, remake,
      publication, new-brief creation, or MP4 generation.
    numerator: required
    denominator: required
    target: owner_approved_required
    evidence_source: required
    freshness: required
    error_budget: required
    response: fail_closed_and_incident_append
