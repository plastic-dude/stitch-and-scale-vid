summary: >-
  V002 remains video-ready-for-review. The system must explicitly separate the control plane from the
  review data plane. Queue, telemetry, schedules, receipts, administrative retries, recovery probes,
  and incident records may report or append operational state, but must not directly mutate V002 into
  a terminal or generation-authorized state. Control-plane degradation, stale responses, replayed
  commands, partial writes, and recovery success must fail closed when authority is ambiguous.
