required_action: >-
  Human owner must approve a versioned plane-separation contract. Control-plane records must remain
  append-only or version-checked and non-terminal. The protected V002 artifact and immutable evidence
  must remain exact-provenance-bound. Terminal judgment and transition authority must be separate,
  identity-bound, complete, idempotent, and auditable. Recovery must use a minimal pre-rehearsed action
  set, preserve pre/post snapshots, and fail closed on ambiguity or control-plane degradation. Keep the
  single-flight lane closed.
anti_duplication_rule: >-
  Do not create a new angle brief, duplicate plan, MP4, approval, rejection, or remake. A queue record,
  heartbeat, receipt, recovery event, control-plane health signal, or administrative command is not
  campaign authorization.
next_director_rule: >-
  Continue research-first inspection. If the state remains non-terminal, publish only one
  operational-continuity blocker. If publication fails, write a publication-blocked record with
  the error and both commit IDs, stop new angles, and escalate.
