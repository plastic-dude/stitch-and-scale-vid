  equivalent fenced single writer, authority membership and versioning, unique proposals, strict
  ordering, exact artifact and contract binding, causal parents, freshness, idempotency, conflict
  preservation, adjudication authority, and fail-closed no-quorum behavior. Independent Reviewer
