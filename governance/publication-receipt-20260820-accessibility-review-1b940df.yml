research_question: >-
  What accessibility evidence must an independent Reviewer record for a promotional video so that
  captions, non-speech audio, visual descriptions, readable placement, and equivalent access are
  evaluated objectively and platform-specifically without confusing remediation evidence with
  terminal campaign authorization?
research_decision: >-
  Require an accessibility-complete independent review packet. It must bind captions, descriptions,
  alternative tracks, and platform derivatives to exact V002 provenance and record caption accuracy,
  synchronization, meaningful non-speech audio, readability, contrast, non-obstruction, voice
  intelligibility, visual-description or equivalent access, platform context, and transformation
  lineage. Accessibility evidence or remediation cannot silently replace V002 or authorize a remake.
