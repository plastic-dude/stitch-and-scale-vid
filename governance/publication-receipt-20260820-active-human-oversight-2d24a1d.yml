research_question: >-
  How should the V002 Reviewer demonstrate active, independent oversight rather than merely accepting
  an AI-generated summary, score, provenance claim, or prior agent assertion?
research_decision: >-
  Require an auditable active-oversight protocol. The authorized Reviewer must independently inspect
  the exact V002 artifact, capture a first-pass evidence view before relying on machine assistance,
  disclose every machine-generated input and output, bind claims to evidence, challenge material
  claims, reproduce the weighted score, preserve acceptance, rejection, override, dissent, conflicts,
  uncertainty, and unresolved questions. Generated suggestions, prior agent records, Director claims,
  queue state, and human presence remain advisory and non-terminal.
