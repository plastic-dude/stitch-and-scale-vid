research_question: >-
  How should the V002 review gate detect and control drift among the repository contract, Drive asset,
  manifest, Reviewer packet, captions, platform QA, and rights/audio records before any terminal
  decision or Generator action?
research_decision: >-
  Require a formally reviewed, owner-approved, versioned v002 configuration baseline and an immutable
  drift report. Compare every expected and observed configuration item field by field, identify
  additions, removals, and modifications, reject stale comparisons, and record source timestamp,
  freshness, owner, rationale, disposition, impact, and downstream revalidation. A matching filename
  or checksum alone is not configuration proof. Drift is not silently repaired; material drift blocks
  generation and publication until controlled reconciliation and revalidation are complete.
