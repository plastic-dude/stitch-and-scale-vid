research_question: >-
  How can the review system prevent queue, telemetry, administrative APIs, and recovery channels from
  directly mutating V002 authorization state while remaining observable and recoverable during
  control-plane degradation?
research_decision: >-
  Require a versioned control/data-plane boundary. Exact media and immutable evidence are data-plane
  objects; queue, heartbeat, schedule, administrative, incident, escalation, receipt, and recovery
  events are control-plane records. Control-plane events may report, route, or append non-terminal
  state but may not directly approve, reject, require remake, publish, create a new brief, or authorize
  MP4. Terminal judgment and transition authority must remain separate, identity-bound, complete,
  idempotent, and auditable. Recovery must be pre-rehearsed, minimally scoped, preserve pre/post
  snapshots, and fail closed on ambiguity or degradation.
