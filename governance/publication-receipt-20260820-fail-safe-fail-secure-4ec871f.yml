research_question: >-
  How should a distributed multi-agent review lane behave when its Reviewer, artifact store,
  identity provider, callback path, ledger, or publication dependency fails, so that the system
  preserves safety and evidence without turning recovery into unauthorized campaign progression?
research_decision: >-
  Require a dual fail-secure/fail-safe review circuit. Authorization dependencies deny terminal
  authority on uncertainty; operational and evidence paths preserve immutable records and return a
  typed blocked state. Repeated failures trip an explicit circuit that stops downstream generation
  and uses bounded, observable retries. Recovery requires an explicit identity-bound revalidation
  of the exact artifact, active contract, Reviewer authority, callback, ledger, and evidence chain;
  recovery itself cannot create a terminal decision, new brief, or MP4.
circuit_contract:
  authorization_mode: fail-secure
  evidence_and_operations_mode: fail-safe
  default_authorization: deny
  implicit_trust: forbidden
  initial_state: open
  states:
    - closed
    - open
    - half_open_revalidation
    - blocked_conflict
  open_state_stops_generation: true
  open_state_stops_terminal_transitions: true
  open_state_returns_typed_non_terminal_result: true
  bounded_retries: required
  retry_idempotency: required
  retry_observability: required
  recovery_probe: required
  explicit_revalidation: required
  automatic_terminal_transition_on_recovery: false
  automatic_new_brief_on_recovery: false
  automatic_mp4_on_recovery: false
  timeout_expiry_is_authorization: false
  restored_connectivity_is_authorization: false
  health_probe_is_terminal: false
  revalidation_is_terminal: false
