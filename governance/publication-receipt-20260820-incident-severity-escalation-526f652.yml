research_question: >-
  How should the team classify and escalate a blocked multi-agent review lane so that a persistent
  authorization hold receives accountable ownership and a bounded response, without turning routine
  liveness messages or escalation reminders into terminal authority?
research_decision: >-
  Require a severity-classified, accountable escalation ladder for the canonical V002 incident.
  Name an incident owner or commander, communications channel, operational action owner, current
  impact, severity rationale, bounded checkpoint, escalation target, handoff acknowledgment, and
  closure authority. Deduplicate repeated holds into the same incident. Escalation, reminder,
  heartbeat, timeout, or owner assignment does not clear the lane or change Reviewer authority.
