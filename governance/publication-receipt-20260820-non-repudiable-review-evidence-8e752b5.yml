research_question: >-
  What evidence is required to make a terminal Reviewer or owner decision non-repudiable and
  third-party verifiable, while preventing replay, stale-key use, payload substitution, or role
  confusion from clearing the V002 review lane?
research_decision: >-
  Require non-repudiable terminal review evidence. The signed or equivalently verifiable packet
  must bind the authorized signer and role to the exact decision payload and exact V002 artifact,
  active contract, causal parent, freshness window, immutable evidence, and replay-unique event.
  Verification must record signer identity, authorization context, key or credential reference,
  algorithm/version, signed-payload digest, verification result, verifier identity, and key-status
  or trust-chain evidence. Detached, stale, altered, replayed, role-incompatible, or incomplete
  assertions are non-terminal.
