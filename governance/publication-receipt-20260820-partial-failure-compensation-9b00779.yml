research_question: >-
  How should the V002 review lane recover when a distributed step partially succeeds—for example,
  when the Reviewer record is published but a manifest update, Generator order, checksum record, or
  derivative upload fails—without duplicating actions or treating recovery as terminal authorization?
research_decision: >-
  Require a durable, step-level recovery and compensation contract. Every evidence, manifest, order,
  derivative, or terminal step must record execution identity, precondition, postcondition, idempotency,
  retry budget, partial effects, compensation or containment, verification, and immutable readback.
  At-least-once retries require explicit idempotency; retries need bounded exponential backoff and
  jitter. Compensation may quarantine, append correction, or restore a non-terminal operational state,
  but may not delete evidence, rewrite history, change V002 identity, or authorize approval, rejection,
  remake, publication, or MP4. Missing or mismatched postconditions fail closed.
