research_question: >-
  How can the V002 Reviewer prove a terminal decision and preserve reproducibility while minimizing
  unnecessary personal or sensitive data in video evidence, screenshots, transcripts, logs, and agent
  records?
research_decision: >-
  Require purpose-bound, minimized, role-scoped, and lineage-preserving evidence. The protected exact
  artifact record must retain identity, hash, access controls, and reproducibility, while ordinary
  evidence views disclose only what is needed for the seven-dimensional review. Every exclusion,
  redaction, crop, blur, pseudonymization, excerpt, transcript minimization, or screenshot selection
  must record purpose, method, operator, timestamp, checksum, recipient scope, and limitations.
  Secondary use is prohibited and privacy restrictions do not waive completeness or authorize a
  terminal decision.
