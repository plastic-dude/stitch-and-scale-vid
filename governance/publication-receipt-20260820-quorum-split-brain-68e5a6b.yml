research_question: >-
  How should V002 prevent conflicting Reviewer, owner, retry, or recovery events from producing two
  terminal outcomes during a network partition, stale read, or split-brain condition?
research_decision: >-
  Require a versioned split-brain-safe terminal transition protocol. Each terminal proposal must have
  a unique decision and proposal ID, exact artifact and contract binding, causal parent, monotonic
  ordering, authority witness, freshness bound, idempotency key, and quorum or an equivalent fenced
  single-writer commitment. Conflicting or ambiguous proposals are preserved and remain non-terminal;
  last-write-wins, latest-timestamp-wins, queue order, retry count, heartbeat timeout, and recovery
  success cannot decide terminal state. Quorum protects commitment safety but does not replace
  independent Reviewer evidence or separation of duties.
