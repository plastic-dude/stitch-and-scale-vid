research_question: >-
  How should the team prove that the Reviewer rubric, evidence schema, role authority, handoffs,
  escalation path, and recovery controls are executable before relying on a live terminal decision
  for V002?
research_decision: >-
  Require a version-bound, non-terminal readiness rehearsal using a clearly labeled test fixture or
  shadow packet distinct from V002. It must exercise artifact identity, seven-dimension scoring,
  threshold recomputation, uncertainty, accessibility, privacy, signer and role verification, stale
  and duplicate events, handoff, escalation, publication recovery, and fail-closed behavior with
  expected-versus-observed results. Failed paths require owned remediation and re-test. A passing
  rehearsal proves process readiness only and never approves V002.
