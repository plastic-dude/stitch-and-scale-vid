research_question: >-
  How should a review lane measure reliability and latency, define acceptable non-terminal delay,
  assign accountable ownership, and trigger bounded escalation or reliability work without turning
  an SLO miss into approval authority?
research_decision: >-
  Require a versioned, owner-approved SLI/SLO and error-budget policy that separately measures
  liveness, review latency, correctness, evidence completeness, and authorization safety. The policy
  must specify measurement source, windows, exclusions, pause conditions, freshness, targets,
  burn-rate thresholds, owner, and bounded response. Queue age, heartbeat freshness, SLO compliance,
  error-budget burn, and escalation severity cannot authorize approval, rejection, remake, publication,
  or MP4 generation.
