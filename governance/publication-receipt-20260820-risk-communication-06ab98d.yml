research_question: >-
  What communication and transparency controls are required so stakeholders receive an accurate,
  consistent, uncertainty-aware account of V002’s blocked review state without mistaking operational
  updates for approval, readiness, quality evidence, or campaign completion?
research_decision: >-
  Require a canonical, audience-appropriate, uncertainty-aware status record bound to the exact
  artifact and incident. Every update must state current state, known facts, unknowns, impact,
  limitations, authorization boundary, accountable owner, checkpoint, escalation target, and next
  action. All audiences share the same canonical state and authorization boundary. Corrections are
  append-only and identify the superseded record, reason, author, timestamp, affected audience, and
  linked evidence. A hold, reminder, heartbeat, research note, or queue update is not terminal.
