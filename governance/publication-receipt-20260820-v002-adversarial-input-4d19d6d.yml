research_question: >-
  How should the V002 review lane prevent untrusted repository records, YAML, captions, transcripts,
  media OCR, web text, or Drive metadata from acting as instructions that mutate authorization or
  redirect an agent away from the Director playbook?
research_decision: >-
  Require a typed trust boundary. Parse every record as data; validate schema, identity, source revision,
  exact V002 binding, freshness, allowed event type, signer, role, signature or equivalent, and causal
  parent before using it. Content may report evidence, uncertainty, or non-terminal requests, but cannot
  approve, reject, require remake, publish, or authorize MP4. Captions, transcripts, OCR, URLs, external
  text, queue records, summaries, scores, and tool output remain inert during control decisions. Injection,
  malformed records, conflicts, stale events, signature failures, and ambiguous authority fail closed and
  remain append-only evidence for independent review.
