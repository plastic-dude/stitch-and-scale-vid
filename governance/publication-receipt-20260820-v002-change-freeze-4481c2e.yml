research_question: >-
  How should the active V002 review contract prevent a material artifact, rubric, evidence-schema,
  manifest, platform, or rights/audio change from silently altering the evaluation boundary or
  bypassing authorization under an urgent exception?
research_decision: >-
  Require a versioned change-freeze and emergency-exception protocol. Freeze material changes to the
  exact artifact, contract, rubric, evidence schema, manifest, platform profile, captions/safe-zone,
  rights/audio, authority membership, and terminal transition schema. Any exception must record narrow
  scope, reason, authority, impact, isolated test, rollback or containment, expiry, and post-change
  review. A material change requires fresh Reviewer restart or revalidation; prior scores and evidence
  cannot silently transfer. Urgency, queue age, or a BLOCKED record is not authorization.
