research_question: >-
  What provenance and attestation evidence is needed to show that V002’s MP4 and review object were
  produced from the declared brief, script, UI capture, audio, captions, external media, tools, and
  transformations without untracked substitutions?
research_decision: >-
  Require a versioned v002 supply-chain and media-pipeline attestation for the exact Drive asset and
  every evidence-producing transformation. Enumerate top-level inputs and resolved dependencies,
  identify the trusted builder or execution environment and invocation, bind output digest and
  byproducts, record tool and codec versions, preserve ingredient lineage, and distinguish verified
  fields from producer assertions and missing fields. Unknown or untrusted inputs, incomplete lineage,
  stale or contradictory attestations, unsupported signer-builder pairs, and failed verification block
  generation and publication without deleting the artifact or evidence. Attestation proves provenance
  claims only and does not replace independent Reviewer judgment.
