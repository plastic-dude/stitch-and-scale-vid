research_question: >-
  How should an unresolved review incident assign and transfer accountability so a
  missing owner or ambiguous handoff cannot persist indefinitely while preserving the
  independent Reviewer’s terminal authority boundary?
research_decision: >-
  Require a named responsible owner and role, acknowledged handoff, bounded checkpoint,
  escalation target, exact V002 provenance, and immutable evidence. Missing ownership,
  expired checkpoint, or unacknowledged handoff escalates the same incident and remains
  blocked. Ownership coordinates work but cannot replace independent quality authority.
