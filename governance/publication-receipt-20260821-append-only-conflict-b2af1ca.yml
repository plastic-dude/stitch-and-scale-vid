research_question: >-
  How should the review lane handle conflicting, corrected, or superseding Reviewer
  packets while preserving a reconstructable, non-destructive evidence history?
research_decision: >-
  Require append-only retention and explicit conflict handling. Every packet must
  carry unique identity, exact provenance, reviewer role, timestamp, complete score,
  explicit outcome, and immutable evidence. Corrections must reference prior event
  IDs; conflicts remain non-terminal until authorized independent resolution.
