research_question: >-
  What evidence-integrity and independent-attestation requirements prevent a syntactically
  complete Reviewer packet from clearing V002 when its origin, chain of custody, or
  supporting inspection evidence cannot be verified?
research_decision: >-
  Require evidence-origin attestation and integrity validation. A terminal packet must
  identify exact artifact and Drive object, SHA-256, evidence items, issuer or capture
  source, capture timestamp, chain-of-custody or provenance reference, validation method
  and result, reviewer identity and role, evaluation method, complete scores, threshold
  comparison, explicit decision, and durable immutable evidence. A checksum, bare link,
  provenance marker, or status alone is insufficient; missing or unverifiable evidence is
  non-terminal and requires linked continuation or revalidation.
evidence_attestation:
  exact_artifact_identity: required
  drive_object_identity: required
  sha256: required
  evidence_item_ids: required
  evidence_issuer_or_capture_source: required
  evidence_capture_timestamp: required
  chain_of_custody_reference: required
  provenance_manifest_reference: required
  signature_or_validation_reference: required_when_available
  validation_method: required
  validation_result: required
  reviewer_identity: required
  reviewer_role: required
  evaluation_method: required
  immutable_evidence_references: required
  durable_inspectable_storage: required
  evidence_gap_record: required_if_missing
integrity_rules:
  checksum_match_does_not_prove_completeness: true
  checksum_match_does_not_prove_independent_observation: true
  checksum_match_does_not_prove_currentness: true
  provenance_marker_does_not_prove_quality: true
  signed_assertion_does_not_replace_reviewer_judgment: true
  bare_link_is_not_evidence_validation: true
  deleted_evidence_is_non_terminal: true
  filtered_or_partial_evidence_is_non_terminal: true
  expired_evidence_is_non_terminal: true
  issuer_ambiguity_is_non_terminal: true
  contradictory_evidence_is_non_terminal: true
  missing_chain_of_custody_is_non_terminal: true
  unverifiable_validation_is_non_terminal: true
  evidence_gap_requires_linked_continuation_or_revalidation: true
terminal_events_that_clear_lane:
  - complete_attested_exact_provenance_independent_reviewer_approval
  - complete_attested_exact_provenance_independent_reviewer_rejection
  - complete_attested_exact_provenance_independent_REMAKE_REQUIRED_order
  - explicit_contract_authorized_terminal_resolution_with_evidence_binding
