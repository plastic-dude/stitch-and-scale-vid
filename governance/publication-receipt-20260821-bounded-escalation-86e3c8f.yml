research_question: >-
  When a review callback remains absent across repeated scheduled inspections, what
  makes escalation actionable without turning a non-terminal hold into an
  unauthorized production decision?
research_decision: >-
  Convert the repeated hold into one actionable escalation contract with named
  owner, bounded deadline, and escalation target. Keep the independent Reviewer as
  the only quality decision-maker; preserve the fail-closed lane; and treat timeout
  as escalation only.
