research_question: >-
  What calibration and repeatability evidence is needed to ensure that a Reviewer’s
  seven-dimension score reflects the published rubric rather than an unexamined or drifted
  evaluator scale?
research_decision: >-
  Require a version-bound rubric and calibration context. The terminal packet must identify
  contract, rubric, weights, threshold and evidence versions, calibration references and
  anchors, reviewer competency or calibration check where applicable, independence status,
  scoring procedure, per-dimension rationale and uncertainty, complete evidence, weighted
  calculation, threshold comparison, explicit decision, and immutable evidence. Calibration
  is measurement quality control, not terminal authority; it cannot average conflicts or
  replace independent Reviewer authority. Obsolete, drifted, inconsistent, or uncalibrated
  scoring is non-terminal until linked revalidation or authorized adjudication.
review_rubric:
  review_contract_version: required
  scoring_rubric_version: required
  scoring_weights_version: required
  threshold_version: required
  evidence_schema_version: required
  calibration_reference_id: required
  calibration_reference_version: required
  calibration_anchor_examples_or_criteria: required
  reviewer_competency_or_calibration_check: required_when_applicable
  calibration_date: required_when_applicable
  reviewer_independence_status: required
  scoring_procedure: required
  dimension_rationale: required
  dimension_uncertainty_or_confidence: required
  complete_evidence: required
  weighted_total_recomputable: required
  threshold_comparison: required
  explicit_terminal_decision: required
  immutable_evidence_references: required
calibration_rules:
  obsolete_rubric: non_terminal
  changed_scale: non_terminal
  unrecorded_anchor: non_terminal
  inconsistent_procedure: non_terminal
  evaluator_drift: non_terminal
  material_interpretation_change: non_terminal
  missing_calibration_context: non_terminal
  missing_competency_context_when_required: non_terminal
  calibration_is_not_terminal_authority: true
  calibration_cannot_average_conflicts: true
  calibration_cannot_replace_independent_reviewer: true
  conflict_requires_append_only_record_and_authorized_resolution: true
