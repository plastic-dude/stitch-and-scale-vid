research_question: >-
  How can repeated queue holds remain auditable without creating alert fatigue, duplicate
  incident interpretations, or the false appearance that repeated no-change records
  constitute new authorization evidence?
research_decision: >-
  Require a canonical active review incident and append-only event ledger. Each event
  must have unique identity, timestamp, type, actor, causal link, exact provenance,
  state and evidence fields. No-change observations are retained and linked to the
  canonical incident but deduplicated from active notifications. They cannot create
  authority, renew a lease without required fields, reset a terminal boundary, or clear
  the single-flight lane.
