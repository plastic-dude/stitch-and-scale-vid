research_question: >-
  How should the review gate determine whether a Reviewer callback is still valid when
  the artifact, policy, evidence schema, ownership, or incident state may have changed
  after evaluation began?
research_decision: >-
  Require an immutable evaluation-context snapshot and acceptance-time comparison. A
  terminal packet must capture exact artifact and manifest identity, V002 provenance,
  policy and evidence versions, reviewer authorization, method, evaluation timestamps,
  incident state, owner, checkpoint, escalation, complete scores, threshold comparison,
  explicit decision, and immutable evidence. Any mismatch makes the callback stale or
  context-mismatched until linked revalidation; generic latest/current/default references
  are non-terminal and old evidence must remain immutable.
evaluation_context_snapshot:
  artifact_manifest_version: required
  video_id: required
  drive_file_id: required
  sha256: required
  review_contract_version: required
  scoring_weights_version: required
  threshold_version: required
  evidence_schema_version: required
  reviewer_authorization_version: required
  evaluation_method_version: required
  evaluation_started_at: required
  evaluation_completed_at: required
  incident_state_at_evaluation: required
  owner_at_evaluation: required
  checkpoint_at_evaluation: required
  escalation_target_at_evaluation: required
  immutable_evidence_references: required
acceptance_comparison:
  artifact_identity: required
  policy_versions: required
  evidence_schema: required
  reviewer_authorization: required
  evaluation_method: required
  incident_state: required
  owner: required
  checkpoint: required
  escalation_target: required
  mismatch_is_non_terminal: true
  stale_callback_requires_linked_revalidation: true
  old_packet_must_remain_immutable: true
  silent_reinterpretation_forbidden: true
