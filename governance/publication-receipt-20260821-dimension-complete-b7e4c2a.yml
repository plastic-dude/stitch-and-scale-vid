research_question: >-
  How should the review gate handle a Reviewer aggregate score when one or more quality
  dimensions lack evidence, have high uncertainty, or cannot be evaluated from a complete
  execution history?
research_decision: >-
  Require dimension-complete review evidence. Each of the seven weighted dimensions must
  have evidence identifiers, score, weight and contribution, method, inspected range,
  limitations, uncertainty or confidence note, and supported status. Missing, unsupported,
  contradictory, or high-uncertainty dimensions cannot be silently zeroed, omitted, imputed,
  or hidden in an aggregate. Incomplete histories and inaccessible evidence are evidence
  gaps, not quality signals, and require linked continuation or revalidation.
scoring_contract:
  dimension_count: 7
  weights_percent:
    story_purpose: 20
    directing_visual: 15
    proof_claims: 20
    audio_voice: 15
    captions_text: 10
    technical_platform: 10
    originality_brand: 10
  score_total: required
  weighted_total_recomputable: required
  rounding_rule: required
  threshold_percent: 65
  threshold_comparison: required
  explicit_terminal_decision: required
  immutable_evidence_references: required
