research_question: >-
  How should the Director preserve a reconstructable evidence trail when scheduled
  firings repeat, remote records arrive concurrently, and a review hold may last
  longer than one execution window?
research_decision: >-
  Require durable, correlated evidence for a terminal V002 decision: unique event
  ID, exact provenance, timestamp, explicit outcome, complete score, and evidence
  references. Require owner, deadline, and escalation target. Keep the lane closed,
  preserve material records append-only, and treat repeated observations as
  non-terminal.
