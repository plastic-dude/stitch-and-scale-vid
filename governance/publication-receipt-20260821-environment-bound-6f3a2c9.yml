research_question: >-
  What evidence is required before a Reviewer can generalize a quality judgment from one
  viewing environment to all intended platform, device, browser, orientation, audio, and
  export contexts?
research_decision: >-
  Require an environment-validation matrix. The terminal packet must identify player,
  browser, device or viewport, orientation, display scale, audio path, export/container/
  codec, caption treatment, platform render or upload checks where claimed, tested and
  untested conditions, external-validity limits, evidence identifiers, and evaluation
  times. A local-player result cannot silently generalize to all intended social-platform
  contexts. Unsupported or inaccessible conditions require an evidence-gap or linked
  revalidation event, not approval.
