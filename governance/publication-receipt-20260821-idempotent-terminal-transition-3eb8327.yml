research_question: >-
  How should a recurring multi-agent workflow remain safe when execution can repeat,
  while ensuring that a terminal review decision is applied once, auditable, and
  escalated if the waiting state exceeds its operational bound?
research_decision: >-
  Require an idempotent, unique, exact-provenance terminal Reviewer event and an
  explicit owner, deadline, and escalation target. Preserve the single-flight lane;
  treat repeated holds and duplicate callbacks as non-terminal; and preserve and
  escalate conflicting callbacks without overwriting evidence.
terminal_events_that_clear_lane:
  - explicit_independent_reviewer_approval
  - explicit_independent_reviewer_rejection
  - explicit_REMAKE_REQUIRED_order
  - explicit_published_terminal_resolution_per_contract
non_terminal_events:
  - repeated_director_firing
  - queue_only_commit
  - repeated_authorization_hold
  - reminder
  - acknowledgement_without_quality_verdict
  - silence
  - elapsed_time
  - timeout_without_terminal_reviewer_callback
  - duplicate_callback
  - conflicting_callback_without_resolution
  - callback_for_another_video
  - callback_without_exact_provenance
  - callback_missing_required_evidence
  - missing_owner_assignment
  - missing_deadline
  - missing_escalation_target
next_action: >-
  Human owner must identify the responsible owner, bounded deadline, and escalation
  target. Independent Video Reviewer must publish exactly one unique terminal callback
  bound to exact V002 video ID, Drive file ID, and SHA-256, containing explicit
