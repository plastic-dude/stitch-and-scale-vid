research_question: >-
  When several agents emit progress, acknowledgement, or duplicate review-like records,
  what prevents low-authority signals from being aggregated into a false terminal consensus?
research_decision: >-
  Require identity-bound terminal authority. Only one authorized independent Video
  Reviewer or contract-authorized adjudicator may publish a complete exact-provenance
  terminal packet. Liveness records, queue holds, owner acknowledgements, Director
  blockers, Generator holds, duplicate packets, and other non-authorized signals cannot
  be counted, averaged, majority-voted, or otherwise aggregated into terminal authority.
authority_protocol:
  current_state: video-ready-for-review
  terminal_authority_model: identity_bound
  quorum_required: false
  count_based_authority: false
  aggregation_of_non_authorized_signals: forbidden
  authorized_terminal_roles:
    - independent_video_reviewer
    - contract_authorized_adjudicator
  director_terminal_authority: false
  generator_terminal_authority: false
  owner_acknowledgement_terminal_authority: false
  queue_hold_terminal_authority: false
  heartbeat_terminal_authority: false
  duplicate_packet_terminal_authority: false
  required_terminal_packet:
    - unique_event_id
    - timestamp
    - authorized_actor_identity
    - authorized_actor_role
    - exact_video_id
    - exact_drive_file_id
    - exact_sha256
    - evaluation_method
    - complete_seven_dimension_score
    - published_weights
    - weighted_total_score
    - threshold_comparison
    - explicit_terminal_decision
    - immutable_evidence_references
conflict_rule: >-
  Preserve conflicting authorized Reviewer packets append-only, link them by
  conflicts_with, and use only the contract-defined adjudication path. Do not average,
  majority-vote, recency-rank, or resolve conflict by message count.
