research_question: >-
  What minimum separation-of-duties and evidence requirements prevent the Director
  or Generator from implicitly authorizing its own video while a Reviewer callback
  is still missing?
research_decision: >-
  Preserve strict separation of duties. Require one independent Reviewer terminal
  callback with unique event ID, exact V002 provenance, timestamp, explicit decision,
  complete seven-dimension score, and immutable evidence. Require owner, deadline,
  and escalation target. Keep the lane closed and treat timeouts as escalation only.
