research_question: >-
  How should V002 review state handle duplicate, late, retried, or out-of-order
  callbacks so a terminal decision cannot be reopened, overwritten, or applied to the
  wrong causal state?
research_decision: >-
  Require monotonic transitions with unique event IDs, causal predecessors, exact
  provenance, authorized actor role, state version, timestamps, and complete evidence.
  Terminal state is one-way and immutable. Late, stale, duplicate, retry, timeout,
  heartbeat, or out-of-order events remain append-only non-terminal evidence and must
  use explicit supersedes, revalidates, conflicts_with, or late_for links.
