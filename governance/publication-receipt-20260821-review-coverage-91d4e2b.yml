research_question: >-
  What coverage and stopping-rule evidence is required before a Reviewer can claim that a
  video has been adequately inspected, rather than inferring quality from a short,
  favorable, or incomplete sample?
research_decision: >-
  Require a documented inspection-coverage map and stopping rule. The terminal packet must
  state complete video, audio, captions, claims, proof, platform, and failure-mode coverage;
  uninspected regions; sampling method and density; negative findings; stopping criterion;
  tools; time and frame ranges; limitations; and evidence identifiers. Not observed is not
  checked and absent, not applicable requires justification, and unable to inspect is an
  evidence gap. A favorable sample, partial listen, truncated evidence, or unknown stopping
  point is non-terminal.
