research_question: >-
  Which state invariants must remain true when the Director, Generator, Reviewer,
  and owner operate concurrently, so that a timeout or error cannot be mistaken
  for a valid V002 quality transition?
research_decision: >-
  Require explicit fail-closed invariants: independent Reviewer only, exact
  provenance, immutable evidence, explicit terminal event, and no implicit success.
  Timeout, retry, queue hold, silence, reminder, and error route to blocking or
  escalation only. Keep the lane closed and preserve append-only records.
state_invariants:
  review_state_not_terminal_without_reviewer_event: true
  independent_reviewer_only_quality_authority: true
  exact_provenance_binding: true
  immutable_evidence: true
  timeout_routes_to_escalation_or_blocked: true
  no_implicit_success: true
terminal_events_that_clear_lane:
  - explicit_independent_reviewer_approval
  - explicit_independent_reviewer_rejection
  - explicit_REMAKE_REQUIRED_order
  - explicit_published_terminal_resolution_per_contract
non_terminal_events:
  - timeout
  - heartbeat_timeout
  - retry
  - error
  - queue_only_commit
  - repeated_authorization_hold
  - silence
  - reminder
  - acknowledgement_without_quality_verdict
  - elapsed_time
