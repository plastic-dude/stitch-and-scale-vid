research_question: >-
  How can an open review hold remain live and actionable without becoming an
  indefinite authorization lease, and what should happen when the responsible
  Reviewer or owner misses a bounded checkpoint?
research_decision: >-
  Require a bounded review lease with exact provenance, responsible owner, lease start,
  checkpoint expiry, expected terminal or continuation callback, escalation target, and
  immutable evidence. A valid heartbeat renews the same incident only; timeout records
  failure, escalates the same incident, and remains fail-closed.
