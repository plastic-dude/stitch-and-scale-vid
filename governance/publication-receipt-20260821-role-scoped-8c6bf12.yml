research_question: >-
  Which role-scoped authorization boundaries prevent the Director, Generator,
  Reviewer, and owner from accidentally or implicitly performing one another's
  terminal duties?
research_decision: >-
  Enforce least-privilege role authority and separation of duties. Only the
  independent Reviewer may publish approval, rejection, or REMAKE_REQUIRED. The
  Director may research and publish one brief or blocker; the Generator may act
  only on an eligible contract; the owner may assign escalation but may not replace
  a quality verdict with acknowledgement.
