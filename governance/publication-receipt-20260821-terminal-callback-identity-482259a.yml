research_question: >-
  How should the V002 review hold distinguish a valid terminal callback from repeated
  liveness noise, while ensuring that a waiting review cannot remain unbounded without
  an accountable escalation path?
research_decision: >-
  Keep V002 fail-closed and the single-flight lane closed. Require one unique
  provenance-bound Reviewer callback with explicit decision, timestamp, complete
  seven-dimension score, and evidence; require owner, deadline, and escalation
  target; and treat liveness records as non-terminal.
