research_question: >-
  How should the review protocol distinguish progress or liveness evidence from
  authorization evidence so repeated heartbeats cannot be mistaken for approval,
  rejection, or remake authority?
research_decision: >-
  Require typed event classes. Liveness or heartbeat events may report current state,
  next action, owner, checkpoint, and evidence, but cannot satisfy terminal fields.
  Only an explicitly typed complete exact-provenance Reviewer packet or
  contract-authorized terminal resolution can clear the lane. Repetition, recency,
  event count, elapsed time, silence, timeout, and queue activity remain non-terminal.
