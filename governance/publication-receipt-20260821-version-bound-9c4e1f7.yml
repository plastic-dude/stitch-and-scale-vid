research_question: >-
  How should the review system prevent a Reviewer decision from being applied under the
  wrong artifact version, scoring policy, evidence schema, or authorization contract
  when those inputs can change over time?
research_decision: >-
  Require explicit version binding. A terminal Reviewer packet must identify exact V002
  artifact and manifest identity, review-contract version, scoring-policy and weights
  version, threshold version, evidence-schema version, reviewer-authorization version,
  evaluation-method version, timestamp, complete score, and immutable evidence. An
  unqualified or policy-mismatched callback is non-terminal. Any bound input change
  before terminal authorization requires revalidation; published terminal evidence is
  immutable and later policy cannot silently reinterpret it.
version_binding:
  artifact_manifest_version: required
  artifact_video_id: required
  artifact_drive_file_id: required
  artifact_sha256: required
  review_contract_version: required
  scoring_weights_version: required
  threshold_version: required
  evidence_schema_version: required
  reviewer_authorization_version: required
  evaluation_timestamp: required
  evaluation_method_version: required
  unqualified_reference_non_terminal: true
  policy_drift_requires_revalidation: true
  immutable_terminal_history: true
terminal_events_that_clear_lane:
  - complete_version_bound_exact_provenance_independent_reviewer_approval
  - complete_version_bound_exact_provenance_independent_reviewer_rejection
  - complete_version_bound_exact_provenance_independent_REMAKE_REQUIRED_order
  - explicit_contract_authorized_terminal_resolution_with_version_binding
non_terminal_version_failures:
  - missing_artifact_manifest_version
  - missing_review_contract_version
  - missing_scoring_weights_version
  - missing_threshold_version
  - missing_evidence_schema_version
  - missing_reviewer_authorization_version
  - unqualified_policy_reference
  - policy_version_mismatch
  - artifact_version_mismatch
  - checksum_mismatch
  - evaluation_method_version_mismatch
  - later_policy_without_revalidation
  - packet_for_another_video
  - packet_for_another_drive_upload
  - packet_with_different_sha256
  - packet_without_complete_evidence
  - packet_without_explicit_decision
