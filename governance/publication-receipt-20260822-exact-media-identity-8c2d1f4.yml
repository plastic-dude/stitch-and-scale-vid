research_question: >-
  What artifact-identity and transformation-lineage evidence is required before a Reviewer
  decision can be accepted as a decision about the exact V002 media object rather than an
  altered, transcoded, recompressed, or platform-rendered derivative?
research_decision: >-
  Require exact artifact-identity verification and transformation lineage. The terminal
  packet must bind evaluation to V002 video ID, Drive file ID, SHA-256, manifest identity,
  byte-level or equivalent identity, evaluated-object classification, and chain of custody.
  Every derivative must identify source, purpose, tool, version, settings, timestamp, output
  identity/checksum, and relationship to source. A checksum mismatch, unresolved download,
  altered manifest, missing transformation record, inaccessible source, or unverifiable custody
  chain is a non-terminal evidence gap. A platform derivative may support environment evidence
  but cannot replace the exact source object or silently change the active contract.
artifact_identity_contract:
  exact_video_id: required
  exact_drive_file_id: required
  exact_sha256: required
  manifest_identity: required
  byte_level_or_equivalent_identity: required
  evaluated_object_classification: required
  original_v002_file_or_derivative: required
  source_artifact_identity_for_derivative: required_when_applicable
  transformation_purpose: required_when_applicable
  transformation_tool: required_when_applicable
  transformation_tool_version: required_when_available
  transformation_settings: required_when_applicable
  transformation_timestamp: required_when_applicable
  output_artifact_identity: required_when_applicable
  output_checksum: required_when_applicable
  relationship_to_source: required_when_applicable
  chain_of_custody: required
  download_identity: required
  source_accessibility: required
  evidence_identifiers: required
  evaluation_start_time: required
  evaluation_end_time: required
identity_rules:
  checksum_match: exact_v002_binding
  checksum_mismatch: non_terminal
  unresolved_download_identity: non_terminal
  altered_manifest: non_terminal
  missing_transformation_record: non_terminal
  inaccessible_source: evidence_gap
  unverifiable_chain_of_custody: non_terminal
  silent_derivative_substitution: non_terminal
  score_one_object_authorize_another: forbidden
  platform_derivative_replaces_source: forbidden
  platform_derivative_may_support_environment_observation: true
  platform_derivative_changes_active_contract: false
  attestation_without_supporting_artifacts: non_terminal
  bare_link_without_identity: non_terminal
