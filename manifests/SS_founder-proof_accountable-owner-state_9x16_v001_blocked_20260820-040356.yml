research:
  file: research/2026-08-20-pass211-browser-findings.md
  question: >-
    How should accountability for a conditional decision be assigned, maintained, and
    handed back when conditions change, so responsibility is not implied by a label or left with nobody?
  decision_changed: >-
    Identify accountable role, authority or scope, evidence supplier, reviewer or checker,
    consulted human gate, condition monitor, handback trigger, coverage or delegate,
    disposition, and review record.
  sources:
    - id: R211-001
      title: 'NIST CSRC — Authorizing official Glossary'
      url: https://csrc.nist.gov/glossary/term/authorizing_official
      accessed: '2026-08-20'
    - id: R211-002
      title: 'ICO — Guide to accountability and governance'
      url: https://ico.org.uk/for-organisations/uk-gdpr-guidance-and-resources/accountability-and-governance/guide-to-accountability-and-governance/
      accessed: '2026-08-20'
      limitation: Page marked under review because of legislative changes.
    - id: R211-003
      title: 'W3C WAI — Using Combined Expertise to Evaluate Web Accessibility'
      url: https://www.w3.org/WAI/test-evaluate/combined-expertise/
      accessed: '2026-08-20'
    - id: R211-004
      title: 'Craft Yarn Council — Congratulations! You’ve Received the Go Ahead'
      url: https://www.craftyarncouncil.com/industry.html
      accessed: '2026-08-20'
concept_difference:
  nearest_prior: decision-conditions-state
  changed_pain: >-
    A decision has conditions but nobody’s authority, evidence responsibility,
    human-gate role, condition maintenance, or handback path is explicit.
  hook: A named decision is not an owned decision until someone can accept responsibility for its scope and next action.
  visual_metaphor: >-
    Role cards surround a decision; accountable role is highlighted, evidence and
    human-gate roles remain distinct, and a change flips the owner card to HAND BACK REQUIRED.
  emotional_turn: 'Responsible clarity: name who can act and what happens if they cannot.'
  final_line: Name who owns the decision, who checked it, and what happens when ownership must change.
dramatic_engine:
  subject: conditional decision card surrounded by distinct role cards
  desire: make it possible for the right role to accept responsibility for the decision scope and next action
  obstacle: accountable role, authority, evidence supplier, reviewer, consulted human gate, condition monitor, handback trigger, and coverage are missing or confused
  stakes: a documented decision can remain without a clear responsible actor after conditions change
  change: roles become explicit; a condition change flips the owner state to HAND BACK REQUIRED
  contradiction: many people may contribute evidence while only an authorized role can accept the bounded decision
  escalation:
    - DECISION_ID
    - ACCOUNTABLE_ROLE
    - AUTHORITY_OR_SCOPE
    - EVIDENCE_SUPPLIER
    - REVIEWER_OR_CHECKER
    - CONSULTED_HUMAN_GATE
    - CONDITION_MONITOR
    - HAND_BACK_TRIGGER
    - COVERAGE_OR_DELEGATE
    - DISPOSITION
    - REVIEW_RECORD
