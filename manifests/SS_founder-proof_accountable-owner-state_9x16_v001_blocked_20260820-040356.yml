claims:
  allowed:
    - A bounded decision can distinguish accountable role, authority or scope, evidence supplier, reviewer, human gate, condition monitor, handback trigger, and coverage.
    - Ownership should include a next action when conditions change or the named owner is unavailable.
  prohibited:
    - Stitch & Scale assigns roles, routes decisions, escalates ownership, maintains coverage, provides a roster, or exposes role-based permissions.
    - A named role automatically has authority, or an evidence supplier is automatically the decision owner.
    - Accountability replaces calculation, technical editing, print review, chart readability, schematic scale, or test knitting.
    - WCAG conformance or guaranteed accessibility.
    - Revenue, adoption, customer outcomes, pricing, credentials, testimonials, urgency, accuracy, or capabilities.
