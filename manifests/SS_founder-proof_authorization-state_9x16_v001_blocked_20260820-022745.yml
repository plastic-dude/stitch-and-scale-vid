title: 'Fit for use is not the same as authorized for this scope.'
objective: >-
  Show that suitability evidence is not itself authority to accept a deliverable for
  every scope, recipient, or future use, without claiming that Stitch & Scale exposes
  authorization, role, approval, audit, or release controls.
audience:
  primary: >-
    Independent knitwear designers and pattern publishers coordinating calculations,
    technical editing, physical print review, chart readability, schematic scale, test
    knitting, samples, swatches, revisions, tester feedback, submissions, and intended users.
  secondary: founding testers and reviewers
form: founder-proof-tabletop-explainer
assumption:
  objective: evidence-led founder proof
  audience: independent knitwear designers and pattern publishers
  tone: calm exact non-urgent candid
  distribution: organic 9:16 social placements; destination unconfirmed
  brief_tier: director-planner-blocked
founder_truth:
  david: >-
    David is a developer whose late mother knitted. He does not knit and must not be
    described as a knitter, knitwear designer, pattern designer, technical editor, or tester.
  human_gates:
    - calculation
    - technical editing
    - physical print review
    - chart readability
    - schematic scale
    - test knitting
product_truth:
  current_authorization_surface_verified: false
  proof_registry_entry: absent
  approved_capture: absent
  illustrative_surface: >-
    AUTH A-001 / EVIDENCE_PACKET / DECISION_SCOPE / AUTHORIZED_ROLE / LIMITATIONS /
    REVIEW_TRIGGER / DECISION_RECORD / DISPOSITION
  disclaimer: ILLUSTRATIVE — NOT PRODUCT UI
research:
  file: research/2026-08-20-pass197-browser-findings.md
  question: >-
    When an observed effect appears fit for an intended use, what evidence shows that
    the acceptance decision is authorized, bounded, reversible, and recorded by the
    person or role accountable for that decision?
  decision_changed: >-
    Distinguish suitability evidence from authority, scope, limitations, review trigger,
    and durable decision record.
  sources:
    - id: R197-001
      title: NIST CSRC — About the Risk Management Framework
      url: https://csrc.nist.gov/projects/risk-management/about-rmf
      accessed: '2026-08-20'
    - id: R197-002
      title: GOV.UK Design System — Check answers
      url: https://design-system.service.gov.uk/patterns/check-answers/
      accessed: '2026-08-20'
    - id: R197-003
      title: Craft Yarn Council — Congratulations! You’ve Received the Go Ahead
      url: https://www.craftyarncouncil.com/industry.html
      accessed: '2026-08-20'
    - id: R197-004
      title: Craft Yarn Council — You Want to Submit a Project Idea… Where Do You Start?
      url: https://www.craftyarncouncil.com/idea.html
      accessed: '2026-08-20'
concept_difference:
  nearest_prior: acceptability-state
  changed_pain: >-
    A suitability decision is treated as authorized for every scope, recipient, or future use.
  hook: Fit for use is not the same as authorized for this scope.
  visual_metaphor: >-
    A complete evidence packet beside an unused authorization stamp with scope, role,
    limitations, review trigger, and record still incomplete.
  emotional_turn: >-
    Confidence becomes bounded authority rather than universal approval.
  final_line: >-
    Name who can accept it, what they accepted, and when the decision must be checked again.
dramatic_engine:
  subject: complete illustrative evidence packet and unused authorization card
  desire: know whether the decision is authorized for the exact scope
  obstacle: role, scope, limitations, review trigger, and durable record are unverified
  stakes: a broad approval mark can travel beyond the evidence it covers
  change: narrow the scope and keep the decision on hold until authority is evidenced
  contradiction: strong evidence can support a decision without authorizing every decision
  escalation:
    - EVIDENCE PACKET COMPLETE
    - DECISION_SCOPE requested
    - AUTHORIZED_ROLE requested
    - LIMITATIONS and REVIEW_TRIGGER exposed
    - DECISION_RECORD requested
    - DISPOSITION HOLD
assets:
  approved_assets: pending
  permitted: original neutral cards, neutral tabletop, rights-cleared narrator, neutral foley
  prohibited: copyrighted pattern excerpts, private records, customer names, logos, private messages, current UI captures
  rights_clearance: required before generation
voice:
  narrator_family: one approved narrator family only
  status: pending approval
captions:
  caption_on_review: required
  caption_free_review: required
  human_review: required
  safe_area: pending destination confirmation
  obstruction_rule: captions must not cover faces, hands, proof, tables, numbers, logos, buttons, menus, or primary actions
audio:
  music: none unless rights-cleared and separately approved
  motif: restrained paper movement, authorization-stop cue, neutral hold tone
  room_tone: record before and after each setup
platform:
  destination: unconfirmed
  matrix: platforms/SS_founder-proof_authorization-state_9x16_v001_matrix_20260820-022745.md
filename:
  reserved: SS_founder-proof_authorization-state_9x16_v001_blocked_20260820-022745.mp4
  overwrite: false
  duplicate_check: passed
claims:
  allowed:
    - Suitability evidence and authorization are different decisions.
    - A bounded decision record can name scope, authorized role, limitations, review trigger, and disposition.
  prohibited:
    - Stitch & Scale has role permissions, approval controls, audit history, authorization workflow, or release authority.
    - A real output is authorized for a named scope.
    - An authorization record replaces technical editing, print review, chart readability, schematic scale, or test knitting.
    - WCAG conformance or guaranteed accessibility.
    - Revenue, adoption, accuracy, customer outcomes, pricing, credentials, testimonials, urgency, or capabilities.
acceptance_gates:
  - product_truth_and_current_proof
  - claims_and_founder_truth
  - human_evidence_boundaries
  - rights_and_privacy
  - narrator_family
  - caption_on
  - caption_free
  - audio_and_room_tone
  - destination_platform
  - mobile_readability
  - filename_and_continuity
  - director_reauthorization
blocker: >-
  No current versioned, non-private, rights-cleared product-proof registry entry or
  approved capture verifies the exact authorization surface; destination platform,
  rights, narrator, caption, audio, and acceptance evidence also remain unconfirmed.
exact_generator_action: Do not generate or upload. Await Director re-authorization after proof and gate validation.
