claims:
  allowed:
    - A care symbol is not the whole instruction.
    - Care records can preserve treatment, method, temperature or level, symbol meaning, warning or prohibition, blocking or finishing, source or basis, reviewer, review time, and status.
    - An unbounded care claim should remain open.
  prohibited:
    - Stitch & Scale recommends washing, drying, ironing, bleaching, drycleaning, blocking, or finishing methods.
    - Stitch & Scale interprets symbols automatically, verifies fiber behavior, tests care outcomes, guarantees garment safety, provides legal compliance, replaces manufacturer or editor guidance, or establishes product-specific care labels.
    - A generic symbol is product-specific care proof.
    - A care record replaces material, gauge, calculation, technical editing, physical print review, chart readability, schematic scale, or test knitting.
    - A fictional care card is a real garment label, manufacturer record, or current product record.
    - Revenue, adoption, accuracy, customer outcomes, final pricing, credentials, testimonials, urgency, or capabilities.
