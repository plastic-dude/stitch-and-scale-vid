research:
  file: research/2026-08-20-pass221-browser-findings.md
  question: >-
    What must a knitwear care record preserve about washing, bleaching, drying, ironing,
    professional care, temperature, symbols, warnings, blocking, finishing, source, and
    review status before a maker or reader treats it as safe guidance?
  decision_changed: >-
    Select care-instruction-state: keep treatment, method, temperature or level, symbol meaning,
    warning, blocking or finishing, source or basis, reviewer, review time, and status visible.
  sources:
    - id: R221-001
      title: 'Craft Yarn Council — Care Symbols'
      url: https://www.craftyarncouncil.com/standards/care-symbols
      accessed: '2026-08-20'
      limitation: Industry guidance; it does not verify a current product care surface.
    - id: R221-002
      title: 'Craft Yarn Council — Designer Pitfalls'
      url: https://www.craftyarncouncil.com/pitfalls.html
      accessed: '2026-08-20'
      limitation: Industry guidance; it does not establish care outcomes or product safety.
    - id: R221-003
      title: 'Federal Trade Commission — Care Labeling of Textile Wearing Apparel and Certain Piece Goods'
      url: https://www.ftc.gov/legal-library/browse/rules/care-labeling-textile-wearing-apparel-certain-piece-goods-text
      accessed: '2026-08-20'
      limitation: Legal rule for covered manufacturers and importers; not a Stitch & Scale capability or universal knitwear standard.
    - id: R221-004
      title: 'Government of Canada — Guide to Apparel and Textile Care Symbols'
      url: https://ised-isde.canada.ca/site/office-consumer-affairs/en/product-safety-recalls-and-labelling/guide-apparel-and-textile-care-symbols
      accessed: '2026-08-20'
      limitation: Informational guidance; the cited Canadian national standard was withdrawn in 2017.
concept_difference:
  nearest_prior: deadline-condition-state
  changed_pain: >-
    A familiar care symbol can look complete while treatment, method, temperature,
    warning, blocking, source, or review status remains unknown.
  hook: A care symbol is not the whole instruction.
  visual_metaphor: >-
    A familiar fictional wash symbol reveals missing qualifiers and changes to CARE CLAIM:
    NOT YET BOUNDED while separate human gates remain visible.
  emotional_turn: 'Responsible specificity: recognition gives way to treatment, limit, warning, and basis.'
  final_line: Name the treatment, the limit, the warning, and the basis.
dramatic_engine:
  subject: fictional yarn or garment care card with a familiar wash symbol and separate care fields
  desire: let a reader or reviewer know what care guidance means and what remains unverified
  obstacle: a familiar symbol appears complete while treatment, method, temperature, warning, blocking, source, and review fields are blank
  stakes: a qualifier or warning can change the meaning of a care instruction; no harm, safety, or customer outcome is claimed
  change: 'replace CARE OK with CARE CLAIM: NOT YET BOUNDED'
  contradiction: a recognizable symbol can still be incomplete without its treatment, qualifier, warning, and basis
  escalation:
    - SYMBOL
    - TREATMENT
    - METHOD
    - TEMPERATURE_OR_LEVEL
    - WARNING_OR_PROHIBITION
    - BLOCKING_OR_FINISHING
    - SOURCE_OR_BASIS
    - REVIEWER_AND_STATUS
    - CARE_CLAIM_NOT_YET_BOUNDED
proof_surface: >-
  CARE C-001 / DESIGN_ID / MATERIAL_OR_FIBER / CARE_STAGE / TREATMENT / METHOD /
  TEMPERATURE_OR_LEVEL / SYMBOL / SYMBOL_MEANING / WARNING_OR_PROHIBITION /
  BLOCKING_OR_FINISHING / SOURCE_OR_BASIS / REVIEWER / REVIEWED_AT / STATUS
