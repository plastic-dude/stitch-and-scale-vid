claims:
  allowed:
    - One recorded shared cost can require a documented basis before a derived split is treated as clear.
    - A record can separate original transaction, beneficiaries, basis, share, evidence, reviewer, and status.
    - An illustrative allocation can remain open when basis or evidence is unknown.
  prohibited:
    - Stitch & Scale allocates costs, calculates shares, determines proportional benefit, reconciles receipts, or assigns expenses automatically.
    - The allocation is tax-compliant, deductible, profitable, financially accurate, or universally correct.
    - One percentage or formula is the right method for every business or craft activity.
    - A fictional receipt or allocation card is current product UI, a real transaction, or tax evidence.
    - David is an accountant, financial advisor, knitter, designer, pattern designer, technical editor, or tester.
    - Revenue, adoption, accuracy, customer outcomes, final pricing, credentials, testimonials, urgency, or unverified capabilities.
