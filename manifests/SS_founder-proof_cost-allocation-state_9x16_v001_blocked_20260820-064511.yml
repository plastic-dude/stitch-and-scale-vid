research:
  file: research/2026-08-20-pass223-browser-findings.md
  question: >-
    When one real expense benefits more than one design, sample, channel, or business activity,
    what record keeps the original transaction intact while showing the allocation basis, share,
    evidence, reviewer, and status instead of turning a derived allocation into a settled fact?
  decision_changed: >-
    Select cost-allocation-state: keep the original transaction, beneficiaries, allocation basis,
    share, allocated amount, supporting evidence, reviewer, review time, status, and derived-from
    relationship visible without claiming accounting or tax behavior.
  sources:
    - id: R223-001
      title: 'UCSF Controller’s Office — Cost Allocation Methodology Best Practices'
      url: https://controller.ucsf.edu/reference/sponsored-research-post-award-administration/cost-allocation-methodology-best-practices
      accessed: '2026-08-20'
      evidence: >-
        A shared cost requires documented benefit, method or reasoning, percentage/share,
        supporting documentation, approvals, and periodic review in the guide’s context.
      limitation: Sponsored-research policy guide; not craft-business policy, tax advice, or product proof.
    - id: R223-002
      title: 'IRS — Topic No. 509, Business Use of Home'
      url: https://www.irs.gov/taxtopics/tc509
      accessed: '2026-08-20'
      evidence: >-
        Direct and indirect home-business expenses are treated differently under specific
        United States rules, with business-use proportion and eligibility conditions.
      limitation: Narrow United States tax topic; not a general allocation formula or Stitch & Scale capability.
    - id: R223-003
      title: 'Craft Yarn Council — Congratulations! You’ve Received the Go Ahead'
      url: https://www.craftyarncouncil.com/industry.html
      accessed: '2026-08-20'
      evidence: >-
        Project labels, sample size, notes, gauge, instructions, schematics, invoices,
        finishing, and return shipping appear as separate submission concerns.
      limitation: General industry guidance; company-specific instructions take precedence and no product ledger is verified.
    - id: R223-004
      title: 'Knitty — Design or Write For Knitty; updated June 17, 2026'
      url: https://knitty.com/subguide.php
      accessed: '2026-08-20'
      evidence: >-
        Winter 2026 submissions are due September 15, 2026 for a December 2026 issue,
        providing current seasonal publication context.
      limitation: One publication’s schedule and policy; not a Stitch & Scale partnership or urgency claim.
    - id: R223-005
      title: 'QuickBooks — Add existing expenses to a project'
      url: https://quickbooks.intuit.com/learn-support/en-us/help-article/bank-transactions/add-existing-expenses-project-quickbooks-online/L5vKMv06F_US_en_US
      accessed: '2026-08-20'
      evidence: Public documentation says expense line items can be assigned to projects.
      limitation: One product’s public behavior; not a full competitor audit and does not prove absence of allocation-basis features.
    - id: R223-006
      title: 'Xero — Track business expenses; published June 10, 2026'
      url: https://www.xero.com/us/guides/track-business-expenses/
      accessed: '2026-08-20'
      evidence: >-
        Public guidance documents categories, receipts, project identifiers, tracking categories,
        reconciliation, and project-level expense review.
      limitation: Product-oriented informational guide; no competitor superiority claim is made.
    - id: R223-007
      title: 'Instagram Help — Reel size & aspect ratios'
      url: https://help.instagram.com/1038071743007909
      accessed: '2026-08-20'
      evidence: Reels support 1.91:1 through 9:16, with minimum 30 fps and 720 pixels; recommended cover is 420x654.
      limitation: Recheck at approval; no upload is authorized.
    - id: R223-008
      title: 'YouTube Help — Add subtitles & captions'
      url: https://support.google.com/youtube/answer/2734796?hl=en
      accessed: '2026-08-20'
      evidence: Timed caption files and meaningful non-speech cues are supported by the guidance.
      limitation: Platform tooling does not replace human caption review or establish cross-platform behavior.
    - id: R223-009
      title: 'TikTok Newsroom — Introducing auto captions'
      url: https://newsroom.tiktok.com/en-us/introducing-auto-captions
      accessed: '2026-08-20'
      evidence: Auto captions can be edited and viewers can turn them off.
      limitation: Announcement is older and market/app support may vary; automatic text is draft-only.
    - id: R223-010
      title: 'W3C WAI — Understanding WCAG 2.2 SC 1.2.2 Captions'
      url: https://www.w3.org/WAI/WCAG22/Understanding/captions-prerecorded.html
      accessed: '2026-08-20'
      evidence: Captions include speech, speaker identification, meaningful non-speech information, and should not obscure relevant information.
      limitation: Accessibility guidance, not a claim of universal WCAG conformance or platform certification.
product_and_rights_decision: >-
  No current product-proof registry or approved non-private capture verifies a cost-allocation
  surface. Use original illustrative props only; exclude real receipts, invoices, bank details,
  tax records, customer orders, vendor accounts, and private financial data. Rights/privacy clearance remains required.
concept_difference:
  nearest_prior: sample-return-state
  changed_pain: >-
    One recorded shared cost can look complete while the benefiting designs, allocation basis,
    share, evidence, reviewer, and status remain unknown.
  hook: One receipt can serve more than one design. The split still needs a basis.
  visual_metaphor: >-
    One fictional receipt card feeds two design cards; arrows stop until allocation basis,
    share, evidence, and review status appear.
  emotional_turn: 'Responsible attribution: a neat total gives way to an inspectable, still-open split.'
  final_line: Keep the receipt. Name the basis. Label the split.
dramatic_engine:
  subject: fictional shared expense card and two fictional design cards
  desire: know how one recorded cost connects to each benefiting design or activity
  obstacle: a single total looks settled while beneficiaries, basis, share, evidence, and reviewer remain unknown
  stakes: a derived project total may be mistaken for an original transaction or approved financial conclusion; no tax, profit, or customer outcome is claimed
  change: 'replace SPLIT = OBVIOUS with ALLOCATION: BASIS REQUIRED'
  contradiction: a neat percentage can still be unsupported if its basis and evidence are missing
  escalation:
    - ORIGINAL_TRANSACTION
    - BENEFITING_DESIGN_IDS
    - ALLOCATION_BASIS
    - SHARE_OR_PERCENT
    - ALLOCATED_AMOUNT
    - SUPPORTING_EVIDENCE
    - REVIEWER_AND_STATUS
    - 'ALLOCATION: OPEN'
  final_image: >-
    A fictional receipt remains whole beside two design cards with a clearly labeled open
    allocation record; the frame reads ILLUSTRATIVE — NOT PRODUCT UI.
proof_surface: >-
  COST C-001 / ORIGINAL_TRANSACTION / DATE / VENDOR_OR_SOURCE / CATEGORY / CURRENCY /
