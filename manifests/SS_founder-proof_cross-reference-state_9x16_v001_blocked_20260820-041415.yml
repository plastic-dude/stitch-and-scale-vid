research:
  file: research/2026-08-20-pass212-browser-findings.md
  question: >-
    When a knitwear instruction points elsewhere, what must remain explicit for a
    reader to find the exact target, preserve size or section context, and return
    to the next action, especially on a mobile screen or after interruption?
  decision_changed: >-
    Select cross-reference-state: make source section, source scope, pointer text,
    target section, target version, target scope, target row or step, action, return
    point, exception, and review record visible as distinct fields.
  sources:
    - id: R212-001
      title: 'Craft Yarn Council — How to Read a Knitting Pattern'
      url: https://www.craftyarncouncil.com/standards/how-to-read-knitting-pattern
      accessed: '2026-08-20'
    - id: R212-002
      title: 'W3C — Making Content Usable for People with Cognitive and Learning Disabilities'
      url: https://www.w3.org/TR/coga-usable/
      accessed: '2026-08-20'
      limitation: Supplemental Working Group Note beyond WCAG conformance.
    - id: R212-003
      title: 'W3C — Web Content Accessibility Guidelines (WCAG) 2.1'
      url: https://www.w3.org/TR/WCAG21/
      accessed: '2026-08-20'
    - id: R212-004
      title: 'TikTok Ads — TikTok Auction In-Feed Ads'
      url: https://ads.tiktok.com/help/article/tiktok-auction-in-feed-ads
      accessed: '2026-08-20'
      limitation: Paid in-feed advertising guidance, not organic-post rules.
    - id: R212-005
      title: 'YouTube Help — Upload YouTube Shorts'
      url: https://support.google.com/youtube/answer/12779649?hl=en&co=GENIE.Platform%3DDesktop
      accessed: '2026-08-20'
    - id: R212-006
      title: 'Meta Business Help — About text overlays and the safe zone for ads in Stories and Reels'
      url: https://www.facebook.com/business/help/980593475366490
      accessed: '2026-08-20'
      limitation: Paid-ad guidance; page served in a Chinese locale during research.
concept_difference:
  nearest_prior: accountable-owner-state
  changed_pain: >-
    A source instruction points elsewhere while leaving the exact target, scope,
    version, row or step, action, and return point unspecified.
  hook: A pointer is not a path.
  visual_metaphor: >-
    A source card points at two similar target cards; missing target, scope, version,
    action, and return fields leave the route amber.
  emotional_turn: 'Recoverable clarity: the reader can name the target and return point instead of guessing.'
  final_line: Name the target, the scope, and where the reader returns.
proof_surface: >-
  REF X-001 / SOURCE_SECTION / SOURCE_SIZE_OR_SCOPE / SOURCE_ROW_OR_STEP /
  POINTER_TEXT / TARGET_SECTION / TARGET_VERSION / TARGET_SIZE_OR_SCOPE /
  TARGET_ROW_OR_STEP / ACTION_AT_TARGET / RETURN_POINT / EXCEPTION_OR_OPEN_GATE /
  REVIEW_RECORD
dramatic_engine:
  subject: one fictional source instruction pointing toward a target instruction
  desire: let the reader reach the exact target and return to the next action without guessing
  obstacle: pointer omits target section, version, size or scope, row or step, action, and return point
  stakes: a reader can continue from the wrong target or lose their place; illustrative only
  change: pointer is bounded with target, scope, version, action, return point, and exception
  contradiction: concise instructions save space while increasing the need for visible context
  escalation:
    - POINTER_TEXT
    - TARGET_SECTION
    - TARGET_VERSION
    - TARGET_SIZE_OR_SCOPE
    - TARGET_ROW_OR_STEP
    - ACTION_AT_TARGET
    - RETURN_POINT
    - EXCEPTION_OR_OPEN_GATE
    - REVIEW_RECORD
