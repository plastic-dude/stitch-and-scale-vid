research:
  file: research/2026-08-20-pass220-browser-findings.md
  question: >-
    What must a craft or pattern deadline record distinguish between requested-by,
    committed-by, blocked-by, completed-at, accepted-at, and still-open conditions
    before a team describes work as on time or complete?
  decision_changed: >-
    Select deadline-condition-state: keep date basis, request, commitment, dependency,
    block, owner, completion, acceptance, open condition, and status visible.
  sources:
    - id: R220-001
      title: 'Craft Yarn Council — Congratulations! You’ve Received the Go Ahead'
      url: https://www.craftyarncouncil.com/industry.html
      accessed: '2026-08-20'
      limitation: Industry guidance; publication-specific timing and requirements may differ.
    - id: R220-002
      title: 'Craft Yarn Council — Designer Pitfalls'
      url: https://www.craftyarncouncil.com/pitfalls.html
      accessed: '2026-08-20'
      limitation: Industry guidance; it does not verify a current deadline feature.
    - id: R220-003
      title: 'Atlassian — What is Acceptance Criteria?'
      url: https://www.atlassian.com/work-management/project-management/acceptance-criteria
      accessed: '2026-08-20'
      limitation: General project-management guidance; not a Stitch & Scale product claim or knitwear publication standard.
concept_difference:
  nearest_prior: material-availability-state
  changed_pain: >-
    A project card can show a date and ON TIME stamp while the date basis, dependency,
    block, completion, acceptance, or open condition remains unknown.
  hook: A date is not a status.
  visual_metaphor: >-
    A fictional ON TIME work card reveals date-basis and open-condition gaps and changes
    to DATE BASIS: REVIEW REQUIRED while distinct human gates remain visible.
  emotional_turn: 'Honest timing: calendar reassurance gives way to visible dependencies and conditions.'
  final_line: Name the date’s basis, the dependency, and what acceptance still needs.
dramatic_engine:
  subject: fictional work card with request, commitment, dependency, block, owner, completion, acceptance, open condition, date basis, and status cards
  desire: know whether a date reflects a request, commitment, block, completion, or acceptance before calling work on time or done
  obstacle: a polished card shows a date and green ON TIME stamp while date basis and open conditions are blank
  stakes: a request can be mistaken for a commitment, blocked work can be counted as complete, or completed work can be treated as accepted
  change: 'replace ON TIME with DATE BASIS: REVIEW REQUIRED'
  contradiction: a task can have a date without a commitment, and can be completed without being accepted
  escalation:
    - ON_TIME
    - REQUESTED_BY
    - COMMITTED_BY
    - DEPENDENCY
    - BLOCKED_BY
    - COMPLETED_AT
    - ACCEPTED_AT
    - OPEN_CONDITION
    - DATE_BASIS_REVIEW_REQUIRED
proof_surface: >-
  DUE D-001 / WORK_ID / DELIVERABLE / REQUESTED_BY / COMMITTED_BY / DEPENDENCY /
  BLOCKED_BY / BLOCKED_AT / OWNER / COMPLETED_AT / ACCEPTED_AT /
