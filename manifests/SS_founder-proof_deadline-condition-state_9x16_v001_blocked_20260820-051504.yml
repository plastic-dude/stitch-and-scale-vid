claims:
  allowed:
    - A date is not a status.
    - Requested-by, committed-by, dependency, blocked-by, owner, completed-at, accepted-at, acceptance criteria, open condition, date basis, and status should remain distinct.
    - Completed is not automatically accepted.
  prohibited:
    - Stitch & Scale schedules work, predicts delivery, tracks deadlines, marks tasks complete, verifies acceptance, manages dependencies, notifies users, or guarantees publication timing.
    - A date means on-time delivery, correctness, acceptance, publication, or customer outcome.
    - A deadline record replaces materials, gauge, calculation, technical editing, physical print review, chart readability, schematic scale, or test knitting.
    - A fictional date card is a real schedule, contract, customer commitment, or current product record.
    - Revenue, adoption, accuracy, customer outcomes, final pricing, credentials, testimonials, urgency, or capabilities.
