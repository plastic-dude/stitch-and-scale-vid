title: A decision is not its explanation until the basis is visible.
objective: >-
  Show why a craft-workflow decision needs visible observation, source, derivation, assumption, roles,
  open questions, and status before it is treated as a settled fact or approval, without claiming Stitch & Scale
  currently provides decision intelligence.
audience:
  primary: >-
    Independent knitwear designers, pattern publishers, technical editors, test knitters,
    sample coordinators, and makers documenting design and publication decisions.
  secondary: designers, editors, testers, reviewers, and publication coordinators
form: founder-proof-tabletop-decision-basis-trail-explainer
assumption:
  objective: evidence-led founder proof
  audience: craft and knitwear workflow participants who need an honest decision-basis and human-gate boundary
  tone: calm precise craft-respecting evidence-aware local-first and explicit about judgment versus proof
  distribution: organic 9:16 social placements; destination unconfirmed
  brief_tier: director-planner-blocked
product_truth:
  current_decision_basis_surface_verified: false
  proof_registry_entry: absent
  approved_capture: absent
  illustrative_surface: >-
    DECISION D-001 / DESIGN_ID / DECISION_PURPOSE / OBSERVATION / SOURCE_OR_REFERENCE /
    DERIVATION_OR_FORMULA / ASSUMPTION / DECISION_OWNER / APPROVER_OR_GATE / CONTRIBUTORS /
    INFORMED / OPEN_QUESTION / DECIDED_AT / STATUS / LIMITATIONS
  disclaimer: ILLUSTRATIVE — NOT PRODUCT UI
  identity_boundary: >-
    A decision-basis record cannot establish the truth of the observation, formula, estimate, financial or tax treatment,
    technical editing, test-knit success, publication approval, or user outcome.
founder_truth:
  david: >-
    David is a developer whose late mother knitted. He does not knit and must not be described as a knitter,
    knitwear designer, pattern designer, technical editor, or tester.
  human_gates:
    - calculation
    - technical editing
    - physical print review
    - chart readability
    - schematic scale
    - care review
    - test knitting
research:
  file: research/2026-08-20-pass230-browser-findings.md
  question: >-
    When a craft workflow decision mixes recorded facts, assumptions, references, and human judgment,
    what evidence keeps the decision from being mistaken for a settled fact or approval?
  decision_changed: >-
    Select decision-basis-state: isolate observation, source/reference, derivation/formula, assumption,
    decision roles, open question, decision time, status, and limitations.
  sources:
    - id: R230-001
      title: 'Craft Yarn Council — Congratulations! You’ve Received the Go Ahead'
      url: https://www.craftyarncouncil.com/industry.html
      accessed: '2026-08-20'
      evidence: Designers are told to reconfirm inputs, check dye lots, reconfirm sample size, keep notes, and not rely on memory; labels, swatches, instructions, schematics, invoices, and return shipping are separate surfaces.
      limitation: General industry guidance; company/publication instructions take precedence.
    - id: R230-002
      title: 'Craft Yarn Council — You Want to Submit a Project Idea… Where Do You Start?'
      url: https://www.craftyarncouncil.com/idea.html
      accessed: '2026-08-20'
      evidence: The workflow distinguishes idea, swatch/sketch/sample, completed project, acceptance, contract, and review.
      limitation: Workflows vary by company; not a universal decision authority.
    - id: R230-003
      title: 'Knitty — Design or Write For Knitty; updated June 17, 2026'
      url: https://knitty.com/subguide.php
      accessed: '2026-08-20'
      evidence: Technical editing, test knitting, charts, schematics, photographs, rights, and individual submission files are separate concerns.
      limitation: One publication’s workflow; not a Stitch & Scale verdict.
    - id: R230-004
      title: 'Atlassian — DACI: Decision documentation template'
      url: https://www.atlassian.com/software/confluence/templates/decision
      accessed: '2026-08-20'
      evidence: The template documents decision roles through Driver, Approver, Contributors, and Informed.
      limitation: Vendor template; roles do not prove correctness or craft-specific quality.
    - id: R230-005
      title: 'Craft Yarn Council — Standards and Guidelines'
      url: https://www.craftyarncouncil.com/standards
      accessed: '2026-08-20'
      evidence: Guidelines cover patterns, charts, abbreviations, labels, sizing, and terminology.
      limitation: Voluntary craft context; not a decision validator.
    - id: R230-006
      title: 'Instagram Help — Reel size & aspect ratios'
      url: https://help.instagram.com/1038071743007909
      accessed: '2026-08-20'
      evidence: Reels support 1.91:1 through 9:16, with minimum 30 fps and 720 pixels.
      limitation: Recheck at approval; no upload authorized.
    - id: R230-007
      title: 'TikTok Support — Accessibility for your videos'
      url: https://support.tiktok.com/en/using-tiktok/creating-videos/accessibility
      accessed: '2026-08-20'
      evidence: Auto-generated captions can be edited or removed.
      limitation: Market/app support may vary; automatic captions are draft-only.
    - id: R230-008
      title: 'YouTube Help — Add subtitles & captions'
      url: https://support.google.com/youtube/answer/2734796?hl=en
      accessed: '2026-08-20'
      evidence: Timed captions and meaningful non-speech cues are supported by the guidance.
      limitation: Platform tooling does not replace human caption review or establish product accessibility.
product_and_rights_decision: >-
  No current product-proof registry or approved non-private capture verifies a Stitch & Scale decision-basis surface.
  Use original abstract decision cards only; exclude real patterns, test-knit reports, customer records, publication
  decisions, invoices, logos, and private data. Rights/privacy clearance remains required.
concept_difference:
  nearest_prior: record-purpose-state
  changed_pain: >-
    A rationale can sound complete while observation, source, derivation, assumption, roles, open questions,
    and human gates remain invisible.
  hook: A decision is not its explanation until the basis is visible.
  visual_metaphor: >-
    DECISION opens from a rationale into OBSERVATION, SOURCE_OR_REFERENCE, DERIVATION_OR_FORMULA,
    ASSUMPTION, DECISION_OWNER, APPROVER_OR_GATE, OPEN_QUESTION, and STATUS.
  emotional_turn: 'Responsible specificity: clean rationale gives way to evidence, assumptions, roles, and an unresolved gate.'
  final_line: Name what you saw, what you assumed, and who still needs to review it.
dramatic_engine:
  subject: a fictional DECISION card with an initially blank basis
  desire: know why a design or workflow decision was made and what remains unresolved
  obstacle: the rationale sounds complete while observation, source, derivation, assumption, roles, and open questions are hidden
  stakes: a decision may travel as if it were a verified fact or approval; no actual failure, loss, or outcome is claimed
  change: 'replace DECISION: DONE with DECISION BASIS: UNVERIFIED'
  contradiction: a clear explanation can still have an invisible basis
  escalation:
    - DECISION
    - OBSERVATION
    - SOURCE_OR_REFERENCE
    - DERIVATION_OR_FORMULA_AND_ASSUMPTION
    - DECISION_OWNER_AND_APPROVER_OR_GATE
    - OPEN_QUESTION_AND_STATUS
    - 'DECISION BASIS: UNVERIFIED'
  final_image: >-
    DECISION BASIS: UNVERIFIED remains beside separate technical and human-gate cards;
    every prop reads ILLUSTRATIVE — NOT PRODUCT UI.
proof_surface: >-
  DECISION D-001 / DESIGN_ID / DECISION_PURPOSE / OBSERVATION / SOURCE_OR_REFERENCE /
