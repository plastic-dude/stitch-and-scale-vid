claims:
  allowed:
    - CYC asks designers to keep notes, reconfirm inputs, and separate project evidence such as labels, swatches, instructions, schematics, invoices, and return shipping.
    - Craft workflow decisions have separate stages such as idea, sample, acceptance, contract, and review.
    - Technical editing, test knitting, charts, schematics, rights, and submission files are distinct surfaces.
    - Decision roles can be recorded separately from the decision basis.
  prohibited:
    - Stitch & Scale evaluates evidence, calculates correctness, recommends decisions, records approvals, assigns DACI roles, replaces technical editing, proves test-knit success, gives financial or tax treatment, or establishes publication readiness.
    - A source link or rationale proves the decision is correct, complete, technically edited, test-knit, published, safe, or approved.
    - This concept gives accounting, tax, legal, publishing, or craft-practitioner advice.
    - A fictional decision card is current product UI, customer data, or a private project record.
    - David is an accountant, lawyer, publisher, knitter, designer, pattern designer, technical editor, or tester.
    - Revenue, adoption, accuracy, customer outcomes, final pricing, credentials, testimonials, urgency, or unverified capabilities.
