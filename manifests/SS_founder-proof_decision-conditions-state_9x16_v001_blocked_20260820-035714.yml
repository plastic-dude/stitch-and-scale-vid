claims:
  allowed:
    - A decision may be valid only under stated entity, purpose, prerequisites, conditions, limitations, scope, sample, version, and human-gate conditions.
    - A conditional record can name conditions, change event, review trigger, status, and disposition.
  prohibited:
    - Stitch & Scale records conditional decisions, enforces prerequisites, expires dispositions, monitors changes, or automatically triggers reassessment.
    - A decision is valid for every entity, purpose, material, size, version, scope, sample, or human gate.
    - Conditions replace calculation, technical editing, print review, chart readability, schematic scale, or test knitting.
    - WCAG conformance or guaranteed accessibility.
    - Revenue, adoption, customer outcomes, pricing, credentials, testimonials, urgency, accuracy, or capabilities.
