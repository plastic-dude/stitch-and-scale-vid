      accessed: '2026-08-20'
concept_difference:
  nearest_prior: decision-rationale-state
  changed_pain: >-
    A reasoned and recorded decision is reused after the entity, purpose, material,
    version, sample, scope, human gate, prerequisite, or other condition changes.
  hook: A reasoned decision can still stop applying when its conditions change.
  visual_metaphor: >-
    A decision lane is bounded by condition cards; a changed material or version turns
    the lane amber and the disposition to RECHECK.
  emotional_turn: 'Bounded confidence: keep the conditions attached.'
  final_line: Name the conditions, show what changed, and recheck before the decision travels.
dramatic_engine:
  subject: decision card moving through a lane bounded by explicit conditions
  desire: reuse a reasoned decision without silently expanding its validity
  obstacle: entity, purpose, prerequisites, material, version, sample, scope, human-gate condition, limitations, and review trigger are incomplete or changed
  stakes: a documented decision can become unsafe to reuse outside its checked conditions
  change: lane narrows to checked conditions; a changed condition turns status to RECHECK
  contradiction: a decision can be correct under one set of conditions and not ready for reuse when conditions change
  escalation:
    - DECISION_ID
    - AUTHORIZED_ENTITY
    - AUTHORIZED_PURPOSE
    - PREREQUISITES
    - CONDITIONS
    - LIMITATIONS
    - SCOPE
    - BASELINE
    - SAMPLE_OR_COVERAGE
    - VERSION_OR_DATE
    - HUMAN_GATE_CONDITION
    - CHANGE_EVENT
    - EXPIRY_OR_REVIEW_TRIGGER
    - CONDITIONAL_STATUS
    - DISPOSITION
