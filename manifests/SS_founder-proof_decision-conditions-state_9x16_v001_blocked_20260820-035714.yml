  question: >-
    How should explicit conditions constrain a decision's validity, and when should a
    change in those conditions force reassessment rather than silent reuse?
  decision_changed: >-
    Keep entity, purpose, prerequisites, conditions, limitations, scope, baseline, sample,
    version, human-gate condition, change event, review trigger, status, and disposition attached.
  sources:
    - id: R210-001
