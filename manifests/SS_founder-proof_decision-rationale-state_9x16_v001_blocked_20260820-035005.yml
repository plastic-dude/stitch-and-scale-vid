claims:
  allowed:
    - Applicable evidence can be connected to reasoning, alternatives, uncertainty, owner, scope, conditions, review trigger, disposition, and follow-up.
    - A rationale record can make the basis and limits of a decision inspectable.
  prohibited:
    - Stitch & Scale records rationale, supports audit or explainability, or provides current decision controls.
    - A recorded rationale proves a decision is correct, universal, accessible, suitable, or safe.
    - Rationale replaces calculation, technical editing, print review, chart readability, schematic scale, or test knitting.
    - WCAG conformance or guaranteed accessibility.
    - Revenue, adoption, customer outcomes, pricing, credentials, testimonials, urgency, accuracy, or capabilities.
