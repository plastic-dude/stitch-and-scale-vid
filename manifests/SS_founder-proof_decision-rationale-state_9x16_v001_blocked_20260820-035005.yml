research:
  file: research/2026-08-20-pass209-browser-findings.md
  question: >-
    How should a decision record the reasoning that connects applicable evidence to a
    bounded disposition, so another reviewer can inspect the basis without mistaking
    the decision for universal proof?
  decision_changed: >-
    Record applicable evidence, inference or reasoning, alternatives, uncertainty, owner,
    scope, conditions, review trigger, bounded disposition, and follow-up.
  sources:
    - id: R209-001
      title: 'UK Civil Service Quarterly — Transparency and evidence: show your workings'
      url: https://quarterly.blog.gov.uk/2017/02/21/transparency-and-evidence-show-your-workings/
      accessed: '2026-08-20'
    - id: R209-002
      title: 'NIST CSRC — Risk Management Framework'
      url: https://csrc.nist.gov/projects/risk-management
      accessed: '2026-08-20'
    - id: R209-003
      title: 'W3C WAI — Template for Accessibility Evaluation Reports'
      url: https://www.w3.org/WAI/test-evaluate/report-template/
      accessed: '2026-08-20'
    - id: R209-004
      title: 'Craft Yarn Council — Reading Instructions & Other Basics'
      url: https://www.craftyarncouncil.com/read_instructions.html
      accessed: '2026-08-20'
concept_difference:
  nearest_prior: evidence-applicability-state
  changed_pain: >-
    Applicable evidence is connected to a decision but the reasoning, alternatives,
    uncertainty, owner, conditions, or scope that support the disposition are not recorded.
  hook: Applicable evidence still needs a visible reason.
  visual_metaphor: >-
    An applicable evidence card reaches a bridge labeled REASONING, with a missing
    segment that keeps the decision held.
  emotional_turn: 'Inspectable confidence: show how you got there.'
  final_line: Show the evidence, the reason, the owner, and the limit of the decision.
dramatic_engine:
  subject: applicable evidence card trying to cross a rationale bridge into a bounded decision lane
  desire: make a decision another reviewer can inspect rather than accept on authority alone
  obstacle: inference, alternatives, uncertainty, owner, scope, conditions, review trigger, and follow-up are missing
  stakes: a decision can look evidence-based while its reasoning is forgotten or its limits are unclear
  change: decision remains held until reasoning link and bounded disposition are visible
  contradiction: applicable evidence can support a decision without explaining why it follows or where it stops
  escalation:
    - APPLICABLE_EVIDENCE
    - INFERENCE_OR_REASONING
    - ALTERNATIVES_CONSIDERED
    - UNCERTAINTY
    - DECISION_OWNER
    - DECISION_SCOPE
    - CONDITIONS
    - REVIEW_TRIGGER
    - BOUNDED_DISPOSITION
    - FOLLOW_UP
