research:
  file: research/2026-08-20-pass225-browser-findings.md
  question: >-
    When a knitwear sample uses multiple skeins, what proves the material and dye-lot identity attached
    to the design rather than relying on a generic yarn name, a photograph, or memory?
  decision_changed: >-
    Select dye-lot-state: isolate lot-level identity and the link between label, material, design/sample,
    quantity, source, observation, and review while keeping color continuity, fiber behavior, gauge, care,
    and test-knit conclusions separate.
  sources:
    - id: R225-001
      title: 'Craft Yarn Council — Congratulations! You’ve Received the Go Ahead'
      url: https://www.craftyarncouncil.com/industry.html
      accessed: '2026-08-20'
      evidence: >-
        Designers are told to reconfirm yarn/color, check ball bands for the same dye lot, keep notes,
        and submit labels, swatches, instructions, schematics, charts, and other project records.
      limitation: General industry guidance; company/publication instructions take precedence.
    - id: R225-002
      title: 'Craft Yarn Council — Getting Started: Yarn Labels'
      url: https://www.craftyarncouncil.com/getting_started.php3
      accessed: '2026-08-20'
      evidence: >-
        Yarn labels may contain yarn type, yardage, fiber content, care, recommended tools, color,
        and dye-lot information; different batches can have subtle color differences.
      limitation: Informational guidance; not a product feature or outcome guarantee.
    - id: R225-003
      title: 'Lion Brand Support — What are dye lots? Can I order more of the same lot?'
      url: https://support.lionbrand.com/support/solutions/articles/17000035215-what-are-dye-lots-can-i-order-more-of-the-same-lot-
      accessed: '2026-08-20'
      evidence: >-
        Lion Brand defines a dye lot as the batch in which yarn was dyed, notes that different batches
        may vary under different lighting, and says exact lots may not remain available.
      limitation: Supplier-specific information; do not generalize to every yarn or project.
    - id: R225-004
      title: 'Hobbii — Yarn Dye Lot Numbers; updated August 5, 2025'
      url: https://hobbii.com/blogs/news/yarn-dye-lot-numbers
      accessed: '2026-08-20'
      evidence: >-
        Hobbii recommends checking labels when yarn arrives and saving brand, color, lot, and gauge
        in a project journal; same-color skeins may come from different lots.
      limitation: Retailer education; not independent testing or product proof.
    - id: R225-005
      title: 'Knitty — Design or Write For Knitty; updated June 17, 2026'
      url: https://knitty.com/subguide.php
      accessed: '2026-08-20'
      evidence: >-
        Current Winter 2026 guidance requires a complete, separately organized submission package and
        lists a September 15, 2026 deadline.
      limitation: One publication’s workflow; not urgency, affiliation, or product proof.
    - id: R225-006
      title: 'Instagram Help — Reel size & aspect ratios'
      url: https://help.instagram.com/1038071743007909
      accessed: '2026-08-20'
      evidence: Reels support 1.91:1 through 9:16, with minimum 30 fps and 720 pixels.
      limitation: Recheck at approval; no upload is authorized.
    - id: R225-007
      title: 'TikTok Support — Accessibility for your videos'
      url: https://support.tiktok.com/en/using-tiktok/creating-videos/accessibility
      accessed: '2026-08-20'
      evidence: Auto-generated captions can be edited or removed.
      limitation: Market/app support may vary; automatic text is draft-only.
    - id: R225-008
      title: 'YouTube Help — Add subtitles & captions'
      url: https://support.google.com/youtube/answer/2734796?hl=en
      accessed: '2026-08-20'
      evidence: Timed captions and meaningful non-speech cues are supported by the guidance.
      limitation: Platform tooling does not replace human caption review or establish product accessibility.
    - id: R225-009
      title: 'W3C WAI — Understanding WCAG 2.2 SC 1.2.2 Captions'
      url: https://www.w3.org/WAI/WCAG22/Understanding/captions-prerecorded.html
      accessed: '2026-08-20'
      evidence: Captions should carry speech and relevant non-speech information without obscuring important visual content.
      limitation: Accessibility guidance, not universal conformance or platform certification.
product_and_rights_decision: >-
  No current product-proof registry or approved non-private capture verifies a Stitch & Scale material-lot
  identity surface. Use original illustrative cards only; exclude real labels, supplier images, receipts,
  patterns, customer materials, barcodes, screenshots, logos, and private records. Rights/privacy clearance remains required.
concept_difference:
  nearest_prior: export-identity-state
  nearest_craft_prior: material-trace
  changed_pain: >-
    A familiar yarn name or color can conceal which dye lot was actually used or attached to a design/sample.
  hook: Same color is not the same lot.
  visual_metaphor: >-
    COLOR: DUSTY ROSE opens to LOT: UNKNOWN, LABEL: NOT ATTACHED, and PROJECT LINK: NOT RECORDED.
  emotional_turn: 'Responsible specificity: familiar color confidence gives way to lot, label, project, and observation records.'
  final_line: Name the material lot before the sample leaves your memory.
dramatic_engine:
  subject: a fictional yarn card with a familiar color and missing lot/project link
  desire: know which material lot was actually used for the design or sample
  obstacle: same-color labels can hide different dye batches and a loose label may not be attached to the project
  stakes: the material record can become ambiguous; no mismatch, loss, or customer outcome is claimed
  change: 'replace COLOR NAME = MATERIAL RECORD with MATERIAL LOT: UNVERIFIED'
  contradiction: a recognizable color name can still leave the material lot unknown
  escalation:
    - COLOR_NAME
    - LOT_OR_DYE_LOT
    - LABEL_REFERENCE
    - DESIGN_ID_AND_SAMPLE_ID
    - QUANTITY_AND_USED_FROM
    - OBSERVED_DIFFERENCE_AND_CHECKED_AT
    - SOURCE_OR_BASIS
    - 'MATERIAL LOT: UNVERIFIED'
  final_image: >-
    MATERIAL LOT: UNVERIFIED remains beside separate human evidence cards; every prop reads
    ILLUSTRATIVE — NOT PRODUCT UI.
proof_surface: >-
