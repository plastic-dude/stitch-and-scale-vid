claims:
  allowed:
    - Same color is not the same lot.
    - Labels may contain dye-lot information and project records can preserve source details.
    - A recorded lot is separate from color continuity, fiber behavior, gauge, care, technical editing, and test knitting.
  prohibited:
    - Stitch & Scale records lots, attaches labels to designs, matches inventory, predicts color continuity, validates fiber behavior, confirms gauge, determines care suitability, reconciles quantities, or guarantees outcomes.
    - Different lots always look different, ruin a project, or behave the same across every context.
    - A recorded lot proves gauge, fit, care suitability, technical editing, test-knit success, or publication approval.
    - A fictional material card is current product UI, a real label, supplier record, or customer data.
    - David is an accountant, lawyer, publisher, knitter, designer, pattern designer, technical editor, or tester.
    - Revenue, adoption, accuracy, customer outcomes, final pricing, credentials, testimonials, urgency, or unverified capabilities.
