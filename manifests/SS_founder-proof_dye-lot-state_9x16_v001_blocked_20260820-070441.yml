title: Same color is not the same lot.
objective: >-
  Show why a generic yarn name or color is not a project-level material handoff,
  without claiming Stitch & Scale currently records, matches, predicts, or validates dye lots.
audience:
  primary: >-
    Independent knitwear designers, pattern publishers, technical editors, test knitters,
    and makers recording materials for samples, patterns, or submissions.
  secondary: designers, editors, testers, reviewers, and publication coordinators
form: founder-proof-tabletop-material-lot-identity-explainer
assumption:
  objective: evidence-led founder proof
  audience: craft and knitwear workflow participants who need an honest material identity record
  tone: calm precise craft-respecting non-alarmist and explicit about record versus outcome
  distribution: organic 9:16 social placements; destination unconfirmed
