title: Qualified evidence is not automatically evidence for this claim.
objective: >-
  Show that qualified evidence must be tested against the exact claim or decision context,
  including intended use, user, environment, scope, sample, version, and assumptions,
  without claiming that Stitch & Scale currently maps evidence to claims or blocks misapplied evidence.
audience:
  primary: >-
    Independent knitwear designers and pattern publishers coordinating calculations,
    technical editing, physical print review, chart readability, schematic scale, test
    knitting, samples, swatches, revisions, tester feedback, submissions, and intended users.
  secondary: founding testers and reviewers
form: founder-proof-tabletop-explainer
assumption:
  objective: evidence-led founder proof
  audience: independent knitwear designers and pattern publishers
  tone: calm exact non-urgent candid
  distribution: organic 9:16 social placements; destination unconfirmed
  brief_tier: director-planner-blocked
founder_truth:
  david: >-
    David is a developer whose late mother knitted. He does not knit and must not be
    described as a knitter, knitwear designer, pattern designer, technical editor, or tester.
  human_gates:
    - calculation
    - technical editing
    - physical print review
    - chart readability
    - schematic scale
    - test knitting
product_truth:
  current_evidence_applicability_surface_verified: false
  proof_registry_entry: absent
  approved_capture: absent
  illustrative_surface: >-
    APPLY A-001 / EVIDENCE_ID / TARGET_CLAIM_OR_DECISION / REQUIRED_CONTEXT /
    USER_OR_AUDIENCE / ENVIRONMENT / ASSUMPTIONS / SCOPE / SAMPLE_OR_COVERAGE /
    VERSION_OR_DATE / APPLICABILITY_TEST / APPLICABILITY_STATUS / DISPOSITION
  disclaimer: ILLUSTRATIVE — NOT PRODUCT UI
research:
  file: research/2026-08-20-pass208-browser-findings.md
  question: >-
    How should a qualified evidence item be tested for applicability to the exact claim
    or decision context, rather than being treated as sufficient merely because it passed
    a source-qualification step?
  decision_changed: >-
    Identify the exact claim, context, user, environment, scope, sample, version, and
    assumptions, then test whether qualified evidence actually bears on that claim.
  sources:
    - id: R208-001
      title: 'NIST CSRC — Validation Glossary'
      url: https://csrc.nist.gov/glossary/term/validation
      accessed: '2026-08-20'
    - id: R208-002
      title: 'GOV.UK — Government Data Quality Framework'
      url: https://www.gov.uk/government/publications/the-government-data-quality-framework/the-government-data-quality-framework
      accessed: '2026-08-20'
    - id: R208-003
      title: 'W3C — WCAG-EM 2.0'
      url: https://www.w3.org/TR/wcag-em-2/
      accessed: '2026-08-20'
    - id: R208-004
      title: 'Craft Yarn Council — Reading Instructions & Other Basics'
      url: https://www.craftyarncouncil.com/read_instructions.html
      accessed: '2026-08-20'
concept_difference:
  nearest_prior: source-qualification-state
  changed_pain: >-
    Qualified evidence is treated as support for the wrong claim, user, environment,
    version, sample, or decision context.
  hook: Qualified evidence is not automatically evidence for this claim.
  visual_metaphor: >-
    A qualified evidence card enters a second gate labeled APPLIES TO THIS CLAIM? and
    stops while claim, context, user, and assumptions are incomplete.
  emotional_turn: 'Precision: good evidence is not automatically relevant to every decision.'
  final_line: Name the claim, the context, and the evidence that actually applies.
dramatic_engine:
  subject: qualified evidence card approaching a second applicability gate
  desire: use good evidence without making it answer a different question
  obstacle: target claim, required context, user, environment, assumptions, sample, version, and applicability test are incomplete
  stakes: qualified evidence can be misapplied to a different size, material, audience, platform, environment, version, or human gate
  change: evidence remains outside decision lane until context and applicability are explicit; disposition stays held
  contradiction: evidence can be valid and well-qualified while still not applying to this exact claim
  escalation:
    - EVIDENCE_ID
    - TARGET_CLAIM_OR_DECISION named
    - REQUIRED_CONTEXT named
    - USER_OR_AUDIENCE named
    - ENVIRONMENT exposed
    - ASSUMPTIONS exposed
    - SCOPE and SAMPLE_OR_COVERAGE checked
    - VERSION_OR_DATE checked
    - APPLICABILITY_TEST stated
    - APPLICABILITY_STATUS held
assets:
  approved_assets: pending
  permitted: original neutral cards, neutral tabletop, rights-cleared narrator, neutral foley
  prohibited: copyrighted pattern excerpts, private records, customer names, logos, private messages, current UI captures
  rights_clearance: required before generation
voice:
  narrator_family: one approved narrator family only
  status: pending approval
captions:
  caption_on_review: required
  caption_free_review: required
  human_review: required
  safe_area: pending destination confirmation
  obstruction_rule: captions must not cover faces, hands, proof, tables, numbers, logos, buttons, menus, or primary actions
audio:
  music: none unless rights-cleared and separately approved
  motif: restrained second-gate stop cue and neutral hold tone
  room_tone: record before and after each setup
platform:
  destination: unconfirmed
  matrix: platforms/SS_founder-proof_evidence-applicability-state_9x16_v001_matrix_20260820-034257.md
filename:
  reserved: SS_founder-proof_evidence-applicability-state_9x16_v001_blocked_20260820-034257.mp4
  overwrite: false
  duplicate_check: passed
claims:
  allowed:
    - Evidence should be tested against the exact claim, context, user, environment, scope, sample, and assumptions it is intended to support.
    - An applicability record can name evidence, target claim, context, user, environment, assumptions, scope, sample, version, test, status, and disposition.
  prohibited:
    - Stitch & Scale maps evidence to claims, validates context, supports applicability judgments, or blocks misapplied evidence.
    - Qualified evidence applies to a real product decision, every audience, every environment, every version, or every human gate.
    - An applicability check replaces calculation, technical editing, print review, chart readability, schematic scale, or test knitting.
    - WCAG conformance or guaranteed accessibility.
    - Revenue, adoption, customer outcomes, pricing, credentials, testimonials, urgency, accuracy, or capabilities.
acceptance_gates:
  - product_truth_and_current_proof
  - claims_and_founder_truth
  - human_evidence_boundaries
  - rights_and_privacy
  - narrator_family
  - caption_on
  - caption_free
  - audio_and_room_tone
  - destination_platform
  - mobile_readability
  - filename_and_continuity
  - director_reauthorization
blocker: >-
  No current versioned, non-private, rights-cleared product-proof registry entry or
  approved capture verifies the exact evidence-applicability surface; destination platform,
  rights, narrator, caption, audio, and final acceptance evidence also remain unconfirmed.
exact_generator_action: Do not generate or upload. Await Director re-authorization after proof and gate validation.
