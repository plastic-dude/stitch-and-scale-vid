claims:
  allowed:
    - Provenance can describe entities, activities, people, and derivations involved in producing or influencing a result.
    - A lineage record can name source, version/date, activity, derivation, responsible agent, result, sufficiency, chain status, and disposition.
  prohibited:
    - Stitch & Scale records provenance, tracks derivation, assigns responsibility, validates source sufficiency, or detects broken chains.
    - A named source proves a real result or current product behavior.
    - A source or lineage record replaces calculation, technical editing, print review, chart readability, schematic scale, or test knitting.
    - WCAG conformance or guaranteed accessibility.
    - Revenue, adoption, customer outcomes, pricing, credentials, testimonials, urgency, accuracy, or capabilities.
