research:
  file: research/2026-08-20-pass206-browser-findings.md
  question: >-
    How should a result expose the source trail that supports it, and how should the
    workflow show when that trail is incomplete or insufficient for the intended use?
  decision_changed: >-
    Identify source, activity, derivation, responsible agent, and result while showing incomplete support.
  sources:
    - id: R206-001
      title: 'W3C — PROV-DM: The PROV Data Model'
