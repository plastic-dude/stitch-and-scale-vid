concept_difference:
  nearest_prior: result-boundary-state
  changed_pain: >-
    A result looks supported because a source exists while the derivation, activity,
    responsibility, or currentness of the source trail is unclear.
  hook: A source is a starting point. The result needs a visible trail.
  visual_metaphor: >-
    A chain of source, activity, derivation, responsible agent, and result cards with one dashed NOT VERIFIED link.
  emotional_turn: 'Cautious confidence: show the trail before asking anyone to trust the destination.'
  final_line: Show the source, the work, the person responsible, and the link to the result.
dramatic_engine:
  subject: chain of source, activity, derivation, responsible agent, and result cards
  desire: let a useful result be inspectable rather than asking the audience to trust a citation alone
  obstacle: source exists but version, activity, derivation, responsibility, currentness, and sufficiency are incomplete
  stakes: a named source can create false confidence when the chain between source and result is missing
  change: chain becomes visible, one link remains dashed and unverified, and result stays held
  contradiction: a source can be genuine while its connection to this result remains unproven
  escalation:
    - SOURCE_ENTITY
    - SOURCE_VERSION_OR_DATE requested
    - ACTIVITY_OR_TRANSFORM named
    - DERIVATION_LINK drawn
    - RESPONSIBLE_AGENT exposed
    - RESULT linked
    - SOURCE_SUFFICIENCY questioned
    - CHAIN_STATUS held
