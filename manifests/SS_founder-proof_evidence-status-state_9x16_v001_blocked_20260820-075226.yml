  motif: soft status-badge peel, paper evidence-window slide, silence on unverified status
  room_tone: record before and after each setup
claims:
  allowed:
    - A status report is a timely summary of progress, risks, and next steps with a date, data, blockers, and actions.
    - Publication workflows can include acceptance, hold, review, technical editing, test knitting, and publication as separate states.
    - Craft workflow can distinguish idea, sample, completed project, acceptance, contract, and review.
    - Labels, swatches, instructions, schematics, invoices, and return shipping support different workflow steps.
  prohibited:
    - Stitch & Scale automates status, verifies freshness, checks evidence windows, tracks reviewers, predicts readiness, validates technical editing, replaces test knitting, establishes rights clearance, or approves publication.
    - A status badge, timestamp, reviewer, or source link proves correctness, technical editing, test-knit success, rights clearance, publication approval, or user outcome.
    - This concept gives accounting, tax, legal, publishing, or craft-practitioner advice.
    - A fictional status card is current product UI, customer data, or a private project record.
    - David is an accountant, lawyer, publisher, knitter, designer, pattern designer, technical editor, or tester.
    - Revenue, adoption, accuracy, customer outcomes, final pricing, credentials, testimonials, urgency, or unverified capabilities.
