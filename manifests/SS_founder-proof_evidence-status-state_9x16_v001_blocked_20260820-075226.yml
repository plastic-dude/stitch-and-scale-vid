title: A status is not evidence until its scope is visible.
objective: >-
  Show why a craft-workflow status needs visible subject, scope, evidence window, setter, supporting records,
  next check, reviewer, and limits before it is read as current, ready, accepted, or approved, without claiming
  Stitch & Scale currently automates or verifies status.
audience:
  primary: >-
    Independent knitwear designers, pattern publishers, technical editors, test knitters,
    sample coordinators, and makers documenting design and publication workflow.
  secondary: designers, editors, testers, reviewers, and publication coordinators
form: founder-proof-tabletop-evidence-status-scope-explainer
assumption:
  objective: evidence-led founder proof
  audience: craft and knitwear workflow participants who need an honest status-scope and evidence-window boundary
  tone: calm precise craft-respecting evidence-aware local-first and explicit about status versus proof
  distribution: organic 9:16 social placements; destination unconfirmed
  brief_tier: director-planner-blocked
product_truth:
  current_evidence_status_surface_verified: false
  proof_registry_entry: absent
  approved_capture: absent
  illustrative_surface: >-
    STATUS S-001 / DESIGN_ID / SUBJECT_ID / STATUS_VALUE / STATUS_SCOPE / EVIDENCE_WINDOW_START /
    EVIDENCE_WINDOW_END / STATUS_SET_AT / STATUS_SET_BY / SUPPORTING_RECORDS / NEXT_CHECK /
    REVIEWER / REVIEWED_AT / LIMITATIONS / STATUS
  disclaimer: ILLUSTRATIVE — NOT PRODUCT UI
  identity_boundary: >-
    A status record cannot establish the truth of underlying evidence, technical editing, test-knit success,
    rights clearance, publication approval, or user outcome.
founder_truth:
  david: >-
    David is a developer whose late mother knitted. He does not knit and must not be described as a knitter,
    knitwear designer, pattern designer, technical editor, or tester.
  human_gates:
    - calculation
    - technical editing
    - physical print review
    - chart readability
    - schematic scale
    - care review
    - test knitting
research:
  file: research/2026-08-20-pass231-browser-findings.md
  question: >-
    When a craft workflow record says reviewed, ready, current, accepted, or open, what scope, source, timestamp,
    reviewer, and evidence window make that status meaningful rather than a generic badge?
  decision_changed: >-
    Select evidence-status-state: isolate status subject, scope, evidence window, set time, setter,
    supporting records, next check, reviewer, status, and limitations.
  sources:
    - id: R231-001
      title: 'Atlassian — Complete guide to writing a clear project status report'
      url: https://www.atlassian.com/agile/project-management/status-report
      accessed: '2026-08-20'
      evidence: A status report is a concise timely update of progress, risks, and next steps with report date, gathered data, blockers, and assigned actions.
      limitation: Vendor project-management guidance; not a craft-specific validator or Stitch & Scale capability.
    - id: R231-002
      title: 'Knitty — Design or Write For Knitty; updated June 17, 2026'
      url: https://knitty.com/subguide.php
      accessed: '2026-08-20'
      evidence: Submission may be accepted, held for future consideration with permission, awaiting a decision, technically edited, test knit or not, and eventually published; these are separate workflow states.
      limitation: One publication’s process; not a universal lifecycle or product proof.
    - id: R231-003
      title: 'Craft Yarn Council — You Want to Submit a Project Idea… Where Do You Start?'
      url: https://www.craftyarncouncil.com/idea.html
      accessed: '2026-08-20'
      evidence: The workflow distinguishes idea, swatch/sketch/sample, completed project, acceptance, contract, and review, with organization-specific requirements and timelines.
      limitation: General guidance; company/publication instructions take precedence.
    - id: R231-004
      title: 'Craft Yarn Council — Congratulations! You’ve Received the Go Ahead'
      url: https://www.craftyarncouncil.com/industry.html
      accessed: '2026-08-20'
      evidence: Labels, swatches, instructions, schematics, invoices, return shipping, notes, and recorded amounts support different workflow steps.
      limitation: Checklist guidance; not a software status model.
    - id: R231-005
      title: 'Instagram Help — Reel size & aspect ratios'
      url: https://help.instagram.com/1038071743007909
      accessed: '2026-08-20'
      evidence: Reels support 1.91:1 through 9:16, with minimum 30 fps and 720 pixels.
      limitation: Recheck at approval; no upload authorized.
    - id: R231-006
      title: 'TikTok Support — Accessibility for your videos'
      url: https://support.tiktok.com/en/using-tiktok/creating-videos/accessibility
      accessed: '2026-08-20'
      evidence: Auto-generated captions can be edited or removed.
      limitation: Market/app support may vary; automatic captions are draft-only.
    - id: R231-007
      title: 'YouTube Help — Add subtitles & captions'
      url: https://support.google.com/youtube/answer/2734796?hl=en
      accessed: '2026-08-20'
      evidence: Timed captions and meaningful non-speech cues are supported by the guidance.
      limitation: Platform tooling does not replace human caption review or establish product accessibility.
product_and_rights_decision: >-
  No current product-proof registry or approved non-private capture verifies a Stitch & Scale evidence-status surface.
  Use original abstract status cards only; exclude real patterns, samples, test-knit reports, publication decisions,
  customer records, logos, and private data. Rights/privacy clearance remains required.
concept_difference:
  nearest_prior: decision-basis-state
  changed_pain: >-
    A clean status badge can hide what it applies to, which evidence window supports it, who set it,
    which records can be checked, what happens next, and what remains outside its scope.
  hook: A status is not evidence until its scope is visible.
  visual_metaphor: >-
    STATUS: READY opens into SUBJECT_ID, STATUS_SCOPE, EVIDENCE_WINDOW_START/END, STATUS_SET_AT,
    STATUS_SET_BY, SUPPORTING_RECORDS, NEXT_CHECK, and LIMITATIONS.
  emotional_turn: 'Responsible specificity: badge confidence gives way to scope, evidence window, setter, records, and limits.'
  final_line: Name what the status covers, when it was true, and what checks it still needs.
dramatic_engine:
  subject: a fictional STATUS card reading READY without visible scope
  desire: know what the status covers and what could change it
  obstacle: a generic status badge hides subject, evidence window, setter, supporting records, next check, and limits
  stakes: a status may travel as if it were a verified fact, approval, or current truth; no actual failure, loss, or outcome is claimed
  change: 'replace STATUS: READY with STATUS: UNVERIFIED'
  contradiction: a status can be current for one subject and irrelevant to another
  escalation:
    - STATUS_VALUE
    - SUBJECT_ID_AND_STATUS_SCOPE
    - EVIDENCE_WINDOW_START_AND_END
    - STATUS_SET_AT_AND_STATUS_SET_BY
    - SUPPORTING_RECORDS_AND_NEXT_CHECK
    - REVIEWER_AND_LIMITATIONS
    - 'STATUS: UNVERIFIED'
  final_image: >-
    STATUS: UNVERIFIED remains beside separate technical and human-gate cards;
    every prop reads ILLUSTRATIVE — NOT PRODUCT UI.
proof_surface: >-
  STATUS S-001 / DESIGN_ID / SUBJECT_ID / STATUS_VALUE / STATUS_SCOPE / EVIDENCE_WINDOW_START /
  EVIDENCE_WINDOW_END / STATUS_SET_AT / STATUS_SET_BY / SUPPORTING_RECORDS / NEXT_CHECK /
  REVIEWER / REVIEWED_AT / LIMITATIONS / STATUS
