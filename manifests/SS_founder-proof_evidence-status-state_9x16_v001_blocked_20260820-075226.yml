  approved_assets: pending
  permitted: original abstract status cards, neutral tabletop, rights-cleared narrator, original card sound
  prohibited: real pattern, sample, test-knit report, publication decision, customer record, logo, private data, current UI capture
  rights_clearance: required before generation
