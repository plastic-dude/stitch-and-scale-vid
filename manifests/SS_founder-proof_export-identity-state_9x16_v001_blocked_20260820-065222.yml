  caption_free_review: required
  human_review: required
  safe_area: pending destination confirmation
  obstruction_rule: captions must not cover faces, hands, artifact cards, filenames, versions, hashes, timestamps, source fields, logos, buttons, menus, or primary actions
audio:
  music: none unless original or separately rights-cleared and approved
  motif: restrained file tap, soft gate click, held silence on unverified status
  room_tone: record before and after each setup
claims:
  allowed:
    - A file that opens is not proof it is the file that was reviewed.
    - A hash, signature, or artifact reference can help identify or authenticate a file or signed content in bounded contexts.
    - Identity evidence and technical correctness are separate review questions.
  prohibited:
    - Stitch & Scale hashes files, signs PDFs, validates certificates, compares reviewed and released artifacts, or links exports to commits.
    - A matching identity signal proves mathematical correctness, technical editing, print quality, chart readability, schematic scale, test-knit success, accessibility, or publication approval.
    - A fictional artifact card is current product UI, a real export, a signed PDF, a real hash, a real commit, or customer data.
    - David is an accountant, lawyer, publishing editor, knitter, designer, pattern designer, technical editor, or tester.
    - Revenue, adoption, accuracy, customer outcomes, final pricing, credentials, testimonials, urgency, or unverified capabilities.
