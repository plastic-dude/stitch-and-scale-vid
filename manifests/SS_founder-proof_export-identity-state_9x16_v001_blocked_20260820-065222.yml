research:
  file: research/2026-08-20-pass224-browser-findings.md
  question: >-
    After a pattern file is reviewed, what evidence proves that the released artifact is the same reviewed
    file rather than merely another export that opens in a reader?
  decision_changed: >-
    Select export-identity-state: connect reviewed artifact identity to released file identity through version,
    identity signal, capture time, source relationship, reviewer, and status while keeping correctness and human gates separate.
  sources:
    - id: R224-001
      title: 'NIST CSRC — Hash Functions; updated September 9, 2024'
      url: https://csrc.nist.gov/projects/hash-functions
      accessed: '2026-08-20'
      evidence: >-
        A hash maps an arbitrary-length message to a fixed-length digest and approved hash functions
        have collision, preimage, and second-preimage resistance properties.
      limitation: Security guidance; not a product export workflow or correctness proof.
    - id: R224-002
      title: 'Adobe Acrobat Help — Validate digital signatures; updated September 23, 2025'
      url: https://helpx.adobe.com/acrobat/desktop/e-sign-documents/manage-digital-signatures/validate-digital-sign.html
      accessed: '2026-08-20'
      evidence: >-
        Signature validation can check signer authenticity and signed-content integrity, with certificate
        and timestamp details.
      limitation: Commercial document workflow; not a Stitch & Scale capability or technical pattern review.
    - id: R224-003
      title: 'Craft Yarn Council — Congratulations! You’ve Received the Go Ahead'
      url: https://www.craftyarncouncil.com/industry.html
      accessed: '2026-08-20'
      evidence: >-
        Submission guidance separates yarn labels, gauge swatches, electronic and printed instructions,
        schematics, charts, invoices, and return shipping.
      limitation: General industry guidance; company/publication instructions take precedence.
    - id: R224-004
      title: 'Knitty — Design or Write For Knitty; updated June 17, 2026'
      url: https://knitty.com/subguide.php
      accessed: '2026-08-20'
      evidence: >-
        Winter 2026 submission guidance requires individual files, a text-only pattern document,
        separate photos/charts/schematics, and lists a September 15, 2026 deadline.
      limitation: One publication’s workflow; not urgency, affiliation, or product proof.
    - id: R224-005
      title: 'GitHub Docs — Artifact attestations'
      url: https://docs.github.com/en/actions/concepts/security/artifact-attestations
      accessed: '2026-08-20'
      evidence: >-
        Attestations can link a software artifact to repository, workflow, commit, event, and digest,
        while the documentation warns they are not a guarantee of artifact security.
      limitation: Software supply-chain context; do not transfer its guarantees or tooling to pattern exports.
    - id: R224-006
      title: 'GitHub Docs — Using artifact attestations to establish provenance for builds'
      url: https://docs.github.com/actions/security-for-github-actions/using-artifact-attestations/using-artifact-attestations-to-establish-provenance-for-builds
      accessed: '2026-08-20'
      evidence: >-
        Build attestations use artifact digests and can be verified through documented workflows and CLI commands.
      limitation: Build provenance is not pattern correctness, publication approval, or a Stitch & Scale feature.
    - id: R224-007
      title: 'Instagram Help — Reel size & aspect ratios'
      url: https://help.instagram.com/1038071743007909
      accessed: '2026-08-20'
      evidence: Reels support 1.91:1 through 9:16, with minimum 30 fps and 720 pixels.
      limitation: Recheck at approval; no upload is authorized.
    - id: R224-008
      title: 'YouTube Help — Add subtitles & captions'
      url: https://support.google.com/youtube/answer/2734796?hl=en
      accessed: '2026-08-20'
      evidence: Timed captions and meaningful non-speech cues are supported by the guidance.
      limitation: Platform tooling does not replace human caption review or establish product accessibility.
    - id: R224-009
      title: 'TikTok Newsroom — Introducing auto captions'
      url: https://newsroom.tiktok.com/en-us/introducing-auto-captions
      accessed: '2026-08-20'
      evidence: Auto captions can be edited and viewers can turn them off.
      limitation: Announcement is older and market/app support may vary; automatic text is draft-only.
    - id: R224-010
      title: 'W3C WAI — Understanding WCAG 2.2 SC 1.2.2 Captions'
      url: https://www.w3.org/WAI/WCAG22/Understanding/captions-prerecorded.html
      accessed: '2026-08-20'
      evidence: Captions include speech, speaker identification, meaningful non-speech information, and should not obscure relevant information.
      limitation: Accessibility guidance, not universal conformance or platform certification.
product_and_rights_decision: >-
  No current product-proof registry or approved non-private capture verifies a Stitch & Scale reviewed-export
  identity surface. Use original illustrative cards only; exclude real patterns, PDFs, hashes, signatures,
  certificates, commits, publication submissions, customer exports, and private records. Rights/privacy clearance remains required.
concept_difference:
  nearest_prior: cost-allocation-state
  changed_pain: >-
    A familiar filename or openable file can conceal that the released artifact is not the reviewed artifact.
  hook: A file that opens is not proof it is the file you reviewed.
  visual_metaphor: >-
    REVIEWED_ARTIFACT and RELEASED_FILE cards remain separated by an identity gate until identity fields match.
  emotional_turn: 'Responsible traceability: filename familiarity gives way to conditional identity evidence.'
  final_line: Match the file before you call it released.
dramatic_engine:
  subject: two fictional pattern-file cards, reviewed and released
  desire: know whether the released artifact is the reviewed artifact
  obstacle: filename familiarity and successful opening do not prove version, bytes, source relationship, review status, or release identity
  stakes: a changed or unknown artifact can be mistaken for the reviewed one; no defect, loss, or customer outcome is claimed
  change: 'replace OPENED = SAME with IDENTITY MATCH: UNVERIFIED'
  contradiction: a file can open normally while still being the wrong reviewed version
  escalation:
    - REVIEWED_ARTIFACT_ID
    - RELEASED_FILE_ID
    - FILENAME_AND_VERSION
    - HASH_OR_SIGNED_CONTENT_REFERENCE
    - HASH_CAPTURED_AT
    - SOURCE_RECORD_OR_COMMIT
    - REVIEW_STATUS_AND_RELEASE_STATUS
    - 'IDENTITY MATCH: UNVERIFIED'
  final_image: >-
    IDENTITY MATCH: UNVERIFIED remains beside separate human evidence cards; every prop reads
    ILLUSTRATIVE — NOT PRODUCT UI.
proof_surface: >-
  EXPORT E-001 / DESIGN_ID / SOURCE_RECORD_OR_COMMIT / REVIEWED_ARTIFACT_ID / RELEASED_FILE_ID /
  FILENAME / VERSION / HASH_ALGORITHM / HASH / HASH_CAPTURED_AT / LOCALE / UNIT / REVIEWER /
  REVIEWED_AT / REVIEW_STATUS / RELEASE_STATUS / DERIVED_FROM
