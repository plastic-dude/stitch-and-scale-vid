claims:
  allowed:
    - An observed result needs intended use, criteria, test, evidence, and limits before fit can be assessed.
    - A criteria-fit record can name intended use, requirements, test, observed result, supporting evidence, limitations, owner, status, and disposition.
  prohibited:
    - Stitch & Scale evaluates fit, runs acceptance tests, verifies requirements, or certifies accessibility.
    - A real record fits a named use or passed a real test.
    - A quick check replaces technical editing, print review, chart readability, schematic scale, or test knitting.
    - WCAG conformance or guaranteed accessibility.
    - Revenue, adoption, customer outcomes, pricing, credentials, testimonials, urgency, accuracy, or capabilities.
