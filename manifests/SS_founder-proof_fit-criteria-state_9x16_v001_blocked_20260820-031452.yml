title: A result can be real and still not answer the question you need answered.
objective: >-
  Show that an observed result needs a named intended use, explicit criteria, a defined
  test, supporting evidence, and stated limitations before anyone can say whether it fits,
  without claiming that Stitch & Scale currently evaluates or certifies fit.
audience:
  primary: >-
    Independent knitwear designers and pattern publishers coordinating calculations,
    technical editing, physical print review, chart readability, schematic scale, test
    knitting, samples, swatches, revisions, tester feedback, submissions, and intended users.
  secondary: founding testers and reviewers
form: founder-proof-tabletop-explainer
assumption:
  objective: evidence-led founder proof
  audience: independent knitwear designers and pattern publishers
  tone: calm exact non-urgent candid
  distribution: organic 9:16 social placements; destination unconfirmed
  brief_tier: director-planner-blocked
founder_truth:
  david: >-
    David is a developer whose late mother knitted. He does not knit and must not be
    described as a knitter, knitwear designer, pattern designer, technical editor, or tester.
  human_gates:
    - calculation
    - technical editing
    - physical print review
    - chart readability
    - schematic scale
    - test knitting
product_truth:
  current_fit_criteria_surface_verified: false
  proof_registry_entry: absent
  approved_capture: absent
  illustrative_surface: >-
    FIT A-001 / INTENDED_USE / REQUIREMENTS_OR_CRITERIA / TEST / OBSERVED_RESULT /
    SUPPORTING_EVIDENCE / LIMITATIONS / FIT_STATUS / DISPOSITION
  disclaimer: ILLUSTRATIVE — NOT PRODUCT UI
research:
  file: research/2026-08-20-pass204-browser-findings.md
  question: >-
    How should an observed result be tested against explicit criteria for a specific
    intended use without turning a partial check into universal proof?
  decision_changed: >-
    Require intended use, criteria, test, evidence, and limitations before assessing fit.
  sources:
    - id: R204-001
      title: 'NIST CSRC Glossary — Validation'
      url: https://csrc.nist.gov/glossary/term/validation
      accessed: '2026-08-20'
    - id: R204-002
      title: 'GOV.UK Publishing guidance — Identify user needs'
      url: https://guidance.publishing.service.gov.uk/writing-to-gov-uk-standards/plan-manage-content/identify-user-needs/
      accessed: '2026-08-20'
    - id: R204-003
      title: 'W3C WAI — Easy Checks: A First Review of Web Accessibility'
      url: https://www.w3.org/WAI/test-evaluate/preliminary/
      accessed: '2026-08-20'
    - id: R204-004
      title: 'Craft Yarn Council — Reading Instructions & Other Basics'
      url: https://www.craftyarncouncil.com/read_instructions.html
      accessed: '2026-08-20'
concept_difference:
  nearest_prior: impact-assessment-state
  changed_pain: >-
    An observed result is treated as fit without named intended use, criteria, test,
    evidence, or limitations.
  hook: A result can be real and still not answer the question you need answered.
  visual_metaphor: >-
    An intended-use card sits beside criteria and test cards while a universal PASS
    stamp stays crossed out and limitations remain visible.
  emotional_turn: 'Confidence with limits: name what passed and what was not tested.'
  final_line: Name the intended use, the test, and the limit of what passed.
dramatic_engine:
  subject: observed result beside intended-use, criteria, test, and limitation cards
  desire: decide whether the result answers one practical intended-use question
  obstacle: result is visible but intended use, criteria, test, evidence, limitations, owner, and fit status are incomplete
  stakes: a partial check can travel as universal proof
  change: bound result to one intended use and test while keeping limitations visible and disposition pending
  contradiction: evidence can be genuine while insufficient for a different intended use
  escalation:
    - OBSERVED_RESULT
    - INTENDED_USE named
    - REQUIREMENTS_OR_CRITERIA entered
    - TEST named
    - SUPPORTING_EVIDENCE attached
    - LIMITATIONS exposed
    - FIT_STATUS scoped
    - DISPOSITION HOLD
