    Independent knitwear designers and pattern publishers coordinating calculations,
    technical editing, physical print review, chart readability, schematic scale, test
    knitting, samples, swatches, revisions, tester feedback, submissions, and intended users.
  secondary: founding testers and reviewers
form: founder-proof-tabletop-explainer
assumption:
  objective: evidence-led founder proof
  audience: independent knitwear designers and pattern publishers
  tone: calm exact non-urgent candid
  distribution: organic 9:16 social placements; destination unconfirmed
  brief_tier: director-planner-blocked
founder_truth:
  david: >-
    David is a developer whose late mother knitted. He does not knit and must not be
    described as a knitter, knitwear designer, pattern designer, technical editor, or tester.
  human_gates:
    - calculation
    - technical editing
    - physical print review
    - chart readability
    - schematic scale
    - test knitting
product_truth:
  current_impact_assessment_surface_verified: false
  proof_registry_entry: absent
  approved_capture: absent
  illustrative_surface: >-
    IMPACT A-001 / CHANGE_EVENT / AFFECTED_SURFACE / OBSERVED_RESULT /
    ACCEPTANCE_CRITERIA / SUPPORTING_EVIDENCE / DECISION_OWNER / IMPACT_STATUS / DISPOSITION
  disclaimer: ILLUSTRATIVE — NOT PRODUCT UI
research:
  file: research/2026-08-20-pass203-browser-findings.md
  question: >-
    When a relevant change triggers review, how should the workflow distinguish the
    event itself from the downstream evidence, scope, and decision it may affect?
  decision_changed: >-
    Separate the change event from affected surface, observed result, supporting evidence, and decision.
  sources:
    - id: R203-001
      title: 'NIST CSRC Glossary — Security impact analysis'
      url: https://csrc.nist.gov/glossary/term/security_impact_analysis
      accessed: '2026-08-20'
    - id: R203-002
      title: 'NIST CSRC — Risk Management Framework'
      url: https://csrc.nist.gov/projects/risk-management
      accessed: '2026-08-20'
    - id: R203-003
      title: 'GOV.UK Publishing guidance — Identify user needs'
      url: https://guidance.publishing.service.gov.uk/writing-to-gov-uk-standards/plan-manage-content/identify-user-needs/
      accessed: '2026-08-20'
    - id: R203-004
      title: 'Craft Yarn Council — Reading Instructions & Other Basics'
      url: https://www.craftyarncouncil.com/read_instructions.html
      accessed: '2026-08-20'
concept_difference:
  nearest_prior: review-trigger-state
  changed_pain: >-
    The trigger is mistaken for proof of what the change affected or what decision should follow.
  hook: A change is an event. Its impact is a question. The decision needs evidence.
  visual_metaphor: >-
    A change card forks into affected surface, observed result, supporting evidence,
    and decision lanes, with one or more lanes remaining pending.
  emotional_turn: 'Humility: investigate rather than invent a consequence.'
  final_line: Name what changed, what you observed, what supports it, and who decides what happens next.
dramatic_engine:
  subject: change card branching into four assessment lanes
  desire: understand what the change actually touches without losing prior scope
  obstacle: trigger is visible but affected surface, observed result, evidence, criteria, owner, and status are incomplete
  stakes: a trigger can be repeated as an invented impact
  change: trigger becomes a structured assessment packet and remains undecided until evidence and owner are visible
  contradiction: a change may affect something without proving exactly what it affected
  escalation:
    - CHANGE_EVENT
    - AFFECTED_SURFACE requested
    - OBSERVED_RESULT separated
    - SUPPORTING_EVIDENCE requested
    - ACCEPTANCE_CRITERIA and DECISION_OWNER exposed
    - IMPACT_STATUS PENDING
    - DISPOSITION HOLD
assets:
  approved_assets: pending
  permitted: original neutral cards, neutral tabletop, rights-cleared narrator, neutral foley
  prohibited: copyrighted pattern excerpts, private records, customer names, logos, private messages, current UI captures
  rights_clearance: required before generation
voice:
  narrator_family: one approved narrator family only
  status: pending approval
captions:
  caption_on_review: required
  caption_free_review: required
  human_review: required
  safe_area: pending destination confirmation
  obstruction_rule: captions must not cover faces, hands, proof, tables, numbers, logos, buttons, menus, or primary actions
audio:
  music: none unless rights-cleared and separately approved
  motif: restrained fork cue and neutral pending tone
  room_tone: record before and after each setup
platform:
  destination: unconfirmed
  matrix: platforms/SS_founder-proof_impact-assessment-state_9x16_v001_matrix_20260820-030745.md
filename:
