  overwrite: false
  duplicate_check: passed
claims:
  allowed:
    - A change event and its downstream impact are different things.
    - An impact packet can name affected surface, observed result, criteria, supporting evidence, owner, status, and disposition.
  prohibited:
    - Stitch & Scale performs impact analysis, detects affected records, calculates consequences, or automates decisions.
    - A real material, requirement, or evidence change affected a specific surface.
    - Impact analysis replaces technical editing, print review, chart readability, schematic scale, or test knitting.
    - WCAG conformance or guaranteed accessibility.
    - Revenue, adoption, customer outcomes, pricing, credentials, testimonials, urgency, accuracy, or capabilities.
acceptance_gates:
  - product_truth_and_current_proof
  - claims_and_founder_truth
  - human_evidence_boundaries
  - rights_and_privacy
  - narrator_family
  - caption_on
  - caption_free
  - audio_and_room_tone
  - destination_platform
  - mobile_readability
  - filename_and_continuity
  - director_reauthorization
blocker: >-
  No current versioned, non-private, rights-cleared product-proof registry entry or
  approved capture verifies the exact impact-assessment surface; destination platform,
  rights, narrator, caption, audio, and final acceptance evidence also remain unconfirmed.
