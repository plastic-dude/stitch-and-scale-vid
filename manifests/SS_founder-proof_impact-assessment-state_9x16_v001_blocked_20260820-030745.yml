title: A change is an event. Its impact is a question. The decision needs evidence.
objective: >-
  Show that a change event is not itself an impact finding: record what changed,
  which surface may be affected, what was observed, what evidence supports that
  observation, and who owns the next decision, without claiming that Stitch & Scale
  currently performs impact analysis.
