concept_difference:
  nearest_prior: authorization-state
  changed_pain: >-
    An authorized decision is reused after an upstream source, material, version, or
    human-gate dependency changes.
  hook: An authorized decision can still need review when what it depends on changes.
  visual_metaphor: >-
    A linked source/input/human-gate/decision chain changes upstream, breaks its link,
    and changes the downstream state to review required.
  emotional_turn: >-
    Confidence becomes honest rechecking rather than silent reuse.
  final_line: >-
    Show what changed, what depended on it, and what must be checked again.
dramatic_engine:
  subject: linked illustrative source, input, human-gate, and authorized-decision cards
  desire: reuse a decision safely without blindly repeating every step
  obstacle: an upstream dependency changes while the downstream decision still looks approved
  stakes: stale decisions can travel into later work
  change: mark impact pending and change disposition to review required/hold
  contradiction: historical authorization does not guarantee current validity
  escalation:
    - AUTHORIZED DECISION
    - SOURCE_OR_INPUT identified
    - VERSION_OR_MATERIAL changes
    - CHANGE_EVENT appears
    - DEPENDENCY_LINK and IMPACT_CHECK exposed
    - REVIEW_STATUS REQUIRED
    - DISPOSITION HOLD
