research:
  file: research/2026-08-20-pass198-browser-findings.md
  question: >-
    When a decision depends on upstream entities, inputs, or human checks, what should
    happen when one of those dependencies changes, expires, or can no longer be verified?
  decision_changed: >-
    Distinguish historical authorization from continued validity after a source, input,
    version, material, or human-gate dependency changes.
  sources:
    - id: R198-001
      title: 'W3C — PROV-DM: The PROV Data Model'
      url: https://www.w3.org/TR/prov-dm/
