      url: https://www.craftyarncouncil.com/standards
      accessed: '2026-08-20'
      limitation: Shared guidance and labeling standards; not a Stitch & Scale proof surface.
concept_difference:
  nearest_prior: triage-state
  changed_pain: >-
    A project can look ready while yarn, color, dye lot, quantity, source, availability window,
    sample size, timing, confirmer, or open material risk remains unclear.
  hook: A yarn name is not a material handoff.
  visual_metaphor: >-
    A polished READY project card reveals blank material-readiness lanes and changes to
    MATERIAL CHECK: OPEN while separate human gates remain visible.
  emotional_turn: 'Responsible readiness: tidy presentation gives way to visible confirmations and limits.'
  final_line: Name the material, the quantity, the window, and what still needs confirmation.
dramatic_engine:
  subject: fictional project card and separate yarn, colorway, dye-lot, quantity, source, availability, sample, timing, confirmer, and open-risk cards
  desire: know whether a material package can travel to the next human handoff without guessing
  obstacle: a polished project card says READY while material lanes are blank
  stakes: an incomplete material package can create confusion across instructions, samples, testing, submissions, and reader expectations
  change: 'replace READY with MATERIAL CHECK: OPEN'
  contradiction: a recognizable yarn name can still be insufficient for a handoff
  escalation:
    - READY
    - DYE_LOT
    - QUANTITY_BY_SIZE
    - SUPPLIER_OR_SOURCE
    - AVAILABILITY_WINDOW
    - SAMPLE_SIZE
    - REQUIRED_BY
    - OPEN_MATERIAL_RISK
    - MATERIAL_CHECK_OPEN
proof_surface: >-
