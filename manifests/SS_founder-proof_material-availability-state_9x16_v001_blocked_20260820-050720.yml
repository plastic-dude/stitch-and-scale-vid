claims:
  allowed:
    - A yarn name is not a material handoff.
    - A material handoff can preserve identity, dye lot, quantity, source, availability window, sample size, timing, confirmer, open risk, and status.
    - An open material question should remain visible as open.
  prohibited:
    - Stitch & Scale verifies inventory, predicts stock, confirms suppliers, guarantees availability, recommends yarn, authorizes substitutions, manages purchasing, prevents shortages, or establishes publication readiness.
    - A listed yarn is available, affordable, deliverable, or suitable without current evidence and scope.
    - A material record replaces gauge, calculation, technical editing, physical print review, chart readability, schematic scale, or test knitting.
    - A fictional material card is a real supplier, invoice, customer order, or current product record.
    - Revenue, adoption, accuracy, customer outcomes, final pricing, credentials, testimonials, urgency, or capabilities.
