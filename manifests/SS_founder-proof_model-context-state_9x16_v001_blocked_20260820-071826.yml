claims:
  allowed:
    - A photo can show the garment and still hide the context.
    - CYC asks designers to reconfirm sample size required to fit the photography model.
    - Body measurements, finished-garment measurements, ease, and schematics are distinct sizing concepts.
    - An image-context record is separate from fit, grading, technical editing, print, schematic, and test-knit proof.
  prohibited:
    - Stitch & Scale identifies garment size from a photo, matches a model to a sample, evaluates fit, verifies ease, validates grading, measures a body, checks size inclusion, approves photography, or guarantees outcomes.
    - A photo proves fit, grading accuracy, size inclusion, comfort, accessibility, or publication acceptance.
    - A fictional context card is current product UI, a real model record, publication asset, or customer data.
    - David is an accountant, lawyer, publisher, knitter, designer, pattern designer, technical editor, or tester.
    - Revenue, adoption, accuracy, customer outcomes, final pricing, credentials, testimonials, urgency, or unverified capabilities.
