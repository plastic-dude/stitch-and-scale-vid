research:
  file: research/2026-08-20-pass199-browser-findings.md
  question: >-
    When a record may be wrong, incomplete, or nonconforming, how can a workflow isolate
    it from unintended reuse while preserving the evidence needed to understand, correct,
    and re-review it?
  decision_changed: >-
    Distinguish controlled non-reuse with preserved correction evidence from deletion,
    silent carry-forward, or approval.
  sources:
    - id: R199-001
      title: 'GOV.UK Design System — Error message'
      url: https://design-system.service.gov.uk/components/error-message/
      accessed: '2026-08-20'
    - id: R199-002
      title: 'Craft Yarn Council — Designer Pitfalls'
      url: https://www.craftyarncouncil.com/pitfalls.html
      accessed: '2026-08-20'
    - id: R199-003
      title: 'Craft Yarn Council — You Want to Submit a Project Idea… Where Do You Start?'
      url: https://www.craftyarncouncil.com/idea.html
      accessed: '2026-08-20'
    - id: R199-004
      title: ISO 9001 nonconforming-output control research lead not used as primary citation
      url: https://www.iso.org/standard/62085.html
      accessed: '2026-08-20'
      status: secondary_lead_not_cited
concept_difference:
  nearest_prior: invalidation-state
  changed_pain: >-
    An uncertain or nonconforming record remains available for unintended reuse when
    its problem is known.
  hook: Do not erase the uncertain record. Isolate it before it travels.
  visual_metaphor: >-
    A record moves from the shared work area into a marked hold tray while reason,
    evidence, correction, scope, owner, and re-review remain attached.
  emotional_turn: >-
    Relief through controlled incompleteness rather than deletion or silent reuse.
  final_line: >-
    Keep the reason with the record, keep it out of reuse, and name what reopens it.
dramatic_engine:
  subject: uncertain illustrative record and marked hold tray
  desire: preserve the record for correction without letting it travel as ready
  obstacle: record looks reusable but reason, evidence, correction, scope, owner, and review are incomplete
  stakes: silent reuse can turn one unresolved record into a later assumption
  change: move record to hold, preserve reason/evidence, name correction and review path
  contradiction: a held record can remain useful without being approved or deleted
  escalation:
    - WORKING RECORD
    - REASON and EVIDENCE attached
    - HOLD DO NOT REUSE
    - CORRECTION and REUSE_SCOPE requested
    - REVIEW_OWNER and REVIEW_STATUS exposed
    - DISPOSITION HOLD
assets:
  approved_assets: pending
  permitted: original neutral cards, neutral tabletop, rights-cleared narrator, neutral foley
