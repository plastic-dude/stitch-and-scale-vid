claims:
  allowed:
    - An uncertain record can be preserved, explained, isolated, and reviewed before reuse.
    - A hold record can name reason, evidence, correction, reuse scope, review owner, review status, and disposition.
  prohibited:
    - Stitch & Scale has quarantine, hold, nonconforming-output control, archive isolation, reviewer assignment, or reuse restrictions.
    - A real record is wrong, complete, approved, or safe to reuse.
    - Quarantine replaces technical editing, print review, chart readability, schematic scale, or test knitting.
    - WCAG conformance or guaranteed accessibility.
    - Revenue, adoption, accuracy, customer outcomes, pricing, credentials, testimonials, urgency, or capabilities.
