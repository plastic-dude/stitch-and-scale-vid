research:
  file: research/2026-08-20-pass213-browser-findings.md
  question: >-
    How should an independent knitwear designer distinguish a recorded cost from
    an estimate, derived calculation, or assumption when samples, testing, editing,
    materials, postage, fees, and time feed into business decisions?
  decision_changed: >-
    Select record-estimate-state: keep recorded facts, estimates, derived values,
    and assumptions visibly distinct with source, date or period, formula, and review context.
