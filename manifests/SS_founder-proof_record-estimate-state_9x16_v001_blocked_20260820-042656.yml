concept_difference:
  nearest_prior: cross-reference-state
  changed_pain: >-
    A business number loses its status and source lineage when a recorded cost,
    estimate, derived calculation, and assumption are flattened into one confident total.
  hook: A number can be useful without being settled.
  visual_metaphor: >-
    Four separated lanes—RECORDED, ESTIMATED, DERIVED, and ASSUMED—refuse to merge
    without source and formula context.
  emotional_turn: 'Honest financial clarity: label what happened, what is forecast, what is calculated, and what remains assumed.'
  final_line: Name what happened, what you estimated, and what the formula still depends on.
proof_surface: >-
  REC X-001 / DESIGN_ID / LINE_ITEM / CATEGORY / AMOUNT_OR_QUANTITY / UNIT /
  CURRENCY / EVENT_DATE / SOURCE_NOTE / STATUS / RECORDED_AT / ESTIMATE_PERIOD /
  ASSUMPTION_NOTE / FORMULA_OR_DERIVATION / SOURCE_RECORD_ID / REVIEW_RECORD
dramatic_engine:
  subject: one fictional design ledger with a material receipt, projected testing time, and break-even view
  desire: let a designer see what a number means before relying on it in a business decision
  obstacle: recorded receipt, estimated testing time, derived view, and assumed sales volume are visually flattened
  stakes: a planning view can look settled when inputs remain estimated, incomplete, or unverified
  change: each value receives visible status, source note, date or period, and formula or assumption boundary
  contradiction: a formula can be mathematically clear while its inputs remain uncertain
  escalation:
    - LINE_ITEM
    - STATUS
    - SOURCE_NOTE
    - EVENT_DATE_OR_ESTIMATE_PERIOD
    - SOURCE_RECORD_ID
    - FORMULA_OR_DERIVATION
    - ASSUMPTION_NOTE
    - REVIEW_RECORD
