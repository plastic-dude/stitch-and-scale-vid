claims:
  allowed:
    - Recorded facts, estimates, derived values, and assumptions can be kept distinct.
    - SBA break-even guidance uses estimates and warns that planning analysis is not complete accounting before costs and production occur.
    - Craft workflow can involve notes, materials, samples, technical editing, schematics, invoices, submissions, and return shipping as distinct records or responsibilities.
  prohibited:
    - Stitch & Scale performs accounting, tax treatment, reconciliation, profitability prediction, financial decision-making, or background money movement.
    - Any displayed break-even or margin value is accurate, financially viable, or a recommended target.
    - Fictional values are product defaults, user records, revenue, pricing, or outcomes.
    - Business-record labels replace professional accounting or tax advice.
    - Record status replaces calculation, technical editing, physical print review, chart readability, schematic scale, or test knitting.
    - Revenue, adoption, customer outcomes, final pricing, credentials, testimonials, urgency, accuracy, or capabilities.
