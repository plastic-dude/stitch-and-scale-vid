  motif: restrained FIXED-to-REMEDIATION-RECORDED cue and neutral closure-not-shown hold
  room_tone: record before and after each setup
claims:
  allowed:
    - “Fixed” is a status word and is not by itself a remediation trail.
    - A remediation record can preserve finding, severity, scope, action, owner, evidence, retest, disposition, and residual limit.
    - A test or technical edit is one evidence lane and does not prove every size or edge case.
  prohibited:
    - Stitch & Scale detects defects, prioritizes risk, assigns owners, proposes remedies, records evidence, runs retests, verifies fixes, closes issues, or establishes publication readiness.
    - “Fixed” means correct, complete, safe, accessible, compatible, published, or approved.
    - A fictional defect, customer, tester, project, or incident record is real.
    - A technical edit, calculation, print review, chart review, schematic check, or test knit substitutes for another gate.
    - Revenue, adoption, accuracy, customer outcomes, final pricing, credentials, testimonials, urgency, or capabilities.
