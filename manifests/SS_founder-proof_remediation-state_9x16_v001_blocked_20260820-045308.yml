research:
  file: research/2026-08-20-pass217-browser-findings.md
  question: >-
    After a craft or pattern defect is found, what must a remediation record preserve
    about the finding, severity, affected scope, action, owner, evidence, retest,
    and closure before “fixed” can be treated as more than a status word?
  decision_changed: >-
    Select remediation-state: keep finding, severity, source, scope, reproduction,
    action, owner, evidence, retest, residual limit, disposition, and review visible.
  sources:
    - id: R217-001
      title: 'NIST — Technical Guide to Information Security Testing and Assessment'
      url: https://www.nist.gov/publications/technical-guide-information-security-testing-and-assessment
      accessed: '2026-08-20'
      limitation: Security-testing guide used as a process analogy, not a knitwear publication standard.
    - id: R217-002
      title: 'NIST — SP 800-61r3 Incident Response Recommendations and Considerations'
      url: https://nvlpubs.nist.gov/nistpubs/specialpublications/nist.sp.800-61r3.pdf
      accessed: '2026-08-20'
      limitation: Security-incident context; not Stitch & Scale incident-response capability.
    - id: R217-003
      title: 'CISA — New Directive Improving Prioritization of Vulnerability Mitigation'
      url: https://www.cisa.gov/news-events/news/cisa-issues-new-directive-improving-how-federal-agencies-prioritize-mitigation-cyber-vulnerabilities
      accessed: '2026-08-20'
      limitation: Applies to federal civilian cyber vulnerability management; not a Stitch & Scale mandate.
    - id: R217-004
      title: 'Craft Yarn Council — Congratulations! You’ve Received the Go Ahead'
      url: https://www.craftyarncouncil.com/industry.html
      accessed: '2026-08-20'
      limitation: Industry guidance; publication-specific requirements may differ.
    - id: R217-005
      title: 'Stitch & Scale knitwear QA operating guidance'
      url: https://github.com/plastic-dude/stitch-and-scale-vid
      accessed: '2026-08-20'
      limitation: Internal quality contract, not a current product-proof registry entry.
concept_difference:
  nearest_prior: selective-disclosure-state
  changed_pain: >-
    A record can say FIXED while leaving finding, severity, affected scope, action,
    owner, evidence, retest, disposition, and residual limit unclear.
  hook: Fixed is a status word. Remediation needs the trail.
  visual_metaphor: >-
    A fictional defect card stamped FIXED reveals blank severity, scope, action, owner,
    evidence, retest, and residual-limit lanes; it changes to REMEDIATION RECORDED while
    CLOSURE: NOT YET SHOWN remains visible.
  emotional_turn: 'Responsible closure: relief gives way to traceable correction and visible limits.'
  final_line: Name the finding, the remedy, the evidence, and what still needs review.
dramatic_engine:
  subject: one fictional defect card and separate finding, scope, action, owner, evidence, retest, limit, and disposition cards
  desire: understand whether a reported defect has a traceable remedy rather than a status label only
  obstacle: a green FIXED stamp appears while remediation lanes are blank
  stakes: a corrected-looking copy can travel as complete while the record cannot explain what changed or remains open
  change: replace FIXED with REMEDIATION RECORDED and keep CLOSURE NOT YET SHOWN
  contradiction: a remedy may be recorded without proving every size, edge case, chart, schematic, or human gate
  escalation:
    - FIXED
    - SEVERITY
    - AFFECTED_SCOPE
    - REPRODUCTION_STEPS
    - ACTION
    - ACCOUNTABLE_OWNER
    - EVIDENCE
    - RETEST_METHOD
    - RETEST_RESULT
    - RESIDUAL_LIMIT
    - DISPOSITION
    - CLOSURE_NOT_YET_SHOWN
proof_surface: >-
  REM X-001 / FINDING_ID / FINDING_TYPE / SEVERITY / SOURCE / EVIDENCE /
  AFFECTED_SCOPE / REPRODUCTION_STEPS / ACTION / ACCOUNTABLE_OWNER /
  DUE_OR_REVIEW_AT / RETEST_METHOD / RETEST_RESULT / RESIDUAL_LIMIT /
  DISPOSITION / REVIEW_RECORD / STATUS
assets:
  approved_assets: pending
  permitted: original neutral cards, fictional swatch or pattern fragment, neutral tabletop, rights-cleared narrator, neutral foley
  prohibited: real unpublished patterns, private tester comments, customer records, incident reports, publisher submissions, contracts, company names, personal identifiers, current UI captures, copyrighted patterns
  rights_clearance: required before generation
