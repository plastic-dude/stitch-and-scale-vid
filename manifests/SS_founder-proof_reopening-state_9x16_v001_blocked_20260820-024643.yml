title: Fixed is not the same as reviewed, and reviewed is not the same as cleared for this scope.
objective: >-
  Show that completing a correction does not itself clear a held record for reuse;
  reopening needs reviewed evidence, accountable ownership, defined scope, and a
  recorded disposition, without claiming that Stitch & Scale currently exposes
  corrective-action or clearance controls.
audience:
  primary: >-
    Independent knitwear designers and pattern publishers coordinating calculations,
    technical editing, physical print review, chart readability, schematic scale, test
    knitting, samples, swatches, revisions, tester feedback, submissions, and intended users.
  secondary: founding testers and reviewers
form: founder-proof-tabletop-explainer
assumption:
  objective: evidence-led founder proof
  audience: independent knitwear designers and pattern publishers
  tone: calm exact non-urgent candid
  distribution: organic 9:16 social placements; destination unconfirmed
  brief_tier: director-planner-blocked
founder_truth:
  david: >-
    David is a developer whose late mother knitted. He does not knit and must not be
    described as a knitter, knitwear designer, pattern designer, technical editor, or tester.
  human_gates:
    - calculation
    - technical editing
    - physical print review
    - chart readability
    - schematic scale
    - test knitting
product_truth:
  current_reopening_surface_verified: false
  proof_registry_entry: absent
  approved_capture: absent
  illustrative_surface: >-
    REOPEN A-001 / RECORD_ID / ORIGINAL_REASON / CORRECTION_EVIDENCE / REVIEW_RESULT /
    REVIEW_OWNER / REUSE_SCOPE / HUMAN_GATE_STATUS / DISPOSITION
  disclaimer: ILLUSTRATIVE — NOT PRODUCT UI
research:
  file: research/2026-08-20-pass200-browser-findings.md
  question: >-
    What evidence is needed to reopen a held record after correction, so that “fixed”
    is not mistaken for reviewed and cleared for reuse?
  decision_changed: >-
    Distinguish correction performed from reviewed clearance for a defined reuse scope.
  sources:
    - id: R200-001
      title: 'NIST CSRC Glossary — Corrective Action Plan'
      url: https://csrc.nist.gov/glossary/term/corrective_action_plan
      accessed: '2026-08-20'
    - id: R200-002
      title: 'GOV.UK Design System — Error message'
      url: https://design-system.service.gov.uk/components/error-message/
      accessed: '2026-08-20'
    - id: R200-003
      title: 'Craft Yarn Council — Congratulations! You’ve Received the Go Ahead'
      url: https://www.craftyarncouncil.com/industry.html
      accessed: '2026-08-20'
concept_difference:
  nearest_prior: quarantine-state
  changed_pain: >-
    A corrected held record is treated as cleared without reviewed evidence, accountable
    ownership, defined reuse scope, or separate human-gate confirmation.
  hook: Fixed is not the same as reviewed, and reviewed is not the same as cleared for this scope.
  visual_metaphor: >-
    A held record receives a correction tag, pauses at a review desk, and leaves only
    with a scoped disposition; the clearance stamp remains unused.
  emotional_turn: >-
    Disciplined relief through evidence-based clearance rather than a premature reopening.
  final_line: >-
    Show the correction, the reviewer, the scope, and the evidence that lets it reopen.
dramatic_engine:
  subject: held record with correction tag and unused clearance stamp
  desire: return corrected record to a defined workflow safely
  obstacle: correction is visible but review result, owner, scope, human-gate status, and disposition are incomplete
  stakes: a fixed mark can travel as universal clearance
  change: record pauses at review desk and remains on hold until scoped evidence supports disposition
  contradiction: correction can be complete while clearance remains undecided
  escalation:
    - HOLD
    - CORRECTION PERFORMED
    - REVIEW_RESULT requested
    - REVIEW_OWNER and REUSE_SCOPE exposed
    - HUMAN_GATE_STATUS separated
    - CLEARED FOR SCOPE remains unused
    - DISPOSITION HOLD
assets:
  approved_assets: pending
  permitted: original neutral cards, neutral tabletop, rights-cleared narrator, neutral foley
  prohibited: copyrighted pattern excerpts, private records, customer names, logos, private messages, current UI captures
  rights_clearance: required before generation
voice:
  narrator_family: one approved narrator family only
  status: pending approval
captions:
  caption_on_review: required
  caption_free_review: required
  human_review: required
  safe_area: pending destination confirmation
  obstruction_rule: captions must not cover faces, hands, proof, tables, numbers, logos, buttons, menus, or primary actions
audio:
  music: none unless rights-cleared and separately approved
  motif: restrained review-desk placement cue and neutral hold tone
  room_tone: record before and after each setup
platform:
  destination: unconfirmed
  matrix: platforms/SS_founder-proof_reopening-state_9x16_v001_matrix_20260820-024643.md
filename:
  reserved: SS_founder-proof_reopening-state_9x16_v001_blocked_20260820-024643.mp4
  overwrite: false
  duplicate_check: passed
claims:
  allowed:
    - Completing a correction does not itself clear a held record for every use.
    - A reopening record can name correction evidence, review result, owner, scope, human-gate status, and disposition.
  prohibited:
    - Stitch & Scale has corrective-action plans, clearance controls, reopening permissions, or release automation.
    - A real record is fixed, reviewed, cleared, or safe to reuse.
    - Reopening replaces technical editing, print review, chart readability, schematic scale, or test knitting.
    - WCAG conformance or guaranteed accessibility.
    - Revenue, adoption, customer outcomes, pricing, credentials, testimonials, urgency, accuracy, or capabilities.
acceptance_gates:
  - product_truth_and_current_proof
  - claims_and_founder_truth
  - human_evidence_boundaries
  - rights_and_privacy
  - narrator_family
  - caption_on
  - caption_free
  - audio_and_room_tone
  - destination_platform
  - mobile_readability
  - filename_and_continuity
  - director_reauthorization
blocker: >-
  No current versioned, non-private, rights-cleared product-proof registry entry or
  approved capture verifies the exact reopening/clearance surface; destination platform,
  rights, narrator, caption, audio, and final acceptance evidence also remain unconfirmed.
exact_generator_action: Do not generate or upload. Await Director re-authorization after proof and gate validation.
continuity:
