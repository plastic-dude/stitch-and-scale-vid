founder_truth:
  david: >-
    David is a developer whose late mother knitted. He does not knit and must not be
    described as a knitter, knitwear designer, pattern designer, technical editor, or tester.
  human_gates:
    - calculation
    - technical editing
    - physical print review
    - chart readability
    - schematic scale
    - test knitting
product_truth:
  current_result_boundary_surface_verified: false
  proof_registry_entry: absent
  approved_capture: absent
  illustrative_surface: >-
    BOUNDARY A-001 / EVIDENCE_CHAIN / INTENDED_USE / SAMPLE_OR_SCOPE /
    CHECK_PERFORMED / FINDING / UNCERTAINTY_OR_LIMITS / CANNOT_CONCLUDE /
    FIT_SCOPE / DISPOSITION
  disclaimer: ILLUSTRATIVE — NOT PRODUCT UI
research:
  file: research/2026-08-20-pass205-browser-findings.md
  question: >-
    How should a criteria-fit result state its limitations so that people do not
    reuse it outside the tested scope or infer certainty that the evidence does not support?
  decision_changed: >-
    Keep scope, uncertainty, limitations, and cannot-conclude boundaries attached to the result.
  sources:
    - id: R205-001
      title: 'NIST — Metrological Traceability: Frequently Asked Questions and Policy'
      url: https://www.nist.gov/metrology/metrological-traceability
      accessed: '2026-08-20'
    - id: R205-002
      title: 'UK Government Statistical Service — Communicating quality, uncertainty and change'
      url: https://analysisfunction.civilservice.gov.uk/policy-store/communicating-quality-uncertainty-and-change/
      accessed: '2026-08-20'
    - id: R205-003
      title: 'W3C WAI — WCAG Evaluation Methodology'
      url: https://www.w3.org/WAI/test-evaluate/conformance/wcag-em/
      accessed: '2026-08-20'
    - id: R205-004
      title: 'Craft Yarn Council — Reading Instructions & Other Basics'
      url: https://www.craftyarncouncil.com/read_instructions.html
      accessed: '2026-08-20'
concept_difference:
  nearest_prior: fit-criteria-state
  changed_pain: >-
    A criteria-fit result is reused outside its tested scope because limitations and
    cannot-conclude boundaries are detached or hidden.
  hook: A result without its boundary invites a use it never tested.
  visual_metaphor: >-
    A bright bounded frame around the tested use with a visible grey NOT EVALUATED
    area and a prominent CANNOT_CONCLUDE line.
  emotional_turn: Trust through honest boundaries rather than false certainty.
  final_line: Keep the result with its scope, its limits, and what it cannot prove.
dramatic_engine:
  subject: scoped finding card with bright tested frame and grey not-evaluated outside area
  desire: let a useful result travel without letting it become a universal claim
  obstacle: finding is legible but sample, scope, uncertainty, limitations, cannot-conclude, owner, and reuse boundary are incomplete
  stakes: a result separated from its limits can be reused for untested sizes, formats, gates, or purposes
  change: result stays attached to scope and caveats while outside area remains unavailable for inference
  contradiction: a result can be trustworthy within one boundary and still say nothing about another use
  escalation:
    - FINDING
    - EVIDENCE_CHAIN shown
    - INTENDED_USE named
    - SAMPLE_OR_SCOPE bounded
    - CHECK_PERFORMED stated
    - UNCERTAINTY_OR_LIMITS exposed
    - CANNOT_CONCLUDE added
    - FIT_SCOPE held
