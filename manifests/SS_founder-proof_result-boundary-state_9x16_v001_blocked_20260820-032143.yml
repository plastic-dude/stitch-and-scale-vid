claims:
  allowed:
    - A result should keep its tested scope, limitations, and cannot-conclude boundary attached.
    - A result-boundary record can name evidence chain, intended use, sample or scope, check, finding, limits, cannot-conclude, fit scope, and disposition.
  prohibited:
    - Stitch & Scale records uncertainty, produces traceable results, prevents reuse, or enforces result boundaries.
    - A real finding applies to untested sizes, formats, gates, or purposes.
    - A gauge result proves full pattern or project acceptance.
    - WCAG conformance or guaranteed accessibility.
    - Revenue, adoption, customer outcomes, pricing, credentials, testimonials, urgency, accuracy, or capabilities.
