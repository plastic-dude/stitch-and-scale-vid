title: A result without its boundary invites a use it never tested.
objective: >-
  Show that a criteria-fit result must carry its scope, uncertainty, limitations,
  and cannot-conclude boundary so it is not reused as universal proof, without
  claiming that Stitch & Scale currently records or enforces these fields.
