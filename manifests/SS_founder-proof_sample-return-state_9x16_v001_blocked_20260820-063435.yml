research:
  file: research/2026-08-20-pass222-browser-findings.md
  question: >-
    When a knitwear sample, swatch, or project leaves a designer’s control, what
    record distinguishes prepared, labeled, shipped, received, under review, returned,
    condition-checked, and custody-resolved instead of collapsing the event into sent or done?
  decision_changed: >-
    Select sample-return-state: keep identity, custody mode, current holder, destination,
    label, dispatch, receipt, review, return request, return time, return condition,
    unresolved reason, source, reviewer, review time, and status visible.
  sources:
    - id: R222-001
      title: 'Craft Yarn Council — Industry Standards & Guidelines'
      url: https://www.craftyarncouncil.com/idea.html
      accessed: '2026-08-20'
      evidence: >-
        Sample labeling, return-request envelope, postage responsibility, receipt
        confirmation, and a general 2–8 week review window are described.
      limitation: General industry guidance; company-specific instructions take precedence and no product surface is verified.
    - id: R222-002
      title: 'Craft Yarn Council — Congratulations! You’ve Received the Go Ahead'
      url: https://www.craftyarncouncil.com/industry.html
      accessed: '2026-08-20'
      evidence: >-
        Project labels, notes, yarn labels, sample size, finishing, gauge, instructions,
        schematics, invoices, and return of used and unused yarn are separated.
      limitation: Submission guidance; it does not establish Stitch & Scale behavior or guarantee return.
    - id: R222-003
      title: 'Knitty — Design or Write For Knitty; updated June 17, 2026'
      url: https://knitty.com/subguide.php
      accessed: '2026-08-20'
      evidence: >-
        Winter 2026 submissions are due September 15, 2026 for a December 2026 issue;
        the guide also describes a workflow where the sample never leaves the designer’s possession for photography.
      limitation: One publication’s current policy; not a universal custody rule or Stitch & Scale proof.
    - id: R222-004
      title: 'Asana Help — Reference custom fields'
      url: https://help.asana.com/s/article/reference-custom-fields
      accessed: '2026-08-20'
      evidence: General task systems document custom fields for project context.
      limitation: Not a full competitor audit and does not prove the product lacks sample-custody features.
    - id: R222-005
      title: 'Notion — Status property gives clarity on task progress'
      url: https://www.notion.com/help/guides/status-property-gives-clarity-on-tasks
      accessed: '2026-08-20'
      evidence: Public documentation describes status/progress properties.
      limitation: Generic status primitives do not by themselves prove physical receipt, condition, return, or current holder.
    - id: R222-006
      title: 'Notion — Database properties'
      url: https://www.notion.com/help/database-properties
      accessed: '2026-08-20'
      evidence: Public documentation describes properties such as owners, URLs, and timestamps.
      limitation: Not a full competitor audit and no superiority claim is permitted.
    - id: R222-007
      title: 'Instagram Help — Reel size & aspect ratios'
      url: https://help.instagram.com/1038071743007909
      accessed: '2026-08-20'
      evidence: Reels support 1.91:1 through 9:16, with minimum 30 fps and 720 pixels; recommended cover is 420x654.
      limitation: Recheck at approval; no upload is authorized.
    - id: R222-008
      title: 'YouTube Help — Add subtitles & captions'
      url: https://support.google.com/youtube/answer/2734796?hl=en
      accessed: '2026-08-20'
      evidence: Timed caption files and meaningful non-speech cues are supported by the guidance.
      limitation: Platform tooling does not replace human caption review or establish cross-platform behavior.
    - id: R222-009
      title: 'TikTok Newsroom — Introducing auto captions'
      url: https://newsroom.tiktok.com/en-us/introducing-auto-captions
      accessed: '2026-08-20'
      evidence: Auto captions can be edited and viewers can turn them off.
      limitation: Announcement is older and market/app support may vary; automatic text is draft-only.
    - id: R222-010
      title: 'W3C WAI — Understanding WCAG 2.2 SC 1.2.2 Captions'
      url: https://www.w3.org/WAI/WCAG22/Understanding/captions-prerecorded.html
      accessed: '2026-08-20'
      evidence: Captions include speech, speaker identification, meaningful non-speech information, and should not obscure relevant information.
      limitation: Accessibility guidance, not a claim of universal WCAG conformance or platform certification.
product_and_rights_decision: >-
  No current product-proof registry or approved non-private capture verifies a sample-custody
  surface. Use original illustrative props only; exclude real labels, addresses, courier data,
  private samples, customer records, and private UI. Rights/privacy clearance remains required.
concept_difference:
  nearest_prior: care-instruction-state
  changed_pain: >-
    A dispatch mark can look complete while receipt, current holder, custody mode, review,
    return request, return time, condition, and unresolved reason remain unknown.
  hook: A sample being sent is not the same as a sample being accounted for.
  visual_metaphor: >-
    A labeled fictional parcel moves from PREPARED to SENT, then stops at blank RECEIVED,
    RETURNED, and CONDITION CHECK lanes.
  emotional_turn: 'Responsible traceability: reassurance gives way to explicit custody states and an honest open condition.'
  final_line: Record where the sample is, who has it, and what happens next.
dramatic_engine:
  subject: fictional labeled parcel and sample-custody record
  desire: know whether a physical sample is accounted for across its custody lifecycle
  obstacle: SENT is easy to mark while holder, receipt, return, and condition remain blank
  stakes: a designer may not know whether a sample is retained, traveling, received, under review, or due back; no loss or customer outcome is claimed
  change: 'replace SENT = DONE with CUSTODY: OPEN'
  contradiction: a physical object can move while the record remains incomplete
  escalation:
    - IDENTITY
    - CUSTODY_MODE
    - DISPATCHED_AT
    - RECEIVED_AT
    - REVIEW_STATUS
    - RETURN_REQUESTED
    - RETURNED_AT
    - CONDITION_AT_RETURN
    - UNRETURNED_REASON
    - 'CUSTODY: OPEN'
  final_image: >-
    A fictional parcel beside a clearly illustrative record showing CURRENT_HOLDER: UNVERIFIED,
    RETURN_REQUESTED: UNCONFIRMED, and STATUS: OPEN.
proof_surface: >-
  SAMPLE S-001 / DESIGN_ID / SAMPLE_TYPE / CUSTODY_MODE / CURRENT_HOLDER / DESTINATION /
  LABEL_ID / DISPATCHED_AT / RECEIVED_AT / REVIEW_STATUS / RETURN_REQUESTED / RETURNED_AT /
  CONDITION_AT_RETURN / UNRETURNED_REASON / SOURCE_OR_BASIS / REVIEWER / REVIEWED_AT / STATUS
