claims:
  allowed:
    - A sample being sent is not the same as a sample being accounted for.
    - A custody record can separate identity, custody mode, holder, destination, dispatch, receipt, review, return, condition, open reason, reviewer, and status.
    - An illustrative record can keep an unknown state open.
  prohibited:
    - Stitch & Scale tracks sample location, shipments, delivery, current holder, return, condition, courier status, or reminders.
    - SENT proves receipt, review, return, recovery, or acceptance.
    - A sample was lost, damaged, stolen, unsafe, or caused a customer outcome.
    - Craft Yarn Council or Knitty rules apply universally to every submission.
    - A fictional custody card is current product UI or a private submission record.
    - David is a knitter, designer, pattern designer, technical editor, or tester.
    - Revenue, adoption, accuracy, customer outcomes, final pricing, credentials, testimonials, urgency, or unverified capabilities.
