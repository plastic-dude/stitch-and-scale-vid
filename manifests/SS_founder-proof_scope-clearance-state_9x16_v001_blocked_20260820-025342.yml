claims:
  allowed:
    - A reviewed clearance can be limited to one entity, purpose, or scope.
    - A scope record can name authorized entity, purpose, included gates, excluded gates, owner, effective scope, and disposition.
  prohibited:
    - Stitch & Scale has scoped permissions, access controls, authorization records, or release profiles.
    - A real record is cleared for a named entity or purpose.
    - Scope clearance replaces technical editing, print review, chart readability, schematic scale, or test knitting.
    - WCAG conformance or guaranteed accessibility.
    - Revenue, adoption, customer outcomes, pricing, credentials, testimonials, urgency, accuracy, or capabilities.
