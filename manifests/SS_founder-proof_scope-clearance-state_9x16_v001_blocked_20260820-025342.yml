founder_truth:
  david: >-
    David is a developer whose late mother knitted. He does not knit and must not be
    described as a knitter, knitwear designer, pattern designer, technical editor, or tester.
  human_gates:
    - calculation
    - technical editing
    - physical print review
    - chart readability
    - schematic scale
    - test knitting
product_truth:
  current_scope_clearance_surface_verified: false
  proof_registry_entry: absent
  approved_capture: absent
  illustrative_surface: >-
    SCOPE A-001 / RECORD_ID / AUTHORIZED_ENTITY / AUTHORIZED_PURPOSE / INCLUDED_GATES /
    EXCLUDED_GATES / REVIEW_OWNER / EFFECTIVE_SCOPE / DISPOSITION
  disclaimer: ILLUSTRATIVE — NOT PRODUCT UI
research:
  file: research/2026-08-20-pass201-browser-findings.md
  question: >-
    After a held record has been corrected and reviewed, how can a workflow make clear
    that permission to reuse it applies only to the checked entity, purpose, or scope
    rather than becoming universal release?
  decision_changed: >-
    Distinguish scoped permission for a checked entity and purpose from universal release.
  sources:
    - id: R201-001
      title: 'NIST CSRC Glossary — Authorization'
      url: https://csrc.nist.gov/glossary/term/authorization
      accessed: '2026-08-20'
    - id: R201-002
      title: 'GOV.UK Design System — Check answers'
      url: https://design-system.service.gov.uk/patterns/check-answers/
      accessed: '2026-08-20'
    - id: R201-003
      title: 'Craft Yarn Council — You Want to Submit a Project Idea… Where Do You Start?'
      url: https://www.craftyarncouncil.com/idea.html
      accessed: '2026-08-20'
    - id: R201-004
      title: 'Craft Yarn Council — Congratulations! You’ve Received the Go Ahead'
      url: https://www.craftyarncouncil.com/industry.html
      accessed: '2026-08-20'
concept_difference:
  nearest_prior: reopening-state
  changed_pain: >-
    A reviewed clearance is treated as universal release beyond the checked entity,
    purpose, or human gates.
  hook: Cleared for one use is not cleared for every use.
  visual_metaphor: >-
    A clearance lane is brightly bounded to one entity and purpose while neighboring
    uses and human gates remain visibly outside the decision.
  emotional_turn: >-
    Confidence through precision rather than the false comfort of a universal release stamp.
  final_line: >-
    Name the one use that passed, and leave every untested use outside the decision.
dramatic_engine:
  subject: reviewed record beside narrow clearance lane and excluded lanes
  desire: re-enter one defined use without authorizing everything around it
  obstacle: cleared label looks broad while entity, purpose, included gates, exclusions, owner, and scope are easy to miss
  stakes: scoped permission can be copied as universal release
  change: narrow the clearance to one illustrative entity and purpose while excluded uses remain outside
  contradiction: a record can be cleared and still be not cleared for neighboring uses
  escalation:
    - REVIEWED
    - AUTHORIZED_ENTITY named
    - AUTHORIZED_PURPOSE named
    - INCLUDED_GATES listed
    - EXCLUDED_GATES exposed
    - EFFECTIVE_SCOPE bounded
    - DISPOSITION HOLD FOR HUMAN CONFIRMATION
assets:
  approved_assets: pending
  permitted: original neutral cards, neutral tabletop, rights-cleared narrator, neutral foley
  prohibited: copyrighted pattern excerpts, private records, customer names, logos, private messages, current UI captures
  rights_clearance: required before generation
voice:
  narrator_family: one approved narrator family only
  status: pending approval
captions:
