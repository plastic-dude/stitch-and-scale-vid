  status: pending approval
captions:
  caption_on_review: required
  caption_free_review: required
  human_review: required
  safe_area: pending destination confirmation
  obstruction_rule: captions must not cover faces, hands, proof cards, names, numbers, labels, logos, buttons, menus, or primary actions
audio:
  music: none unless rights-cleared and separately approved
  motif: restrained field-hide cues and neutral exposure-review hold
  room_tone: record before and after each setup
claims:
  allowed:
    - Different viewers may need different fields from one craft or tester record.
    - Purpose, audience, necessity, visible fields, hidden fields, and exposure review can be recorded separately.
    - A selective view is not automatically privacy, consent, erasure, or legal compliance.
  prohibited:
    - Stitch & Scale automatically minimizes data, selects fields, redacts, pseudonymizes, enforces purpose limitation, checks compatible reuse, or controls audience access.
    - Selective exposure proves privacy, consent, lawful basis, erasure, retention compliance, or legal compliance.
    - A smaller view is always safer or sufficient.
    - Real contact details, tester comments, customer records, contracts, submissions, or personal identifiers appear in the video.
    - A selective view replaces calculation, technical editing, physical print review, chart readability, schematic scale, or test knitting.
    - Revenue, adoption, accuracy, customer outcomes, final pricing, credentials, testimonials, urgency, or capabilities.
