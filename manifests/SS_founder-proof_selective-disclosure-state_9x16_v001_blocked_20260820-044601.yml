research:
  file: research/2026-08-20-pass216-browser-findings.md
  question: >-
    When a craft or tester record contains more fields than each viewer needs, what
    must be explicit about purpose, audience, field exposure, redaction or pseudonymization,
    reuse, and review before the record is shown beyond its original workflow?
  decision_changed: >-
    Select selective-disclosure-state: keep purpose, audience, necessity, visible fields,
    hidden fields, redaction or role labels, reuse compatibility, and exposure review visible.
  sources:
    - id: R216-001
      title: 'ICO — Principle (b): Purpose limitation'
      url: https://ico.org.uk/for-organisations/uk-gdpr-guidance-and-resources/data-protection-principles/a-guide-to-the-data-protection-principles/purpose-limitation/
      accessed: '2026-08-20'
      limitation: Guidance under an evolving UK legal framework; not legal advice for this project.
    - id: R216-002
      title: 'ICO — Principle (c): Data minimisation'
      url: https://ico.org.uk/for-organisations/uk-gdpr-guidance-and-resources/data-protection-principles/a-guide-to-the-data-protection-principles/data-minimisation/
      accessed: '2026-08-20'
      limitation: Page says guidance is under review; not a product control specification.
    - id: R216-003
      title: 'NIST — Privacy Framework Core'
      url: https://www.nist.gov/document/nist-privacy-framework-version-1-core-pdf
      accessed: '2026-08-20'
      limitation: Voluntary framework; not Stitch & Scale implementation or certification.
    - id: R216-004
      title: 'Craft Yarn Council — Congratulations! You’ve Received the Go Ahead'
      url: https://www.craftyarncouncil.com/industry.html
      accessed: '2026-08-20'
      limitation: Industry workflow example; does not establish a Stitch & Scale viewer model.
concept_difference:
  nearest_prior: test-protocol-state
  changed_pain: >-
    A full record can expose unrelated names, contact details, private comments,
    submission information, or business data beyond the purpose and audience of a view.
  hook: The same record does not need to travel whole.
  visual_metaphor: >-
    One fictional full evidence card is filtered into TESTER REVIEW, EDITOR REVIEW,
    and PUBLIC HANDOFF windows, with hidden fields and role labels made explicit.
  emotional_turn: 'Responsible exposure: share what the purpose needs, not the whole record by habit.'
  final_line: Name the purpose, the audience, and the fields that do not need to travel.
dramatic_engine:
  subject: one fictional full evidence card and three audience-specific view windows
  desire: enable a useful handoff without exposing unrelated personal or project data
  obstacle: a full-card export tries to travel unchanged to every audience
  stakes: names, contact details, private comments, submission information, or unrelated business data can move beyond purpose
  change: each audience receives a purpose-specific field set and explicit hidden or role-labeled fields
  contradiction: a smaller view can still omit context needed for the purpose
  escalation:
    - FULL_RECORD
    - PURPOSE
    - AUDIENCE_OR_ROLE
    - NECESSITY_REASON
    - VISIBLE_FIELDS
    - HIDDEN_FIELDS
    - REDACTED_FIELDS
    - ROLE_LABEL
    - EXPOSURE_REVIEW_OPEN
proof_surface: >-
  DISC X-001 / SOURCE_RECORD_ID / PURPOSE / AUDIENCE_OR_ROLE / FIELD_SET /
  NECESSITY_REASON / VISIBLE_FIELDS / HIDDEN_FIELDS / REDACTED_FIELDS /
  PSEUDONYM_OR_ROLE_LABEL / REUSE_COMPATIBILITY / EXPOSURE_REVIEWER /
  REVIEWED_AT / STATUS
assets:
  approved_assets: pending
  permitted: original neutral cards, fictional role windows, neutral tabletop, rights-cleared narrator, neutral foley
  prohibited: real contact details, tester comments, customer records, personal identifiers, publisher submissions, contracts, company names, current UI captures, copyrighted patterns
  rights_clearance: required before generation
voice:
