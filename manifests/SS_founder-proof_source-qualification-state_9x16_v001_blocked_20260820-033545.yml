      url: https://www.craftyarncouncil.com/read_instructions.html
      accessed: '2026-08-20'
concept_difference:
  nearest_prior: evidence-lineage-state
  changed_pain: >-
    A source is identifiable and connected to a result, but its relevance, timeliness,
    validity, completeness, integrity, or method is not enough for this use.
  hook: A source can be real and still not be enough for this decision.
  visual_metaphor: >-
    A source card approaches a qualification gate while use and evidence dimensions
    remain visible before the decision lane opens.
  emotional_turn: 'Disciplined confidence: qualify before you rely.'
  final_line: Name the use, qualify the evidence, and keep the decision bounded when the basis is not enough.
dramatic_engine:
  subject: source card approaching a qualification gate before entering a decision lane
  desire: use a real-looking source without overclaiming what it can support
  obstacle: source exists but intended use, relevance, timeliness, validity, completeness, integrity, sample coverage, and method are incomplete
  stakes: a named source can become false confidence when stale, irrelevant, incomplete, unverified, or unsupported by required human activity
  change: source remains outside the decision lane until use-specific qualification is visible; disposition stays held when basis is insufficient
  contradiction: an evidence item can be authentic and still be irrelevant or insufficient for this question
  escalation:
    - SOURCE_ID
    - INTENDED_USE named
    - RELEVANCE checked
    - TIMELINESS checked
    - VALIDITY checked
    - COMPLETENESS checked
    - ACCURACY_BASIS named
    - QUALIFICATION_METHOD exposed
    - SAMPLE_COVERAGE exposed
    - CUSTODY_OR_INTEGRITY held
    - QUALIFICATION_STATUS set
