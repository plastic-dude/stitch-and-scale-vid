    - Data or evidence quality is use-specific and may involve relevance, timeliness, validity, completeness, accuracy, sample, method, and integrity.
    - A qualification record can name source, intended use, dimensions, method, sample coverage, source state, integrity, status, and disposition.
  prohibited:
    - Stitch & Scale qualifies sources, scores evidence, validates source fitness, or blocks unsupported decisions.
    - A named source is relevant, current, valid, complete, accurate, or sufficient for a real product decision.
    - A source qualification replaces calculation, technical editing, print review, chart readability, schematic scale, or test knitting.
    - WCAG conformance or guaranteed accessibility.
    - Revenue, adoption, customer outcomes, pricing, credentials, testimonials, urgency, accuracy, or capabilities.
