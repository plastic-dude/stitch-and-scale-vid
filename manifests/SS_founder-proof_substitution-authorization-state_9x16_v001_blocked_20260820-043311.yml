claims:
  allowed:
    - Gauge is one question in a substitution decision.
    - Fiber, structure, row behavior, care, availability, confirmation, disclosure, and review may need separate records.
    - A swatch can support an observation without proving permission, identical behavior, or publication readiness.
  prohibited:
    - Stitch & Scale recommends, validates, approves, detects, or authorizes a substitute.
    - Stitch & Scale checks dye lots or availability, obtains permission, or replaces an editor, technical editor, calculator, test knitter, physical print reviewer, chart-readability reviewer, or schematic-scale reviewer.
    - A substitute has identical fit, drape, durability, care behavior, compatibility, correctness, accessibility, or publication readiness.
    - Any fictional yarn, gauge, swatch, size, color, or number is a real product, default, recommendation, or test result.
    - Revenue, adoption, accuracy, customer outcomes, final pricing, credentials, testimonials, urgency, or capabilities.
