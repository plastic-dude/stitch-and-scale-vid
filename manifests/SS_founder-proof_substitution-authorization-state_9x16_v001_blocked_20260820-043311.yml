concept_difference:
  nearest_prior: record-estimate-state
  changed_pain: >-
    A substitute can appear to reach a gauge while fit evidence, confirmation scope,
    disclosure location, and human review status remain absent or silently assumed.
  hook: A substitute can fit the gauge and still need a record.
  visual_metaphor: >-
    A substitute card approaches an APPROVED lane while FIT EVIDENCE, CONFIRMATION SCOPE,
    DISCLOSURE LOCATION, and REVIEW RECORD lanes stop the shortcut.
  emotional_turn: 'Responsible material clarity: fit, confirmation, disclosure, and review remain separate human questions.'
  final_line: Name what fits, who confirmed it, where it is disclosed, and what remains to review.
proof_surface: >-
  SUB X-001 / DESIGN_ID / ORIGINAL_YARN / SUBSTITUTE_YARN / FIBER_AND_STRUCTURE /
  GAUGE_TARGET / SWATCH_RESULT / ROW_GAUGE / CARE_OR_BEHAVIOR_NOTE /
  DYE_LOT_OR_COLORWAY / AVAILABILITY_CHECK / CONFIRMING_ROLE / CONFIRMATION_SCOPE /
  CONFIRMED_AT / DISCLOSURE_LOCATION / REVIEWER_OR_TESTER / REVIEW_RECORD / STATUS
dramatic_engine:
  subject: one fictional substitute-yarn card, original-yarn card, swatch, confirmation, disclosure, and review cards
  desire: let a designer see what is known and what still needs confirmation before a substitute travels
  obstacle: substitute reaches a gauge target and a green approval stamp appears too early
  stakes: a material choice can be treated as identical or authorized beyond its evidence
  change: replace approval with fit observation, confirming role and scope, disclosure location, reviewer, and pending status
  contradiction: a swatch can support a fit observation without proving permission, identical behavior, or publication readiness
  escalation:
    - FIT_EVIDENCE
    - FIBER_AND_STRUCTURE
    - ROW_GAUGE
    - CARE_OR_BEHAVIOR_NOTE
    - CONFIRMING_ROLE
    - CONFIRMATION_SCOPE
    - DISCLOSURE_LOCATION
    - REVIEW_RECORD
    - STATUS
