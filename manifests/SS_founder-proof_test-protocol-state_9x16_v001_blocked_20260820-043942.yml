research:
  file: research/2026-08-20-pass215-browser-findings.md
  question: >-
    What must a knitwear test record preserve about inputs, method, conditions,
    scope, observer, result, uncertainty, and limits before a test result can be
    interpreted or repeated without being mistaken for publication clearance?
  decision_changed: >-
    Select test-protocol-state: keep question, scope, inputs, method, conditions,
    observer, result, uncertainty, limit, and follow-up visible around a test record.
  sources:
    - id: R215-001
      title: 'National Academies — Understanding Reproducibility and Replicability'
      url: https://www.nationalacademies.org/read/25303/chapter/6
      accessed: '2026-08-20'
      limitation: Scientific framework used as a documentation analogy, not a knitting certification.
    - id: R215-002
      title: 'NCBI Bookshelf — Reproducibility and Replicability in Science'
      url: https://www.ncbi.nlm.nih.gov/books/NBK547531/
      accessed: '2026-08-20'
      limitation: Scientific evidence boundary; not product proof for Stitch & Scale.
    - id: R215-003
      title: 'Craft Yarn Council — Congratulations! You’ve Received the Go Ahead'
      url: https://www.craftyarncouncil.com/industry.html
      accessed: '2026-08-20'
      limitation: Industry guidance; company or publication-specific instructions may differ.
    - id: R215-004
      title: 'Craft Yarn Council — Hooks & Needles'
      url: https://www.craftyarncouncil.com/standards/hooks-and-needles
      accessed: '2026-08-20'
      limitation: Gauge comparison is one evidence step and does not prove publication readiness.
    - id: R215-005
      title: 'Stitch & Scale knitwear QA operating guidance'
      url: https://github.com/plastic-dude/stitch-and-scale-vid
      accessed: '2026-08-20'
      limitation: Internal quality contract, not current product proof.
concept_difference:
  nearest_prior: substitution-authorization-state
  changed_pain: >-
    A test result can be favorable and still be uninterpretable if its question,
    scope, inputs, method, conditions, observer, uncertainty, and limit are missing.
  hook: A test result needs the conditions that make it readable.
  visual_metaphor: >-
    A green PASSED stamp is replaced by RESULT: OBSERVED and STATUS: REVIEW BOUNDARY OPEN
    when protocol fields are blank.
  emotional_turn: 'Responsible interpretation: a result is bounded by the question, method, conditions, scope, and limit.'
  final_line: Name what was tested, under which conditions, and what the result still cannot prove.
dramatic_engine:
  subject: one fictional test card, pattern-version card, size card, swatch, method card, conditions card, observer card, result card, and limit card
  desire: let a designer or reviewer understand what a recorded result can support
  obstacle: a green PASSED stamp appears before protocol fields are known
  stakes: a favorable result can be treated as universal or publication-ready beyond its evidence
  change: replace PASSED with RESULT OBSERVED and STATUS REVIEW BOUNDARY OPEN
  contradiction: a recorded result may be real and still not answer the question or scope someone wants answered
  escalation:
    - QUESTION
    - PATTERN_VERSION
    - SIZE_OR_SCOPE
    - METHOD
    - CONDITIONS
    - OBSERVER_OR_TESTER
    - OBSERVATION
    - RESULT
    - UNCERTAINTY
    - LIMIT
    - FOLLOW_UP
    - STATUS
