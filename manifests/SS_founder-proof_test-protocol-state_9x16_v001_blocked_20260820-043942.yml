claims:
  allowed:
    - A test result is easier to interpret when question, scope, inputs, method, conditions, observer, result, uncertainty, and limit are visible.
    - A result may be real without proving every size, edge case, construction, chart, schematic, fit, or user context.
    - A gauge swatch is one evidence step and does not prove finished correctness or publication readiness.
  prohibited:
    - Stitch & Scale runs, repeats, evaluates, scores, certifies, approves, or guarantees tests or reproducibility.
    - Stitch & Scale detects missing protocol fields or replaces calculation, technical editing, physical print review, chart readability, schematic scale, or test knitting.
    - Exact reproduction proves correctness, publication readiness, or every size or edge case.
    - Any fictional pattern version, size, gauge, timestamp, observation, result, or number is a real product record or test result.
    - Revenue, adoption, accuracy, customer outcomes, final pricing, credentials, testimonials, urgency, or capabilities.
