  room_tone: record before and after each setup
claims:
  allowed:
    - First found is not always first to fix.
    - An evidence-based order can show scope, consequence, urgency signal, dependency, uncertainty, rationale, owner, and review time.
    - A provisional order is a reasoned position, not a permanent truth.
  prohibited:
    - Stitch & Scale prioritizes findings, predicts impact, assigns urgency, recommends release order, blocks publication, or replaces human authority.
    - Severity alone proves urgency or order.
    - A fictional card is a real defect, consequence, customer outcome, or product decision.
    - A triage board replaces calculation, technical editing, physical print review, chart readability, schematic scale, or test knitting.
    - Revenue, adoption, accuracy, customer outcomes, final pricing, credentials, testimonials, urgency, or capabilities.
