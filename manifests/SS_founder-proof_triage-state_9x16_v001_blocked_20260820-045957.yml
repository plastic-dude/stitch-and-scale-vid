research:
  file: research/2026-08-20-pass218-browser-findings.md
  question: >-
    When several craft or pattern findings compete for attention, what evidence
    should justify their order before a team treats one as urgent, blocks a release,
    or starts remediation?
  decision_changed: >-
    Select triage-state: keep scope, consequence, urgency signal, dependency,
    uncertainty, rationale, owner, review time, and status visible behind any order.
  sources:
    - id: R218-001
      title: 'NIST — SP 800-30 Guide for Conducting Risk Assessments'
      url: https://csrc.nist.gov/pubs/sp/800/30/r1/final
      accessed: '2026-08-20'
      limitation: Risk-assessment guidance used as a process analogy, not a knitwear publication standard.
    - id: R218-002
      title: 'CISA — BOD 26-04: Prioritizing Security Updates Based on Risk'
      url: https://www.cisa.gov/news-events/directives/bod-26-04-prioritizing-security-updates-based-risk
      accessed: '2026-08-20'
      limitation: Applies to federal civilian cyber systems; not a Stitch & Scale mandate or capability.
    - id: R218-003
      title: 'Craft Yarn Council — Designer Pitfalls'
      url: https://www.craftyarncouncil.com/pitfalls.html
      accessed: '2026-08-20'
      limitation: Industry guidance; it does not verify a current triage feature.
    - id: R218-004
      title: 'Craft Yarn Council — Congratulations! You’ve Received the Go Ahead'
      url: https://www.craftyarncouncil.com/industry.html
      accessed: '2026-08-20'
      limitation: Industry guidance; publication-specific requirements may differ.
concept_difference:
  nearest_prior: remediation-state
  changed_pain: >-
    Several findings compete at once, but their order is not explainable from evidence,
    scope, consequence, urgency signal, dependency, uncertainty, rationale, owner,
    and review time.
  hook: First found is not always first to fix.
  visual_metaphor: >-
    Five fictional finding cards arrive in a FIRST IN stack, then move to an evidence-bound
    triage board where one card is provisionally ORDER: 01 — REVIEW REQUIRED while the others remain visible.
  emotional_turn: 'Responsible ordering: urgency becomes explainable rather than loud.'
  final_line: Name the evidence, the consequence, and why this finding goes first.
dramatic_engine:
  subject: five fictional finding cards for gauge, stitch count, measurement, chart, and schematic issues
  desire: decide which finding deserves attention first without losing the others or inventing urgency
  obstacle: all cards arrive together and the first-in stack competes with evidence
  stakes: a weakly justified order can delay a wider-scope issue or overreact to a narrow issue
  change: replace FIRST IN with an evidence-bound triage board
  contradiction: a finding can be important without being first, and a first position can remain provisional
  escalation:
    - FIRST_IN
    - AFFECTED_SCOPE
    - CONSEQUENCE
    - EVIDENCE
    - URGENCY_SIGNAL
    - DEPENDENCY
    - UNCERTAINTY
    - PRIORITY_RATIONALE
    - ORDER_REVIEW_REQUIRED
proof_surface: >-
  TRI X-001 / FINDING_ID / FINDING_TYPE / AFFECTED_SCOPE / EVIDENCE /
  CONSEQUENCE / URGENCY_SIGNAL / DEPENDENCY / UNCERTAINTY /
  PRIORITY_RATIONALE / ORDER / DECISION_OWNER / REVIEW_AT / STATUS
