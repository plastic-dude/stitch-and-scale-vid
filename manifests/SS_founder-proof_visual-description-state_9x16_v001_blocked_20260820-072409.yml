    - technical editing
    - physical print review
    - chart readability
    - schematic scale
    - care review
    - test knitting
research:
  file: research/2026-08-20-pass227-browser-findings.md
  question: >-
    When a knitwear pattern image is consumed without reliable visual or audio context, what description preserves
    the relevant design information without pretending to replace the pattern, chart, schematic, technical edit, or human review?
  decision_changed: >-
    Select visual-description-state: isolate purpose, short description, key features, relationships, long description,
    audio description, caption, pattern/chart/schematic references, limitations, language, rights, and review.
  sources:
    - id: R227-001
      title: 'W3C WAI — Informative Images'
      url: https://www.w3.org/WAI/tutorials/images/informative/
      accessed: '2026-08-20'
      evidence: A simple informative image may need a short text alternative conveying its meaning.
      limitation: Accessibility guidance, not product proof or universal editorial policy.
    - id: R227-002
      title: 'W3C WAI — Complex Images'
      url: https://www.w3.org/WAI/tutorials/images/complex/
      accessed: '2026-08-20'
      evidence: Complex images may need longer descriptions exposing relevant structure and relationships.
      limitation: Description scope depends on intended use; not every detail belongs in every alternative.
    - id: R227-003
      title: 'W3C WAI — Understanding SC 1.2.5 Audio Description'
      url: https://www.w3.org/WAI/WCAG22/Understanding/audio-description-prerecorded.html
      accessed: '2026-08-20'
      evidence: Audio description conveys important actions, scene changes, on-screen text, and visual content in synchronized media.
      limitation: Guidance is not platform support, certification, or product conformance.
    - id: R227-004
      title: 'Knitty — Design or Write For Knitty; updated June 17, 2026'
      url: https://knitty.com/subguide.php
      accessed: '2026-08-20'
      evidence: Current submission guidance requests clean images, clear detail views, visible relevant design features, pattern files, charts, schematics, and rights statements.
      limitation: One publication’s workflow; not urgency, affiliation, or Stitch & Scale proof.
    - id: R227-005
      title: 'Instagram Help — Reel size & aspect ratios'
      url: https://help.instagram.com/1038071743007909
      accessed: '2026-08-20'
      evidence: Reels support 1.91:1 through 9:16, with minimum 30 fps and 720 pixels.
      limitation: Recheck at approval; no upload is authorized.
    - id: R227-006
      title: 'TikTok Support — Accessibility for your videos'
      url: https://support.tiktok.com/en/using-tiktok/creating-videos/accessibility
      accessed: '2026-08-20'
      evidence: Auto-generated captions can be edited or removed.
      limitation: Market/app support may vary; automatic text is draft-only.
    - id: R227-007
      title: 'YouTube Help — Add subtitles & captions'
      url: https://support.google.com/youtube/answer/2734796?hl=en
      accessed: '2026-08-20'
      evidence: Timed captions and meaningful non-speech cues are supported by the guidance.
      limitation: Platform tooling does not replace human caption review or establish product accessibility.
product_and_rights_decision: >-
  No current product-proof registry or approved non-private capture verifies a Stitch & Scale description surface.
  Use an original abstract image and fictional description cards only; exclude real charts, schematics, patterns,
  garments, publication photos, customer records, logos, and private data. Rights/privacy clearance remains required.
concept_difference:
  nearest_prior: model-context-state
  changed_pain: >-
    A caption, short label, audio description, pattern, chart, or schematic can be mistaken for the complete meaning of an image.
  hook: A caption is not the whole description.
  visual_metaphor: >-
    IMAGE DESCRIPTION splits into SHORT_DESCRIPTION, PURPOSE, KEY_FEATURES, RELATIONSHIPS, LONG_DESCRIPTION, and LIMITATIONS.
  emotional_turn: 'Responsible specificity: familiar text confidence gives way to purpose, structure, limitation, and human review.'
  final_line: Name what the image needs to say—and what it cannot replace.
dramatic_engine:
  subject: a fictional image-description card attached to an abstract knitwear image
  desire: make relevant visual information available without overloading or misleading the reader
  obstacle: short text may omit relationships and a description is not the pattern, chart, schematic, technical edit, or test knit
  stakes: viewers may mistake one layer for complete pattern or accessibility evidence; no real failure is claimed
  change: 'replace IMAGE = DESCRIPTION with IMAGE DESCRIPTION: UNVERIFIED'
  contradiction: more words do not automatically create better description; scope depends on image purpose
  escalation:
    - IMAGE_DESCRIPTION
    - PURPOSE
    - KEY_FEATURES_AND_RELATIONSHIPS
    - LONG_DESCRIPTION
    - AUDIO_DESCRIPTION_AND_CAPTION_TEXT
    - PATTERN_CHART_SCHEMATIC_REFERENCES
    - LIMITATIONS_AND_STATUS
    - 'IMAGE DESCRIPTION: UNVERIFIED'
  final_image: >-
    IMAGE DESCRIPTION: UNVERIFIED remains beside separate pattern, chart, schematic, and human-gate cards;
    every prop reads ILLUSTRATIVE — NOT PRODUCT UI.
proof_surface: >-
  IMAGE D-001 / DESIGN_ID / IMAGE_ID / PURPOSE / SHORT_DESCRIPTION / KEY_FEATURES / RELATIONSHIPS /
  LONG_DESCRIPTION / AUDIO_DESCRIPTION / CAPTION_TEXT / PATTERN_REFERENCE / CHART_REFERENCE /
  SCHEMATIC_REFERENCE / LIMITATIONS / LANGUAGE / SOURCE_OR_BASIS / RIGHTS_SCOPE / REVIEWER /
  REVIEWED_AT / STATUS
