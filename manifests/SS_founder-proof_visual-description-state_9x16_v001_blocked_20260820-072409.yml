  motif: soft card slide, held pause before long description, silence on unverified status
  room_tone: record before and after each setup
claims:
  allowed:
    - A simple informative image may need a short text alternative.
    - A complex image may need a longer description exposing relevant structure and relationships.
    - Audio description can convey important visual information in synchronized media.
    - Description is separate from pattern, chart, schematic, technical editing, and test knitting.
  prohibited:
    - Stitch & Scale automatically creates alt text, long descriptions, audio description, accessible pattern content, or WCAG conformance.
    - A description replaces pattern text, chart, schematic, technical edit, or test knitting.
    - A description proves accessibility conformance, reader understanding, or publication acceptance.
    - A fictional description card is current product UI, customer data, or a real pattern record.
    - David is an accountant, lawyer, publisher, knitter, designer, pattern designer, technical editor, or tester.
    - Revenue, adoption, accuracy, customer outcomes, final pricing, credentials, testimonials, urgency, or unverified capabilities.
